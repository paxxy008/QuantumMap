<style>
/* FONDO GALAXIA - ARREGLADO, AHORA SI SE VE */
body{margin:0;background:#000;color:#0ff;font-family:'Courier New',monospace;overflow:hidden}
#map{
position:relative;width:100vw;height:100vh;
background: #000 url('./Galaxy_Quantum_Main_Map.png') center center / cover no-repeat fixed;
background-color:#02020a;
}
.planet{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;transition:0.2s;z-index:3}
.planet img{width:44px;height:44px;filter:drop-shadow(0 0 8px currentColor);transition:0.2s}
.planet:hover img{transform:scale(1.4);filter:drop-shadow(0 0 18px currentColor)}
.planet .label{font-size:10px;margin-top:4px;text-shadow:0 0 6px #000;font-weight:bold}
/* GLITCH SOLO PARA IMAGEN INTERNA DEL DETALLE, NO PARA EL MAPA */

0%{filter:hue-rotate(0deg) contrast(1)} 10%{filter:hue-rotate(90deg) contrast(1.5) drop-shadow(2px 0 #f00)} 20%{filter:hue-rotate(-20deg)} 100%{filter:hue-rotate(0deg)}
}
.glitch-img{animation:glitchInner 0.6s infinite}
 #title{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);

padding:12px 35px;

 }

<body>

// MOTOR SONIDO - SIN DRONE MOLESTO
// Antes tenia un sawtooth 54Hz en loop que te taladraba el oido - BORRADO
// Ahora solo suenan los clicks UI, y un ambiente relajante opcional muy bajo
let audioCtx=null, audioEnabled=true;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function toggleAudio(){
initAudio(); audioEnabled=!audioEnabled;
document.getElementById('audio-controls').innerText=audioEnabled?'🔊 AUDIO UI ON':'🔇 AUDIO OFF';
}
function cyberTone(freq,type,vol,dur,glideTo=null){
if(!audioEnabled||!audioCtx) return;
const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
o.type=type; o.frequency.value=freq; f.type='lowpass'; f.frequency.value=4000;
o.connect(f); f.connect(g); g.connect(audioCtx.destination);
const now=audioCtx.currentTime;
g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vol,now+0.01);
if(glideTo) o.frequency.linearRampToValueAtTime(glideTo,now+dur);
g.gain.exponentialRampToValueAtTime(0.001,now+dur);
o.start(now); o.stop(now+dur);
}
function playHover(){ initAudio(); cyberTone(900,'sine',0.12,0.1,1300); } // suave
function playClick(){ initAudio(); cyberTone(300,'sine',0.2,0.12,500); } // click limpio, no square molesto
function playClose(){ initAudio(); cyberTone(600,'sine',0.15,0.15,200); }
function playSubmenu(){ initAudio(); cyberTone(1100,'sine',0.1,0.08,1400); }
function playHyperspace(){ initAudio(); cyberTone(200,'sine',0.18,0.3,800); } // sin sawtooth
function playBoot(){ initAudio(); cyberTone(400,'sine',0.15,0.2,700); }

{id:"geonosis",name:"GEONOSIS",x:70,y:62,color:"#ff8844",img:"./Geonosis_QP.png",imgDetail:"./Geonosis_QP.png",unitImg:"./Geonosis_QP.png",status:"separatist",statusText:"COLMENA FABRICA",sector:"Arkanis",desc:"Fábrica 1M droides día.",stats:{poblacion:"100M",clima:"Rocoso",recursos:"Fábrica",afiliacion:"Separatista"},forces:{guarnicion:"1M droides",flota:"12 Lucrehulk",amenaza:92},units:[{name:"Colmena",count:"1M - Poggle",pct:96,color:"red"}]},
{id:"mandalore",name:"MANDALORE",x:62,y:32,color:"#aa66ff",img:"./Mandalore_QP.png",imgDetail:"./Mandalore_Main.png",unitImg:"./Mandalore_troops.png",status:"mandalore",statusText:"NEUTRAL ARMADO",sector:"Mandalore",desc:"Satine vs Death Watch Pre Vizsla Beskar.",stats:{poblacion:"4M",clima:"Cúpulas",recursos:"Beskar",afiliacion:"Neutral"},forces:{guarnicion:"500k Death Watch",flota:"Gauntlet",amenaza:90},units:[{name:"Death Watch",count:"500k - Vizsla",pct:94,color:"purple"}]},
{id:"mustafar",name:"MUSTAFAR",x:88,y:84,color:"#ff2222",img:"./Mustafar_planet.png",imgDetail:"./Mustafar_main.png",unitImg:"./Mustafar_main.png",status:"separatist",statusText:"FORJA 800°C",sector:"Atravis",desc:"Lava 800C Forjas Tecno Union.",stats:{poblacion:"20k",clima:"Volcánico",recursos:"Forja",afiliacion:"Separatista"},forces:{guarnicion:"150k Forja",flota:"Cargueros",amenaza:90},units:[{name:"Guardia Forja",count:"150k",pct:92,color:"red"}]},

{id:"pulsar",name:"PULSAR",x:93,y:50,color:"#00ffcc",img:"./Pulsar_QP.png",imgDetail:"./Pulsar_QP.png",unitImg:"./Pulsar_QP.png",status:"alpha",statusText:"BASTION ALPHA",sector:"Black Level",desc:"Base secreta QP ORACLE stealth nebulosa iones.",stats:{poblacion:"45k ALPHA",clima:"Nebulosa",recursos:"Stealth",afiliacion:"Black Ops"},forces:{guarnicion:"3.2k Sombra",flota:"3 Venator Stealth",amenaza:95},units:[{name:"Operadores Sombra",count:"3.2k ALPHA",pct:98,color:"green"}],main:true}
];
const routes=[
{from:"pulsar",to:"coruscant",color:"#00ffcc",dash:false,width:2.5},
{from:"hoth",to:"umbara",color:"#ccffff",dash:false,width:2.5},
{from:"coruscant",to:"anaxes",color:"#00ff88",dash:false,width:2},
{from:"anaxes",to:"kamino",color:"#00ff88",dash:false,width:2},
{from:"anaxes",to:"felucia",color:"#00ff88",dash:false,width:2},
{from:"coruscant",to:"tatooine",color:"#ffcc00",dash:false,width:2},
{from:"tatooine",to:"mandalore",color:"#ffcc00",dash:false,width:2},
{from:"mandalore",to:"coruscant",color:"#ffcc00",dash:false,width:2},
{from:"tatooine",to:"geonosis",color:"#ffcc00",dash:false,width:2},
{from:"anaxes",to:"umbara",color:"#ff3333",dash:true,width:2},
{from:"umbara",to:"felucia",color:"#ff3333",dash:true,width:2},

  function renderPlanets(){
const layer=document.getElementById('planets-layer');
layer.innerHTML='';
planets.forEach(p=>{
const div=document.createElement('div');
div.className='planet'; // SIN clase separatist, no se mueve en mapa
div.style.left=p.x+'%'; div.style.top=p.y+'%'; div.style.color=p.color;
div.innerHTML=`<img src="${p.img}"><div class="label" style="color:${p.color}">${p.name}</div>`;
div.onmouseenter=()=>playHover();
div.onclick=()=>{playClick(); showDetail(p);};
layer.appendChild(div);
});
renderLegionMenu();
}
function renderLegionMenu(){
// MENU IZQ RESTAURADO - Lista de todas las unidades
const list=document.getElementById('legion-list');
list.innerHTML='';
planets.forEach(p=>{
p.units.forEach(u=>{
const d=document.createElement('div');
d.className='legion-item';
d.innerText=`${p.name} - ${u.name}`;
d.onclick=()=>{ playClick(); showDetail(p); };
list.appendChild(d);
});
});
}
function renderRoutes(){
const canvas=document.getElementById('routes');
const ctx=canvas.getContext('2d');
function resize(){ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; draw(); }
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
routes.forEach(r=>{
const a=planets.find(x=>x.id===r.from), b=planets.find(x=>x.id===r.to);
if(!a||!b) return;
ctx.beginPath(); ctx.strokeStyle=r.color; ctx.lineWidth=r.width; ctx.globalAlpha=0.85; ctx.shadowBlur=10; ctx.shadowColor=r.color;
if(r.dash) ctx.setLineDash([10,7]); else ctx.setLineDash([]);
ctx.moveTo(a.x/100*canvas.width, a.y/100*canvas.height);
ctx.lineTo(b.x/100*canvas.width, b.y/100*canvas.height);
ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1; ctx.shadowBlur=0;
});
}
window.addEventListener('resize',resize); resize();
}
let currentId=null;
function showDetail(p){
currentId=p.id; playHyperspace();
const isSeparatist = p.status==='separatist'; // Solo si es separatista aplica glitch INTERNO
const d=document.getElementById('detail');
d.style.display='block';
d.innerHTML=`
<div style="display:flex;gap:15px;flex-wrap:wrap">
<img src="${p.imgDetail}" class="${isSeparatist?'glitch-img':''}" style="width:230px;height:135px;object-fit:cover;border:1px solid ${p.color};box-shadow:0 0 10px ${p.color}" onerror="this.style.display='none'">
<div style="flex:1">
<h2 style="color:${p.color};margin:0">${p.name} // ${p.statusText}</h2>
<p style="font-size:12px;max-width:650px">${p.desc}</p>
<div style="margin:8px 0">
<button class="tabBtn" onclick="showTab('stats')">STATS</button>
<button class="tabBtn" onclick="showTab('forces')">FUERZAS</button>
<button class="tabBtn" onclick="showTab('units')">UNIDADES</button>
</div>
<div id="tabContent" style="font-size:11px;background:rgba(0,255,136,0.05);border:1px solid rgba(0,255,136,0.2);padding:8px"></div>
<button onclick="closeDetail()" style="margin-top:10px;background:#000;color:#f44;border:1px solid #f44;padding:6px 12px;cursor:pointer">✕ CERRAR [ESC]</button>
</div>
<img src="${p.unitImg}" class="${isSeparatist?'glitch-img':''}" style="width:145px;height:145px;object-fit:cover;border:1px solid #333" onerror="this.style.display='none'">
</div>`;
showTab('stats');
}
function showTab(tab){
playSubmenu();
const p=planets.find(x=>x.id===currentId); const c=document.getElementById('tabContent');
if(tab==='stats') c.innerHTML=`<b>SECTOR:</b> ${p.sector}<br><b>POBLACIÓN:</b> ${p.stats.poblacion}<br><b>CLIMA:</b> ${p.stats.clima}<br><b>RECURSOS:</b> ${p.stats.recursos}`;
if(tab==='forces') c.innerHTML=`<b>GUARNICIÓN:</b> ${p.forces.guarnicion}<br><b>FLOTA:</b> ${p.forces.flota}<br><b>AMENAZA:</b> ${p.forces.amenaza}%`;
if(tab==='units') c.innerHTML=p.units.map(u=>`<div style="color:${u.color}">● ${u.name} — ${u.count} [${u.pct}%]</div>`).join('');
}
function closeDetail(){ playClose(); document.getElementById('detail').style.display='none'; }
window.onload=()=>{
renderPlanets(); renderRoutes();
document.body.addEventListener('click',()=>{initAudio(); playBoot();},{once:true});
};
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); if(e.key==='m'||e.key==='M') toggleAudio(); });
</script>
</body>
