.planet-dot.amigable{background:radial-gradient(circle at 30% 30%,#fff,var(--blue) 35%,#002244);box-shadow:0 0 14px var(--blue),0 0 28px var(--blue)}

.planet-dot.neutral{background:radial-gradient(circle at 30% 30%,#fff,var(--gold) 35%,#443300);box-shadow:0 0 14px var(--gold),0 0 28px var(--gold)}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.25)}}

.planet-dot.glitch{animation:glitchDot 0.25s infinite}

<script>
// ========== AYUDA: MOTOR SONIDOS ESTILO JUEGO PESADO - WEB AUDIO API ==========
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function tone(f,t,d,v=0.15){
  try{
    initAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(), fl=audioCtx.createBiquadFilter();
    o.type=t; o.frequency.value=f; fl.type='lowpass'; fl.frequency.value=3800;
    o.connect(fl); fl.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function sHover(){ tone(880,'sine',0.09,0.06); }
function sClick(){ tone(440,'triangle',0.15,0.18); setTimeout(()=>tone(880,'sine',0.22,0.1),60); setTimeout(()=>tone(1760,'sine',0.18,0.05),110); }
function sOpen(){ tone(180,'sawtooth',0.28,0.13); setTimeout(()=>tone(660,'sine',0.4,0.14),100); setTimeout(()=>tone(1320,'triangle',0.5,0.08),180); }
function sClose(){ tone(660,'sine',0.18,0.1); setTimeout(()=>tone(160,'sawtooth',0.35,0.12),80); }
function sWar(){ tone(90,'square',0.45,0.22); setTimeout(()=>tone(45,'sawtooth',0.7,0.15),120); }
function sGlitch(){ tone(1200,'square',0.08,0.12); setTimeout(()=>tone(40,'sawtooth',0.25,0.18),40); }

let currentPlanet=null, currentTab='lore', devClicks=0, warBalance=0;
</script>
<script>
// ========== AYUDA: DIBUJA PLANETAS CON COLORES POR RUTA ==========
function renderMap(){
  const map=document.getElementById('map');
  map.innerHTML='';
  planets.forEach(p=>{
    const dot=document.createElement('div');
    dot.className='planet-dot '+p.status.toLowerCase();
    if(p.glitch) dot.classList.add('glitch');
    dot.style.left=p.x+'%'; dot.style.top=p.y+'%';
    dot.title=p.id+' - '+p.status;
    dot.addEventListener('mouseenter', ()=>{ p.glitch? sGlitch() : sHover(); });
    dot.addEventListener('click', ()=>{ sClick(); if(p.glitch) sGlitch(); showPlanet(p.id); });
    const label=document.createElement('div');
    label.className='planet-label';
    label.style.left=p.x+'%'; label.style.top='calc('+p.y+'% + 16px)';
    label.style.color = p.status==='Hostil'? '#ff5566' : p.status==='Amigable'? '#55aaff' : '#ffdd66';
    label.innerText=p.id.toUpperCase();
    map.appendChild(dot);
    map.appendChild(label);
  });
}
</script>
<script>
// ========== AYUDA: LOGICA PANEL - USA imgPlanet / imgDetail / imgTroops ==========
function showPlanet(id){
  const p=planets.find(x=>x.id===id); if(!p) return;
  currentPlanet=p;
  const img=document.getElementById('detailImg');
  const wrap=document.getElementById('detailImgWrap');
  // HEADER USA imgPlanet (planeta desde orbita)
  img.src = p.imgPlanet || p.imgDetail || p.imgTroops;
  img.onerror=function(){
    if(this.src.includes('_planet')){ this.src = p.imgDetail || p.imgTroops; }
    else if(this.src.includes('_detail')){ this.src = p.imgTroops; }
    else{ this.src='./SH_TROOPS_QP.png'; }
  };
  wrap.className='detail-img'+(p.glitch?' glitch':'');
  document.getElementById('detailName').innerText=p.id.toUpperCase();
  document.getElementById('detailMeta').innerText=p.sector+' // '+p.clima+' // '+p.status.toUpperCase();
  switchTab('lore');
  document.getElementById('detail').classList.add('open');
  sOpen(); if(p.glitch) setTimeout(sGlitch,200);
}
function closeDetail(){ document.getElementById('detail').classList.remove('open'); sClose(); }
function switchTab(type){
  if(!currentPlanet) return;
  currentTab=type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const idx={lore:0,datos:1,fuerzas:2,unidades:3}[type];
  document.querySelectorAll('.tab')[idx].classList.add('active');
  const p=currentPlanet, c=document.getElementById('detailContent');
  const col = p.status==='Hostil'?'#ff3344':p.status==='Amigable'?'#00aaff':'#ffd700';
  const badge='<div class="status-badge '+p.status.toLowerCase()+'" style="border-color:'+col+';color:'+col+'">RUTA: '+p.status.toUpperCase()+' - '+p.faction+'</div>';

  if(type==='lore') c.innerHTML = badge+
    '<div style="width:100%;height:165px;border-radius:10px;overflow:hidden;margin-bottom:12px;border:1px solid rgba(255,255,255,0.12)"><img src="'+(p.imgDetail||p.imgPlanet)+'" onerror="this.src=\''+(p.imgPlanet||p.imgTroops)+'\'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '<div style="font-weight:700;line-height:1.7"><span style="color:var(--neon);font-family:Orbitron;font-size:10px;letter-spacing:2px">LORE EXPANDIDO // 22 ABY:</span><br><br>'+p.lore+'<br><br><span style="color:var(--neon)">CLIMA:</span> '+p.clima+'<br><span style="color:var(--neon)">FACCIÓN:</span> '+p.faction+'</div>';

  if(type==='datos') c.innerHTML = badge+
    '<div><span style="color:var(--neon);font-family:Orbitron">POBLACIÓN:</span><br>'+p.population+'<br><br><span style="color:var(--gold);font-family:Orbitron">BENEFICIO:</span><br>'+p.benefit+'<br><br><span style="color:var(--neon)">SECTOR:</span> '+p.sector+'<br><br>'+
    p.produccion.map(pr=>'<div style="display:flex;justify-content:space-between;font-size:11px;margin:12px 0 5px 0;font-family:Orbitron;font-weight:900"><span>'+pr.label+'</span><span style="color:'+pr.color+';text-shadow:0 0 8px '+pr.color+'">'+pr.value+'</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden"><div style="width:'+pr.pct+'%;height:100%;background:'+pr.color+';box-shadow:0 0 12px '+pr.color+'"></div></div>').join('')+'</div>';

  if(type==='fuerzas') c.innerHTML = badge+
    '<div><span style="color:var(--neon);font-family:Orbitron">FUERZAS:</span><br>'+p.forces+'<br><br><span style="color:var(--neon)">FAUNA:</span><br>'+p.fauna+'<br><br><span style="color:var(--neon)">CIVILES:</span><br>'+p.civil+'<br><br><span style="color:'+col+';font-family:Orbitron">ESTADO:</span> '+p.status+'</div>';

  if(type==='unidades') c.innerHTML = badge+
    '<div style="width:100%;height:235px;border:1px solid '+col+';border-radius:12px;overflow:hidden;box-shadow:0 0 18px '+col+'55'+(p.glitch?' ;filter:contrast(1.2) hue-rotate(-10deg)':'')+'"><img src="'+p.imgTroops+'" onerror="this.src=\'./SH_TROOPS_QP.png\'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '<div style="margin-top:8px;font-family:Share Tech Mono;font-size:8px;opacity:0.5;word-break:break-all">'+p.imgTroops+'</div>'+
    '<div style="margin-top:14px">'+
    p.produccion.map(pr=>'<div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 0 5px 0;font-family:Orbitron;font-weight:900"><span>'+pr.label+'</span><span style="color:'+pr.color+'">'+pr.value+'</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden"><div style="width:'+pr.pct+'%;height:100%;background:'+pr.color+';box-shadow:0 0 12px '+pr.color+'"></div></div>').join('')+
    '<div style="margin-top:14px;padding:12px;border:1px dashed rgba(0,255,136,0.25);border-radius:10px;font-family:Share Tech Mono;font-size:10px;color:var(--neon);letter-spacing:1px">UNIDAD: '+p.faction+'<br>TROPAS: '+p.troops+'<br>RUTA: '+p.status+'<br>PLANETA: '+p.imgPlanet+'</div></div>';

  sHover();
}
</script>
<script>
// ========== AYUDA: BOTONES DEV SOLO VOS - 5 CLICKS EN TITULO ==========
function addRepublic(v){ warBalance=Math.min(100,warBalance+v); renderMap(); sWar(); console.log('REP +'+v+' Balance:'+warBalance); }
function addSeparatist(v){ warBalance=Math.max(-100,warBalance-v); renderMap(); sWar(); console.log('SEP +'+v+' Balance:'+warBalance); }
function resetWar(){ warBalance=0; renderMap(); sClose(); }
document.getElementById('title').addEventListener('click', ()=>{
  devClicks++; tone(600+devClicks*80,'sine',0.1,0.08);
  if(devClicks>=5){ document.getElementById('devControls').classList.toggle('active'); devClicks=0; sOpen(); }
  setTimeout(()=>{ if(devClicks>0 && devClicks<5) devClicks=0; },3000);
});
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.shiftKey && e.key==='D'){ document.getElementById('devControls').classList.toggle('active'); sClick(); }
  if(e.key==='Escape') closeDetail();
});
</script>
<script>
// ========== AYUDA: INICIO + OPTIMIZACION CELULAR Y PC ==========
window.addEventListener('load', ()=>{
  renderMap(); initAudio();
  const img=new Image(); img.src='./SH_TROOPS_QP.png';
  console.log('%c QUANTUM PULSE V10 ONLINE - 18 PLANETAS - 3 IMGS ','background:#00ff88;color:#000;font-family:Orbitron;padding:12px;font-weight:900;letter-spacing:2px');
});
document.getElementById('map').addEventListener('click', (e)=>{ if(e.target.id==='map') closeDetail(); });

// ========== AYUDA: PARCHE ANTI PALABRAS GRISES SUELTAS - BORRA TROPAS REF SI QUEDO ==========
document.addEventListener('DOMContentLoaded', ()=>{
  const walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n; const bad=['TROPAS REF:','Cambiá unitImg','IMAGEN:','FACCIÓN:','CLIMA:'];
  while(n=walker.nextNode()){
    if(bad.some(b=>n.nodeValue.includes(b)) && n.nodeValue.length<400){ n.nodeValue=''; }
    if(n.nodeValue.trim()==='undefined'){ n.nodeValue=''; }
  }
});
</script>
