// MOTOR DE SONIDO CYBERPUNK PESADO - NO PIPIPIPI SIMPLE
// Cada sonido usa 3 osciladores + filtro + delay + ganancia envolvente
let audioCtx=null;
let masterGain=null;
function initAudio(){
if(audioCtx) return;
audioCtx=new (window.AudioContext||window.webkitAudioContext)();
masterGain=audioCtx.createGain();
masterGain.gain.value=0.35;
masterGain.connect(audioCtx.destination);
// Reverb ligera con delay
}
function playHeavy(freq1,freq2,type1,type2,vol,dur,glide1,glide2,filterFreq){
if(!audioCtx) initAudio();
const now=audioCtx.currentTime;
// Oscilador 1 - base grave
const o1=audioCtx.createOscillator(); const g1=audioCtx.createGain(); const f1=audioCtx.createBiquadFilter();
o1.type=type1; o1.frequency.value=freq1; f1.type='lowpass'; f1.frequency.value=filterFreq; f1.Q.value=8;
o1.connect(f1); f1.connect(g1); g1.connect(masterGain);
g1.gain.setValueAtTime(0,now); g1.gain.linearRampToValueAtTime(vol,now+0.02); g1.gain.exponentialRampToValueAtTime(0.001,now+dur);
if(glide1) o1.frequency.exponentialRampToValueAtTime(glide1,now+dur);
o1.start(now); o1.stop(now+dur);
// Oscilador 2 - capa aguda metálica
const o2=audioCtx.createOscillator(); const g2=audioCtx.createGain();
o2.type=type2; o2.frequency.value=freq2;
o2.connect(g2); g2.connect(masterGain);
g2.gain.setValueAtTime(0,now); g2.gain.linearRampToValueAtTime(vol*0.6,now+0.01); g2.gain.exponentialRampToValueAtTime(0.001,now+dur*0.8);
if(glide2) o2.frequency.linearRampToValueAtTime(glide2,now+dur);
o2.start(now+0.02); o2.stop(now+dur);
// Ruido click - tercer oscilador cuadrado muy corto
if(dur>0.15){
const o3=audioCtx.createOscillator(); const g3=audioCtx.createGain();
o3.type='square'; o3.frequency.value=freq1*2;
o3.connect(g3); g3.connect(masterGain);
g3.gain.setValueAtTime(vol*0.4,now); g3.gain.exponentialRampToValueAtTime(0.001,now+0.08);
o3.start(now); o3.stop(now+0.08);
}
}
function playHover(){ // Scanner suave pero pesado
initAudio();
playHeavy(600,1200,'sine','triangle',0.18,0.18,900,1800,3500);
}
function playClick(){ // Click militar pesado
initAudio();
playHeavy(180,650,'square','sine',0.35,0.22,60,900,1800);
setTimeout(()=>playHeavy(800,1600,'sine','sine',0.2,0.15,1200,2400,4000),70);
}
function playClose(){ // Cierre transmisión pesado
initAudio();
playHeavy(900,400,'sawtooth','square',0.28,0.35,120,80,1200);
}
function playSubmenu(){ // Tab switch
initAudio();
playHeavy(1000,2000,'triangle','sine',0.15,0.12,1400,2800,5000);
}
function playHyperspace(){ // Abrir planeta - warp pesado
initAudio();
playHeavy(90,180,'sawtooth','sawtooth',0.4,0.65,650,1200,900);
setTimeout(()=>playHeavy(1200,2400,'sine','triangle',0.22,0.4,1800,3600,3000),120);
}

 function renderPlanets(){
const layer=document.getElementById('planets-layer'); layer.innerHTML='';
planets.forEach(p=>{
const div=document.createElement('div'); div.className='planet';
div.style.left=p.x+'%'; div.style.top=p.y+'%'; div.style.color=p.color;
// AURA AJUSTADA PEGADA A LA IMAGEN - NO FLOTANDO
div.innerHTML=`<div class="aura"><img src="${p.img}" onerror="this.style.background='${p.color}'"></div><div class="label">${p.name}</div>`;
div.onmouseenter=()=>playHover(); div.onclick=()=>{playClick(); showDetail(p);};
layer.appendChild(div);
});
}
function renderRoutes(){
const canvas=document.getElementById('routes'); const ctx=canvas.getContext('2d');
function resize(){ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; draw(); }
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
routes.forEach(r=>{
const a=planets.find(x=>x.id===r.from), b=planets.find(x=>x.id===r.to); if(!a||!b) return;
ctx.beginPath(); ctx.strokeStyle=r.color; ctx.lineWidth=r.width; ctx.globalAlpha=0.9; ctx.shadowBlur=16; ctx.shadowColor=r.color;
if(r.dash) ctx.setLineDash([10,6]); else ctx.setLineDash([]);
ctx.moveTo(a.x/100*canvas.width, a.y/100*canvas.height); ctx.lineTo(b.x/100*canvas.width, b.y/100*canvas.height);
ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur=0;
});
}
window.addEventListener('resize',resize); resize();
}

function showTab(type,el){

const p=planets.find(x=>x.id===cur); const c=document.getElementById('tabContent');

if(type==='fuerzas') c.innerHTML=`<div style="font-size:11px;line-height:1.6"><b>FUERZAS:</b><br>${p.forces}<br><br><b>FAUNA:</b> ${p.fauna}<br><b>CIVILES:</b> ${p.civil}</div>`;
if(type==='unidades'){
let html=`<div class="unit-card"><img src="${p.imgDetail}" class="unit-img" style="height:140px"><div style="margin-top:8px">`;
p.produccion.forEach(pr=>{
html+=`<div class="bar-label"><span>${pr.label}</span><span style="color:${pr.color}">${pr.value}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pr.pct}%;background:${pr.color};color:${pr.color}"></div></div>`;
});
html+=`</div></div><div style="font-size:10px;color:#888;margin-top:8px">Fuerzas clon: ${p.forces.slice(0,120)}...</div>`;
c.innerHTML=html;
}
}
function closeDetail(){ playClose(); document.getElementById('detail').style.display='none'; }
window.onload=()=>{ renderPlanets(); renderRoutes(); document.body.addEventListener('click',()=>{initAudio();},{once:true}); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
</script>
</body>
</html>
