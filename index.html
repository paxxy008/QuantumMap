<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM PULSE - CWRP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#00ff88;--green-dim:rgba(0,255,136,0.15);--blue:#00d4ff;--red:#ff2244;--yellow:#ffcc00;--violet:#a855f7;--orange:#ff7a00}
body{background:#02080a;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;background:#000;cursor:grab}
#world{width:2000px;height:1400px;background: url('./fondo.jpg') center/cover no-repeat, radial-gradient(ellipse at center,#0a1a14 0%,#02080a 70%,#000 100%);position:absolute;left:50%;top:50%;transform-origin:center center;transform:translate(-50%,-50%) scale(1);}
svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg#routes line{stroke-width:1.4;stroke-linecap:round;opacity:0.9;filter:drop-shadow(0 0 4px currentColor)}
.route-rep{stroke:var(--blue)} .route-cis{stroke:var(--red)} .route-neutral{stroke:var(--yellow)} .route-mandalore{stroke:var(--violet)} .route-hutt{stroke:var(--orange)}
.planet{position:absolute;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:3}
.planet-core{width:100%;height:100%;border-radius:50%;box-shadow: inset -6px -6px 12px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.7)}
.planet-aura{position:absolute;inset:-10px;border-radius:50%;opacity:0.55;filter:blur(8px);z-index:-1}
.planet:hover{transform:translate(-50%,-50%) scale(1.35)}
.planet-label{position:absolute;top:120%;left:50%;transform:translateX(-50%);font-family:'Orbitron';font-size:9.5px;font-weight:700;color:var(--green);text-shadow:0 0 6px var(--green)}
#title-box{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:20;border:1px solid var(--green); background:rgba(0,20,10,0.85); padding:12px 38px;clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);box-shadow: 0 0 20px var(--green)}
#title-box h1{font-family:'Orbitron';font-size:22px;letter-spacing:5px;font-weight:900;color:var(--green); text-shadow: 0 0 12px var(--green)}
#controls{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;gap:8px}
.ctrl-btn{width:40px;height:40px;background:rgba(0,20,10,0.9);border:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-weight:700;cursor:pointer;border-radius:4px;box-shadow:0 0 10px var(--green-dim)}
.ctrl-btn:hover{background:var(--green);color:#000}
#overlay{position:fixed;inset:0;background:rgba(0,10,5,0.65);z-index:30;display:none;backdrop-filter:blur(6px)}
#planet-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:94vw;max-width:580px; background:rgba(5,18,12,0.98); border:1px solid var(--green); box-shadow:0 0 40px rgba(0,255,136,0.35);display:none}
.modal-head{display:grid;grid-template-columns:120px 1fr 1fr;gap:10px;padding:14px;border-bottom:1px solid var(--green-dim);background:rgba(0,255,136,0.05)}
.modal-img{height:96px;border:1px solid var(--green-dim);background-size:cover;background-position:center;position:relative;display:flex;align-items:end;padding:5px;font-family:'Orbitron';font-size:8px;color:var(--green);overflow:hidden}
.glitch-red{animation: glitchRed 0.35s infinite; filter: contrast(1.2) saturate(1.3)}
.glitch-red::before{content:'';position:absolute;inset:0;background: repeating-linear-gradient(0deg, rgba(255,0,0,0.15) 0px, transparent 2px, transparent 4px);z-index:3;mix-blend-mode: screen}
@keyframes glitchRed{0%{transform:translate(0)} 20%{transform:translate(-1px,1px)} 60%{transform:translate(-1px,0); clip-path: inset(10% 0 20% 0)} 80%{transform:translate(1px,1px)}}
.glitch-blue{animation: glitchBlue 0.6s infinite} .glitch-blue::before{content:'';position:absolute;inset:0;background: repeating-linear-gradient(90deg, rgba(0,200,255,0.12) 0px, transparent 3px);z-index:3}
@keyframes glitchBlue{0%,100%{transform:translate(0)} 50%{transform:translate(0,0.5px) scaleY(1.01)}}
.modal-tabs{display:flex;border-bottom:1px solid var(--green-dim)}
.tab{flex:1;padding:11px 6px;text-align:center;font-family:'Orbitron';font-size:10px;cursor:pointer;background:rgba(0,255,136,0.04);border-right:1px solid var(--green-dim);color:var(--green)}
.tab.active{background:var(--green);color:#000;font-weight:700;box-shadow:0 0 12px var(--green)}
.tab-content{padding:16px;min-height:130px;font-size:14px;line-height:1.5;color:#c8ffd8}
.close-btn{width:100%;padding:13px;background:rgba(0,255,136,0.08);border:0;border-top:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-size:12px;letter-spacing:4px;font-weight:900;cursor:pointer;text-shadow:0 0 8px var(--green)}
.close-btn:hover{background:var(--green);color:#000;box-shadow:0 0 25px var(--green)}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="routes"></svg></div></div>
<div id="title-box"><h1>QUANTUM PULSE - CWRP</h1></div>
<div id="controls">
  <button class="ctrl-btn" onclick="zoom(0.15); playSound(900,0.15)">+</button>
  <button class="ctrl-btn" onclick="zoom(-0.15); playSound(700,0.15)">-</button>
  <button class="ctrl-btn" onclick="resetView(); playSound(500,0.15)" style="width:auto;padding:0 12px;font-size:10px">RESET</button>
</div>
<div id="overlay" onclick="closeModal(); playSound(300,0.12)"></div>
<div id="planet-modal">
  <div class="modal-head">
    <div id="m-img-planet" class="modal-img">PLANET</div>
    <div id="m-img-main" class="modal-img">MAIN</div>
    <div id="m-img-troops" class="modal-img">TROOPS</div>
  </div>
  <div class="modal-tabs">
    <div class="tab active" data-t="lore" onclick="switchTab('lore'); playSound(650,0.1)">LORE</div>
    <div class="tab" data-t="benef" onclick="switchTab('benef'); playSound(650,0.1)">BENEFICIO / PRODUCCIÓN</div>
    <div class="tab" data-t="troops" onclick="switchTab('troops'); playSound(650,0.1)">TROPAS / CIVILES / FAUNA</div>
  </div>
  <div id="tab-lore" class="tab-content"></div>
  <div id="tab-benef" class="tab-content" style="display:none"></div>
  <div id="tab-troops" class="tab-content" style="display:none"></div>
  <button class="close-btn" onclick="closeModal(); playSound(250,0.18)">CERRAR TRANSMISIÓN</button>
</div>
<script>
// CAMBIÁ LAS URLS DE imgPlanet / imgMain / imgTroops POR LAS TUYAS
const planets = [
  {id:"coruscant", name:"CORUSCANT", x:1000, y:680, color:"#00ff88", faction:"rep", size:52, lore:"Capital República.", benef:"REP: +15% créditos.", troops:"Guardia Coruscanti.", imgPlanet:"./img/coruscant_planet.jpg", imgMain:"./img/coruscant_main.jpg", imgTroops:"./img/coruscant_troops.jpg"},
  {id:"mustafar", name:"MUSTAFAR", x:1500, y:1060, color:"#ff3300", faction:"cis", size:38, lore:"Mundo volcánico - señal inestable.", benef:"CIS: +18% droides.", troops:"Battle Droids. Fauna: Lava flea.", imgPlanet:"./img/mustafar_planet.jpg", imgMain:"./img/mustafar_main.jpg", imgTroops:"./img/mustafar_troops.jpg", glitch:"red"},
  {id:"geonosis", name:"GEONOSIS", x:820, y:1030, color:"#ff5533", faction:"cis", size:40, lore:"Fábricas droides - tormenta arena.", benef:"CIS: -25% coste droides.", troops:"Geonosians, Acklay.", imgPlanet:"./img/geonosis_planet.jpg", imgMain:"./img/geonosis_main.jpg", imgTroops:"./img/geonosis_troops.jpg", glitch:"red"},
  {id:"hoth", name:"HOTH", x:320, y:120, color:"#88ddff", faction:"neutral", size:34, lore:"Helado - ventiscas.", benef:"NEUTRAL: Cristales hielo.", troops:"Wampa, Tauntaun.", imgPlanet:"./img/hoth_planet.jpg", imgMain:"./img/hoth_main.jpg", imgTroops:"./img/hoth_troops.jpg", glitch:"blue"},
  // ... agregá los otros planetas igual, con imgPlanet, imgMain, imgTroops
];
// RUTAS (pulsar solo a coruscant)
let routes = [["pulsar","coruscant"],["coruscant","alderaan"],["coruscant","anaxes"],["coruscant","lothal"],["coruscant","naboo"],["alderaan","mandalore"],["mandalore","kessel"],["kessel","christophsis"],["christophsis","utapau"],["anaxes","lothal"],["lothal","felucia"],["felucia","kashyyyk"],["kashyyyk","geonosis"],["geonosis","cato"],["cato","lothal"],["naboo","felucia"],["naboo","cato"],["naboo","tatooine"],["tatooine","mustafar"],["mustafar","rishi"],["mustafar","kamino"],["utapau","rishi"],["christophsis","tatooine"],["tatooine","geonosis"],["utapau","tatooine"],["hoth","anaxes"],["hoth","mandalore"],["kashyyyk","naboo"],["alderaan","christophsis"],["anaxes","felucia"]];
let scale=1, tx=0, ty=0, isDragging=false, startX, startY;
const world=document.getElementById('world'), viewport=document.getElementById('viewport'), svg=document.getElementById('routes');
function getRouteType(a,b){ if(a==="pulsar"||b==="pulsar") return "rep"; if(a==="mandalore"||b==="mandalore") return "mandalore"; if(a==="tatooine"||b==="tatooine") return "hutt"; const A=planets.find(p=>p.id===a), B=planets.find(p=>p.id===b); if(A.faction==="rep"&&B.faction==="rep") return "rep"; if(A.faction==="cis"&&B.faction==="cis") return "cis"; return "neutral"; }
function render(){ svg.innerHTML=""; routes.forEach(([a,b])=>{ const pA=planets.find(p=>p.id===a), pB=planets.find(p=>p.id===b); if(!pA||!pB) return; const line=document.createElementNS("http://www.w3.org/2000/svg","line"); line.setAttribute("x1",pA.x); line.setAttribute("y1",pA.y); line.setAttribute("x2",pB.x); line.setAttribute("y2",pB.y); line.setAttribute("class","route-"+getRouteType(a,b)); svg.appendChild(line); }); world.querySelectorAll('.planet').forEach(e=>e.remove()); planets.forEach(p=>{ const el=document.createElement('div'); el.className='planet'; el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.width=p.size+'px'; el.style.height=p.size+'px'; el.style.color=p.color; el.innerHTML=`<div class='planet-aura' style='background:${p.color}'></div><div class='planet-core' style='background:${p.color}'></div><div class='planet-label'>${p.name}</div>`; el.onclick=(e)=>{ e.stopPropagation(); openPlanet(p); playSound(880,0.16,'square'); }; el.onmouseenter=()=>playSound(1200,0.05,'sine'); world.appendChild(el); }); }
function openPlanet(p){ document.getElementById('overlay').style.display='block'; document.getElementById('planet-modal').style.display='block'; const setImg=(id,url,glitch)=>{ const el=document.getElementById(id); el.style.backgroundImage=`url(${url})`; el.className='modal-img'+(glitch==='red'?' glitch-red':'')+(glitch==='blue'?' glitch-blue':''); }; setImg('m-img-planet',p.imgPlanet,p.glitch); setImg('m-img-main',p.imgMain,p.glitch); setImg('m-img-troops',p.imgTroops,p.glitch); document.getElementById('tab-lore').innerHTML=p.lore; document.getElementById('tab-benef').innerHTML=p.benef; document.getElementById('tab-troops').innerHTML=p.troops; }
function switchTab(t){ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.querySelector(`[data-t="${t}"]`).classList.add('active'); document.getElementById('tab-lore').style.display=t==='lore'?'block':'none'; document.getElementById('tab-benef').style.display=t==='benef'?'block':'none'; document.getElementById('tab-troops').style.display=t==='troops'?'block':'none'; }
function closeModal(){ document.getElementById('overlay').style.display='none'; document.getElementById('planet-modal').style.display='none'; }
function applyTransform(){ world.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`; }
function zoom(d){ scale=Math.min(2.5, Math.max(0.45, scale+d)); applyTransform(); }
function resetView(){ scale=1; tx=0; ty=0; applyTransform(); }
viewport.addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY>0?-0.08:0.08); playSound(e.deltaY>0?600:900,0.06,'sine'); }, {passive:false});
viewport.addEventListener('mousedown', e=>{ isDragging=true; startX=e.clientX-tx; startY=e.clientY-ty; });
window.addEventListener('mousemove', e=>{ if(!isDragging) return; tx=e.clientX-startX; ty=e.clientY-startY; applyTransform(); });
window.addEventListener('mouseup', ()=>isDragging=false);
let audioCtx; function playSound(f,v,t='sawtooth'){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=t; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.28); o.start(); o.stop(audioCtx.currentTime+0.3);}catch(e){} }
render();
</script>
</body>
</html>
