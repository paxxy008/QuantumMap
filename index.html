let audioCtx=null,master=null,comp=null,rev=null;
function initAudio(){
if(audioCtx) return;
audioCtx=new (window.AudioContext||window.webkitAudioContext)();
master=audioCtx.createGain(); master.gain.value=0.38;
comp=audioCtx.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=28; comp.ratio.value=8; comp.attack.value=0.003; comp.release.value=0.22;
rev=audioCtx.createConvolver();
const rate=audioCtx.sampleRate, len=rate*1.2, impulse=audioCtx.createBuffer(2,len,rate);
for(let c=0;c<2;c++){ const d=impulse.getChannelData(c); for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2)*0.4; } }
rev.buffer=impulse;
const revGain=audioCtx.createGain(); revGain.gain.value=0.18;
master.connect(comp); comp.connect(audioCtx.destination);
master.connect(rev); rev.connect(revGain); revGain.connect(audioCtx.destination);
}
function cyberTone(f1,f2,type1,type2,vol,dur,sweepTo,filterFreq,distort){
if(!audioCtx) initAudio();
const t=audioCtx.currentTime;
const osc1=audioCtx.createOscillator(), gain1=audioCtx.createGain(), filt=audioCtx.createBiquadFilter(), shaper=audioCtx.createWaveShaper();
osc1.type=type1; osc1.frequency.value=f1; osc1.detune.value=(Math.random()*10-5);
filt.type='lowpass'; filt.frequency.value=filterFreq; filt.Q.value=9;
if(distort){ const k=distort; const n=44100; const curve=new Float32Array(n); for(let i=0;i<n;i++){ const x=i*2/n-1; curve[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+k*Math.abs(x)); } shaper.curve=curve; shaper.oversample='4x'; osc1.connect(shaper); shaper.connect(filt); } else { osc1.connect(filt); }
filt.connect(gain1); gain1.connect(master);
gain1.gain.setValueAtTime(0,t); gain1.gain.linearRampToValueAtTime(vol,t+0.012); gain1.gain.exponentialRampToValueAtTime(0.001,t+dur);
if(sweepTo) osc1.frequency.exponentialRampToValueAtTime(sweepTo,t+dur);
filt.frequency.exponentialRampToValueAtTime(filterFreq*0.4,t+dur*0.8);
osc1.start(t); osc1.stop(t+dur+0.05);
const osc2=audioCtx.createOscillator(), gain2=audioCtx.createGain();
osc2.type=type2; osc2.frequency.value=f2; osc2.detune.value=4;
osc2.connect(gain2); gain2.connect(master);
gain2.gain.setValueAtTime(0,t); gain2.gain.linearRampToValueAtTime(vol*0.55,t+0.01); gain2.gain.exponentialRampToValueAtTime(0.001,t+dur*0.78);
osc2.start(t+0.015); osc2.stop(t+dur);
if(dur>0.25){
const sub=audioCtx.createOscillator(), subG=audioCtx.createGain();
sub.type='sine'; sub.frequency.value=f1*0.5; sub.connect(subG); subG.connect(master);
subG.gain.setValueAtTime(vol*0.7,t); subG.gain.exponentialRampToValueAtTime(0.001,t+dur*1.1);
sub.start(t); sub.stop(t+dur*1.1);
}
}

 function renderPlanets(){ const layer=document.getElementById('planets-layer'); layer.innerHTML=''; planets.forEach(p=>{ const div=document.createElement('div'); div.className='planet'; div.style.left=p.x+'%'; div.style.top=p.y+'%'; div.style.color=p.color; div.innerHTML=`<div class="aura"><img src="${p.img}" onerror="this.style.background='${p.color}'"></div><div class="label">${p.name}</div>`; div.addEventListener('mouseenter',()=>playHover()); div.addEventListener('click',()=>{ playClick(); showDetail(p); }); layer.appendChild(div); }); }
function renderRoutes(){ const canvas=document.getElementById('routes'); const ctx=canvas.getContext('2d'); function resize(){ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; draw(); } function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); routes.forEach(r=>{ const a=planets.find(x=>x.id===r.from), b=planets.find(x=>x.id===r.to); if(!a||!b) return; ctx.beginPath(); ctx.strokeStyle=r.color; ctx.lineWidth=r.width; ctx.globalAlpha=0.94; ctx.shadowBlur=20; ctx.shadowColor=r.color; if(r.dash) ctx.setLineDash([12,8]); else ctx.setLineDash([]); ctx.moveTo(a.x/100*canvas.width,a.y/100*canvas.height); ctx.lineTo(b.x/100*canvas.width,b.y/100*canvas.height); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur=0; }); } window.addEventListener('resize',resize); resize(); }
let cur=null;
function showDetail(p){
cur=p.id; playOpen();
const isCorrupt=(p.id==='geonosis'||p.id==='mustafar');
const d=document.getElementById('detail'); d.style.display='block';
d.innerHTML=`
<div class="detail-hero ${isCorrupt?'glitch-corrupt':''}">
<img src="${p.imgDetail}" onerror="this.src='${p.img}'">
<div class="hero-tag-top">${p.statusText}</div>
<div class="hero-tag-bottom">SECTOR: ${p.sector} | CLIMA: ${p.clima}</div>
${isCorrupt?`<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,40,40,0.94);color:#fff;padding:10px 20px;font-size:11px;font-weight:900;z-index:10;box-shadow:0 0 26px #f44;font-family:Orbitron;text-align:center;line-height:1.3;border:1px solid #ff4444">⚠ SEÑAL CORRUPTA<br>TRANSMISIÓN DAÑADA POR ${p.id.toUpperCase()}<br><span style="font-size:8px">FABRICA INTERFERENCIA ${p.clima}</span></div>`:''}
</div>
<div class="detail-content">
<h2 class="detail-title" style="color:${p.color};text-shadow:0 0 22px ${p.color}">${p.name}</h2>
<div class="tabs"><span class="tab active" onclick="showTab('lore',this)">• LORE</span><span class="tab" onclick="showTab('datos',this)">• DATOS</span><span class="tab" onclick="showTab('fuerzas',this)">• FUERZAS</span><span class="tab" onclick="showTab('unidades',this)">• UNIDADES</span></div>
<div id="tabContent"></div>
<button class="btn-close" onclick="closeDetail()">CERRAR TRANSMISIÓN</button>
</div>`;
showTab('lore',document.querySelector('.tab'));
}function showTab(type,el){
if(el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
playSub();
const p=planets.find(x=>x.id===cur); const c=document.getElementById('tabContent'); if(!p) return;
if(type==='lore') c.innerHTML=`<div style="font-family:Rajdhani;font-weight:700;font-size:13.5px"><span style="color:#00ff88;font-family:Orbitron">LORE INICIO GUERRAS CLON - AÑO 0:</span><br>${p.desc}<br><br><span style="color:#00ff88">CLIMA:</span> ${p.clima}<br><span style="color:#00ff88">FACCIÓN:</span> ${p.faction}<br><br><i style="color:#777;font-size:10px">Quantum Pulse - Servidor V7 Full - Todo Lore</i></div>`;
if(type==='datos') c.innerHTML=`<div style="font-family:Rajdhani;font-weight:700"><span style="color:#00ff88;font-family:Orbitron">POBLACIÓN:</span><br>${p.population}<br><br><span style="color:#ffd700;font-family:Orbitron">BENEFICIO PLANETARIO:</span><br>${p.benefit}<br><br><span style="color:#00ff88">SECTOR:</span> ${p.sector}<br><span style="color:#00ff88">CLIMA:</span> ${p.clima}<br><br>${p.produccion.map(pr=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin:9px 0 5px 0;font-weight:900;letter-spacing:0.5px;font-family:Orbitron"><span>${pr.label}</span><span style="color:${pr.color};text-shadow:0 0 8px ${pr.color}">${pr.value}</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)"><div style="width:${pr.pct}%;height:100%;background:${pr.color};box-shadow:0 0 12px ${pr.color},0 0 22px ${pr.color}"></div></div>`).join('')}</div>`;
if(type==='fuerzas') c.innerHTML=`<div style="font-family:Rajdhani;font-weight:600"><span style="color:#00ff88;font-family:Orbitron">FUERZAS CLON / GUARNICIÓN:</span><br>${p.forces}<br><br><span style="color:#00ff88">FAUNA:</span><br>${p.fauna}<br><br><span style="color:#00ff88">CIVILES:</span><br>${p.civil}<br><br><span style="color:#ffcc00">SECTOR:</span> ${p.sector}</div>`;
if(type==='unidades') c.innerHTML=`<div style="width:100%;height:220px;border:1px solid #00aaff;border-radius:10px;overflow:hidden;box-shadow:0 0 14px rgba(0,170,255,0.35)"><img src="${p.unitImg}" onerror="this.src='./SH_TROOPS_QP.png'" style="width:100%;height:100%;object-fit:cover"></div><div style="margin-top:12px;font-family:Rajdhani;font-weight:800">${p.produccion.map(pr=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 0 5px 0;letter-spacing:0.5px;font-family:Orbitron"><span>${pr.label}</span><span style="color:${pr.color};text-shadow:0 0 8px ${pr.color}">${pr.value}</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)"><div style="width:${pr.pct}%;height:100%;background:${pr.color};box-shadow:0 0 12px ${pr.color}"></div></div>`).join('')}</div>`;{
// FIX DEFINITIVO SEGUNDA IMAGEN - AHORA USA unitImg - 260PX GRANDE
let html=`<div style="margin-bottom:18px"><img src="${p.unitImg}" style="width:100%;height:260px;object-fit:cover;border:1px solid ${p.color};border-radius:8px;box-shadow:0 0 18px ${p.color};display:block;background:#000" onerror="this.src='${p.imgDetail}'"><div style="margin-top:14px">`;
p.produccion.forEach(pr=>{ html+=`<div style="display:flex;justify-content:space-between;font-size:11px;margin:9px 0 5px 0;font-weight:900;font-family:Orbitron"><span>${pr.label}</span><span style="color:${pr.color};text-shadow:0 0 8px ${pr.color}">${pr.value}</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden"><div style="width:${pr.pct}%;height:100%;background:${pr.color};box-shadow:0 0 12px ${pr.color}"></div></div>`; });
html+=`</div></div><div style="font-size:10px;color:#888;margin-top:12px;line-height:1.6;font-family:Orbitron"><b style="color:${p.color}">TROPAS REF:</b> ${p.name} - ${p.productionType}<br><b>IMAGEN:</b> ${p.unitImg}<br><b>FACCIÓN:</b> ${p.faction}<br><b>CLIMA:</b> ${p.clima}<br><span style="font-size:8px;color:#555">Cambiá unitImg en PARTE 3/7 - Ej:./Kamino_troops.png ->./TU_FOTO.png</span></div>`;
c.innerHTML=html;
}
}
