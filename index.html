<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM PULSE // MAPA GALACTICO</title>
<style>
body{margin:0;background:#020208;color:#fff;font-family:'Courier New',monospace;overflow:hidden}
#map{
position:relative;width:100vw;height:100vh;
background: url('./galaxy_bg.jpg') center/cover no-repeat, radial-gradient(ellipse at center, #1a0b3a 0%, #050510 70%);
}
/* TITULO GRANDE GRUESO NEON FLUOR */
#title{
position:absolute;top:14px;left:50%;transform:translateX(-50%);
border:2px solid #00ff88;padding:14px 40px;background:rgba(0,0,0,0.9);
color:#00ff88;z-index:100;letter-spacing:5px;font-size:26px;font-weight:900;
text-shadow:0 0 10px #00ff88, 0 0 25px #00ff88, 0 0 50px #00ff88;
box-shadow:0 0 15px #00ff88, 0 0 40px rgba(0,255,136,0.6), inset 0 0 20px rgba(0,255,136,0.15);
text-align:center;
}
/* PLANETAS CON AURA DEL COLOR DEL PLANETA */
.planet{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;z-index:3}
.planet .aura{
width:48px;height:48px;border-radius:50%;
box-shadow:0 0 15px currentColor, 0 0 35px currentColor, 0 0 60px currentColor;
display:flex;align-items:center;justify-content:center;transition:0.25s;
}
.planet img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.planet:hover .aura{transform:scale(1.4);box-shadow:0 0 25px currentColor, 0 0 50px currentColor, 0 0 80px currentColor}
.planet .label{
font-size:11px;margin-top:8px;font-weight:900;letter-spacing:1px;
text-shadow:0 0 8px currentColor, 0 0 15px currentColor;color:currentColor;
}
canvas#routes{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#planets-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2}
#audio-controls{position:absolute;top:18px;right:18px;z-index:101;background:rgba(0,0,0,0.9);border:1px solid #00ff88;padding:7px 14px;color:#00ff88;font-size:10px;cursor:pointer;box-shadow:0 0 10px #00ff88}
#left-menu{
position:absolute;left:15px;top:90px;width:230px;max-height:75vh;overflow-y:auto;
background:rgba(0,0,0,0.92);border:2px solid #00ff88;z-index:20;box-shadow:0 0 20px #00ff88;
}
#left-menu h3{margin:0;padding:10px 12px;font-size:12px;font-weight:900;background:rgba(0,255,136,0.15);border-bottom:2px solid #00ff88;color:#00ff88;letter-spacing:2px;text-shadow:0 0 8px #00ff88}
.legion-item{padding:7px 12px;font-size:10px;color:#7affb8;border-bottom:1px solid rgba(0,255,136,0.15);cursor:pointer;font-weight:700}
.legion-item:hover{background:rgba(0,255,136,0.2);color:#fff;box-shadow:inset 0 0 10px rgba(0,255,136,0.3)}
/* FICHA PEQUEÑA CENTRADA TIPO HOLOGRAMA */
#detail{
position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:90%;max-width:820px;max-height:85vh;overflow-y:auto;
background:rgba(5,8,15,0.98);border:2px solid #00ff88;display:none;z-index:80;
box-shadow:0 0 30px #00ff88, 0 0 80px rgba(0,255,136,0.3), inset 0 0 30px rgba(0,255,136,0.1);
}
.detail-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(0,255,136,0.1);border-bottom:2px solid #00ff88}
.detail-top h2{margin:0;font-size:20px;font-weight:900;letter-spacing:2px;text-shadow:0 0 12px currentColor}
.detail-grid{display:flex;gap:18px;padding:18px;flex-wrap:wrap}
.tabBtn{background:transparent;color:#00ff88;border:2px solid #00ff88;padding:6px 14px;margin-right:8px;cursor:pointer;font-size:10px;font-weight:900;letter-spacing:1px;box-shadow:0 0 8px rgba(0,255,136,0.3)}
.tabBtn.active{background:#00ff88;color:#000;box-shadow:0 0 15px #00ff88}
#tabContent{margin-top:12px;font-size:11px;line-height:1.7;background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,136,0.2);padding:12px;color:#b8ffda;min-height:90px}
.glitch-detail{position:relative;overflow:hidden}
.glitch-detail::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg, rgba(255,0,0,0.15) 0px, transparent 2px, rgba(0,255,0,0.1) 3px);animation:glitchBars 0.2s infinite;z-index:2;pointer-events:none}
@keyframes glitchBars{0%{transform:translateY(0)}100%{transform:translateY(5px)}}
.glitch-detail img{filter:contrast(1.4) hue-rotate(15deg) saturate(1.5)}
</style>

let audioCtx=null, audioEnabled=true;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function toggleAudio(){ initAudio(); audioEnabled=!audioEnabled; document.getElementById('audio-controls').innerText=audioEnabled?'🔊 NEON AUDIO ON':'🔇 AUDIO OFF'; }
function tone(f,t,v,d,g=null){ if(!audioEnabled||!audioCtx) return; const o=audioCtx.createOscillator(),ga=audioCtx.createGain(); o.type=t;o.frequency.value=f; o.connect(ga); ga.connect(audioCtx.destination); const n=audioCtx.currentTime; ga.gain.setValueAtTime(0,n); ga.gain.linearRampToValueAtTime(v,n+0.02); if(g) o.frequency.linearRampToValueAtTime(g,n+d); ga.gain.exponentialRampToValueAtTime(0.001,n+d); o.start(n); o.stop(n+d); }
function playHover(){ initAudio(); tone(800,'sine',0.15,0.12,1200); }
function playClick(){ initAudio(); tone(250,'square',0.25,0.15,50); setTimeout(()=>tone(700,'sine',0.18,0.15),60); }
function playClose(){ initAudio(); tone(900,'sawtooth',0.15,0.2,80); }
function playSubmenu(){ initAudio(); tone(1300,'triangle',0.12,0.08,1700); }
function playHyperspace(){ initAudio(); tone(120,'sawtooth',0.3,0.5,900); }

const routes=[
{from:"pulsar",to:"coruscant",color:"#00ffcc",dash:false,width:2.5},
{from:"hoth",to:"umbara",color:"#ccffff",dash:false,width:2.5},
{from:"coruscant",to:"anaxes",color:"#00ff88",dash:false,width:2.2},

{from:"anaxes",to:"felucia",color:"#00ff88",dash:false,width:2.2},

{from:"tatooine",to:"mandalore",color:"#ffcc00",dash:false,width:2},
{from:"mandalore",to:"coruscant",color:"#ffcc00",dash:false,width:2},
{from:"tatooine",to:"geonosis",color:"#ffcc00",dash:false,width:2},
{from:"anaxes",to:"umbara",color:"#ff4444",dash:true,width:2},
{from:"umbara",to:"felucia",color:"#ff4444",dash:true,width:2},
{from:"felucia",to:"geonosis",color:"#ff4444",dash:true,width:2},
{from:"geonosis",to:"mustafar",color:"#ff2222",dash:true,width:2.8},
{from:"mandalore",to:"mustafar",color:"#ff2222",dash:true,width:2}
];
 function renderPlanets(){
const layer=document.getElementById('planets-layer'); layer.innerHTML='';
planets.forEach(p=>{
const div=document.createElement('div'); div.className='planet';
div.style.left=p.x+'%'; div.style.top=p.y+'%'; div.style.color=p.color;
div.innerHTML=`<div class="aura" style="color:${p.color}"><img src="${p.img}" onerror="this.style.background='${p.color}'"></div><div class="label">${p.name}</div>`;
div.onmouseenter=()=>playHover();
div.onclick=()=>{ playClick(); showDetail(p); };
layer.appendChild(div);
});
renderLegionMenu();
}
function renderLegionMenu(){
const list=document.getElementById('legion-list'); list.innerHTML='';
planets.forEach(p=>{ p.units.forEach(u=>{
const d=document.createElement('div'); d.className='legion-item';
d.innerHTML=`<span style="color:${p.color}">●</span> ${p.name} - ${u.name}`;
d.onclick=()=>{playClick(); showDetail(p);}; list.appendChild(d);
}); });
}
function renderRoutes(){
const canvas=document.getElementById('routes'); const ctx=canvas.getContext('2d');
function resize(){ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; draw(); }
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
routes.forEach(r=>{
const a=planets.find(x=>x.id===r.from), b=planets.find(x=>x.id===r.to); if(!a||!b) return;
const x1=a.x/100*canvas.width, y1=a.y/100*canvas.height, x2=b.x/100*canvas.width, y2=b.y/100*canvas.height;
ctx.beginPath();
ctx.strokeStyle=r.color; ctx.lineWidth=r.width; ctx.globalAlpha=0.9;
ctx.shadowBlur=18; ctx.shadowColor=r.color; // NEON FLUOR FUERTE
if(r.dash) ctx.setLineDash([10,6]); else ctx.setLineDash([]);
ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
ctx.setLineDash([]); ctx.globalAlpha=1; ctx.shadowBlur=0;
});
}
window.addEventListener('resize',resize); resize();
}
let currentId=null;
function showDetail(p){
currentId=p.id; playHyperspace();
const isCorrupt = (p.id==='geonosis' || p.id==='mustafar'); // GLITCH SOLO ACA EN IMAGEN DETALLE
const d=document.getElementById('detail'); d.style.display='block';
d.innerHTML=`
<div class="detail-top">
<h2 style="color:${p.color};text-shadow:0 0 15px ${p.color}">${p.name} // ${p.statusText}</h2>
<button onclick="closeDetail()" style="background:#000;color:#ff4444;border:2px solid #ff4444;padding:6px 12px;cursor:pointer;font-weight:900;box-shadow:0 0 10px #f44">✕ CERRAR [ESC]</button>
</div>
<div class="detail-grid">
<div class="${isCorrupt?'glitch-detail':''}" style="width:260px">
<img src="${p.imgDetail}" style="width:100%;height:160px;object-fit:cover;border:2px solid ${p.color};box-shadow:0 0 20px ${p.color}" onerror="this.style.display='none'">
${isCorrupt?'<div style="position:absolute;top:5px;left:5px;background:#f44;color:#000;font-size:8px;font-weight:900;padding:2px 5px;z-index:3">⚠ SEÑAL CORRUPTA</div>':''}
<div style="margin-top:10px;display:flex;gap:6px">
<button class="tabBtn active" onclick="showTab('lore')">LORE</button>
<button class="tabBtn" onclick="showTab('pop')">POBLACION / BENEFICIO</button>
<button class="tabBtn" onclick="showTab('forces')">FUERZAS CLON</button>
<button class="tabBtn" onclick="showTab('fauna')">FAUNA / CIVILES / FACCION</button>
</div>
</div>
<div style="flex:1;min-width:280px">
<p style="font-size:12px;line-height:1.5;color:#fff;font-weight:700;margin:0 0 10px 0">${p.desc}</p>
<div id="tabContent"></div>
<div style="margin-top:12px;display:flex;gap:10px;align-items:center">
<img src="${p.unitImg}" class="${isCorrupt?'glitch-detail':''}" style="width:90px;height:90px;object-fit:cover;border:1px solid #333;box-shadow:0 0 15px ${p.color}" onerror="this.style.display='none'">
<div style="font-size:9px;color:#888">TROPAS REF: ${p.name}<br>FACCION: ${p.faction}</div>
</div>
</div>
</div>`;
showTab('lore');
}
function showTab(tab){
playSubmenu();
const p=planets.find(x=>x.id===currentId); const c=document.getElementById('tabContent');
if(!p) return;
if(tab==='lore') c.innerHTML=`<b style="color:#00ff88">LORE INICIO GUERRAS CLON:</b><br>${p.desc}<br><br><b>SECTOR:</b> ${p.sector}<br><b>CLIMA:</b> ${p.clima}`;
if(tab==='pop') c.innerHTML=`<b style="color:#00ff88">POBLACION:</b> ${p.population}<br><br><b style="color:#ffd700">BENEFICIO PLANETARIO:</b><br>${p.benefit}`;
if(tab==='forces') c.innerHTML=`<b style="color:#00ff88">FUERZAS CLON / GUARNICION:</b><br>${p.forces}<br><br>${p.units.map(u=>`<div style="color:${u.color};font-weight:900">● ${u.name} - ${u.count} [${u.pct}%]</div>`).join('')}`;
if(tab==='fauna') c.innerHTML=`<b style="color:#00ff88">FAUNA Y CIVILES:</b><br>${p.fauna_civiles}<br><br><b style="color:#ff8844">FACCION:</b> ${p.faction}`;
document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
}
function closeDetail(){ playClose(); document.getElementById('detail').style.display='none'; }
window.onload=()=>{ renderPlanets(); renderRoutes(); document.body.addEventListener('click',()=>{initAudio();},{once:true}); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
</script>
