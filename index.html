<script>
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function tone(f,t,d,v=0.15){
  try{
    initAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=t; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function sHover(){ tone(880,'sine',0.1,0.06); }
function sClick(){ tone(440,'triangle',0.15,0.18); setTimeout(()=>tone(880,'sine',0.22,0.1),60); }
function sOpen(){ tone(200,'sawtooth',0.3,0.12); setTimeout(()=>tone(660,'sine',0.45,0.14),110); setTimeout(()=>tone(1320,'sine',0.5,0.08),180); }
function sClose(){ tone(660,'sine',0.18,0.1); setTimeout(()=>tone(180,'sawtooth',0.35,0.12),90); }
function sWar(){ tone(90,'square',0.5,0.2); tone(45,'sawtooth',0.8,0.15); }
let currentPlanet=null, currentTab='lore', devClicks=0, warBalance=0;
function getRouteType(a,b){
  if(a.status===b.status) return a.status.toLowerCase();
  if(a.status==="Hostil"||b.status==="Hostil") return "hostil";
  if(a.status==="Amigable"&&b.status==="Amigable") return "amigable";
  return "neutral";
}
     </script>
     <script>
function renderMap(){
  const inner=document.getElementById('mapInner');
  const svg=document.getElementById('svgRoutes');
  const quick=document.getElementById('quickBox');
  [...inner.querySelectorAll('.planet-dot,.planet-label')].forEach(e=>{ if(e.id!=='quickBox') e.remove(); });
  svg.innerHTML="";
  routes.forEach(r=>{
    let a=planets.find(p=>p.id===r[0]), b=planets.find(p=>p.id===r[1]);
    if(!a||!b) return;
    let t=getRouteType(a,b);
    let col = t==="amigable"?"#3fa9ff": t==="hostil"?"#ff3b3b":"#ffdd55";
    svg.innerHTML+=`<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="${col}" stroke-width="4" stroke-dasharray="10 7" opacity="0.9"/>`;
  });
  planets.forEach(p=>{
    const dot=document.createElement('div');
    dot.className='planet-dot '+p.status.toLowerCase()+(p.glitch?' glitch':'');
    dot.style.left=p.x+'%'; dot.style.top=p.y+'%';
    dot.title=`${p.id} - ${p.status}`;
    dot.addEventListener('mouseenter', sHover);
    dot.addEventListener('click', ()=>{ sClick(); showPlanet(p.id); });
    const label=document.createElement('div');
    label.className='planet-label';
    label.style.left=p.x+'%'; label.style.top=`calc(${p.y}% + 20px)`;
    label.style.color = p.status==='Hostil'?'#ff5566': p.status==='Amigable'?'#55aaff':'#ffdd55';
    label.innerText=p.id.toUpperCase();
    inner.appendChild(dot); inner.appendChild(label);
  });
  inner.appendChild(quick);
}
     </script>
     <script>
function showPlanet(id){
  const p=planets.find(x=>x.id===id); if(!p) return;
  currentPlanet=p;
  const img=document.getElementById('detailImg');
  const wrap=document.getElementById('detailImgWrap');
  img.src=p.unitImg; img.onerror=function(){ this.src='./SH_TROOPS_QP.png'; };
  wrap.className='detail-img'+(p.glitch?' glitch':'');
  document.getElementById('detailName').innerText=p.id.toUpperCase();
  document.getElementById('detailMeta').innerText=`${p.sector} // ${p.clima} // ${p.status.toUpperCase()}`;
  switchTab('lore');
  document.getElementById('detail').classList.add('open');
  sOpen();
  const q=document.getElementById('quickBox');
  q.innerHTML=`
    <div style="font-family:Orbitron;font-size:11px;color:var(--neon);letter-spacing:2px;margin-bottom:6px">${p.id.toUpperCase()}</div>
    ${p.produccion.map(pr=>`<div style="display:flex;justify-content:space-between;font-family:'Share Tech Mono';font-size:9px;margin:4px 0"><span>${pr.label}</span><span style="color:${pr.color}">${pr.value}</span></div>`).join('')}
    <div style="margin-top:8px;padding:6px;border:1px dashed rgba(0,255,136,0.3);border-radius:6px;font-size:9px;color:#aaffaa"><b style="color:var(--neon)">BENEFICIO:</b><br>${p.benefit}</div>
    <div style="margin-top:6px;font-size:8px;opacity:0.6;font-family:Orbitron">${p.troops} // ${p.status}</div>
  `;
  q.style.left=`calc(${p.x}% + 26px)`;
  q.style.top=`calc(${p.y}% - 30px)`;
  q.classList.add('active');
  clearTimeout(window._qTimer);
  window._qTimer=setTimeout(()=>q.classList.remove('active'), 5000);
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('quickBox').classList.remove('active');
  sClose();
}
function switchTab(type){
  if(!currentPlanet) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const idx={lore:0,datos:1,fuerzas:2,unidades:3}[type];
  document.querySelectorAll('.tab')[idx].classList.add('active');
  const p=currentPlanet, c=document.getElementById('detailContent');
  const col = p.status==='Hostil'?'#ff3344':p.status==='Amigable'?'#00aaff':'#ffd700';
  const badge=`<div class="status-badge" style="border-color:${col};color:${col}">RUTA: ${p.status.toUpperCase()} - ${p.faction}</div>`;
  if(type==='lore') c.innerHTML=`${badge}<div style="line-height:1.7"><span style="color:var(--neon);font-family:Orbitron;font-size:10px">LORE EXPANDIDO // 22 ABY:</span><br><br>${p.lore}<br><br><span style="color:var(--neon)">CLIMA:</span> ${p.clima}<br><span style="color:var(--neon)">FACCIÓN:</span> ${p.faction}</div>`;
  if(type==='datos') c.innerHTML=`${badge}<div><span style="color:var(--neon)">POBLACIÓN:</span> ${p.population}<br><br><span style="color:var(--gold)">BENEFICIO:</span> ${p.benefit}<br><br>${p.produccion.map(pr=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin:12px 0 5px 0;font-family:Orbitron;font-weight:900"><span>${pr.label}</span><span style="color:${pr.color}">${pr.value}</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px"><div style="width:${pr.pct}%;height:100%;background:${pr.color};box-shadow:0 0 12px ${pr.color}"></div></div>`).join('')}</div>`;
  if(type==='fuerzas') c.innerHTML=`${badge}<div><span style="color:var(--neon)">FUERZAS:</span><br>${p.forces}<br><br><span style="color:var(--neon)">FAUNA:</span> ${p.fauna}<br><br><span style="color:var(--neon)">CIVILES:</span> ${p.civil}<br><br><span style="color:${col}">ESTADO:</span> ${p.status}</div>`;
  if(type==='unidades') c.innerHTML=`${badge}<div style="width:100%;height:230px;border:1px solid ${col};border-radius:12px;overflow:hidden"><img src="${p.unitImg}" onerror="this.src='./SH_TROOPS_QP.png'" style="width:100%;height:100%;object-fit:cover"></div><div style="margin-top:10px;padding:10px;border:1px dashed rgba(0,255,136,0.25);border-radius:8px;font-size:10px;color:var(--neon)">UNIDAD: ${p.faction}<br>TROPAS: ${p.troops}<br>RUTA: ${p.status}</div>`;
}
     </script>
     <script>

document.getElementById('title').addEventListener('click', ()=>{
  devClicks++; tone(600+devClicks*80,'sine',0.1,0.08);

  if(e.ctrlKey&&e.shiftKey&&e.key==='D'){ document.getElementById('devControls').classList.toggle('active'); sClick(); }
  if(e.key==='Escape') closeDetail();
});

     <script>
let scale=1, panX=0, panY=0, startX=0, startY=0, isDragging=false, lastDist=0;
const mapEl = document.getElementById('map');
const innerEl = document.getElementById('mapInner');
function applyTransform(){ innerEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }
mapEl.addEventListener('mousedown', e=>{ isDragging=true; startX=e.clientX-panX; startY=e.clientY-panY; });
mapEl.addEventListener('mousemove', e=>{ if(!isDragging) return; panX=e.clientX-startX; panY=e.clientY-startY; applyTransform(); });
window.addEventListener('mouseup', ()=>isDragging=false);
mapEl.addEventListener('wheel', e=>{ e.preventDefault(); let d=e.deltaY>0?-0.1:0.1; scale=Math.min(Math.max(0.6,scale+d),3.5); applyTransform(); },{passive:false});
mapEl.addEventListener('touchstart', e=>{
  if(e.touches.length===1){ isDragging=true; startX=e.touches[0].clientX-panX; startY=e.touches[0].clientY-panY; }
  else if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
},{passive:false});
mapEl.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===1&&isDragging){ panX=e.touches[0].clientX-startX; panY=e.touches[0].clientY-startY; applyTransform(); }
  else if(e.touches.length===2){
    let dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(lastDist>0){ scale=Math.min(Math.max(0.6,scale+(dist-lastDist)*0.01),3.5); applyTransform(); }
    lastDist=dist;
  }
},{passive:false});
mapEl.addEventListener('touchend', ()=>{ isDragging=false; lastDist=0; });
mapEl.addEventListener('click', e=>{ if(e.target.id==='map'||e.target.id==='mapInner'||e.target.id==='svgRoutes') closeDetail(); });
     </script>
