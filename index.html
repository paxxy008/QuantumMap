<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM PULSE - CWRP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#00d4ff;--red:#ff2244;--yellow:#ffcc00;--violet:#a855f7;--orange:#ff7a00}
body{background:#02020a;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff;user-select:none}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;background:#000;cursor:grab}
#viewport:active{cursor:grabbing}
#world{width:2000px;height:1400px;background: url('./fondo.jpg') center/cover no-repeat, radial-gradient(ellipse at center,#1a1a3a 0%,#050510 70%,#000 100%);position:absolute;left:50%;top:50%;transform-origin:center center;will-change:transform; transform:translate(-50%,-50%) scale(1);}
svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg#routes line{stroke-width:1.3;stroke-linecap:round;opacity:0.9;filter:drop-shadow(0 0 4px currentColor)}
.route-rep{stroke:var(--blue)} .route-cis{stroke:var(--red)} .route-neutral{stroke:var(--yellow)} .route-mandalore{stroke:var(--violet)} .route-hutt{stroke:var(--orange)}
.planet{position:absolute;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:3}
.planet-core{width:100%;height:100%;border-radius:50%;box-shadow: inset -6px -6px 12px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.7)}
.planet-aura{position:absolute;inset:-10px;border-radius:50%;opacity:0.55;filter:blur(8px);z-index:-1}
.planet:hover{transform:translate(-50%,-50%) scale(1.35)}
.planet-label{position:absolute;top:120%;left:50%;transform:translateX(-50%);font-family:'Orbitron';font-size:9.5px;font-weight:700;letter-spacing:1.5px;white-space:nowrap;text-shadow:0 0 6px currentColor}
#title-box{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:20;border:1px solid rgba(255,255,255,0.9); background:rgba(0,0,0,0.75); backdrop-filter:blur(10px);padding:12px 36px;clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);box-shadow: 0 0 20px rgba(255,255,255,0.25)}
#title-box h1{font-family:'Orbitron';font-size:22px;letter-spacing:5px;font-weight:900;color:#fff; text-shadow: 0 0 12px #fff, 0 0 30px rgba(100,200,255,0.8)}
#controls{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;gap:8px}
.ctrl-btn{width:38px;height:38px;background:rgba(0,0,0,0.8);border:1px solid var(--blue);color:var(--blue);font-family:'Orbitron';font-weight:700;cursor:pointer;border-radius:6px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:30;display:none;backdrop-filter:blur(6px)}
#planet-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:92vw;max-width:560px; background:rgba(8,14,28,0.96); border:1px solid var(--blue); box-shadow:0 0 40px rgba(0,212,255,0.3);display:none}
.modal-head{display:grid;grid-template-columns:120px 1fr 1fr;gap:10px;padding:14px;border-bottom:1px solid rgba(0,212,255,0.2)}
.modal-img{height:92px;border:1px solid rgba(255,255,255,0.15);background-size:cover;background-position:center;display:flex;align-items:end;padding:4px;font-family:'Orbitron';font-size:8px}
.modal-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.1)}
.tab{flex:1;padding:10px 6px;text-align:center;font-family:'Orbitron';font-size:10px;cursor:pointer;background:rgba(255,255,255,0.03)}
.tab.active{background:var(--blue);color:#000;font-weight:700}
.tab-content{padding:16px;min-height:130px;font-size:14px;line-height:1.5}
.close-btn{width:100%;padding:12px;background:transparent;border:0;border-top:1px solid var(--blue);color:var(--blue);font-family:'Orbitron';font-size:12px;letter-spacing:3px;font-weight:700;cursor:pointer}
.close-btn:hover{background:var(--blue);color:#000}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="routes"></svg></div></div>
<div id="title-box"><h1>QUANTUM PULSE - CWRP</h1></div>
<div id="controls"><button class="ctrl-btn" onclick="zoom(0.15)">+</button><button class="ctrl-btn" onclick="zoom(-0.15)">-</button><button class="ctrl-btn" onclick="resetView()" style="width:auto;padding:0 10px;font-size:10px">RESET</button></div>
<div id="overlay" onclick="closeModal()"></div>
<div id="planet-modal">
  <div class="modal-head"><div id="m-img-planet" class="modal-img">PLANET</div><div id="m-img-main" class="modal-img">MAIN</div><div id="m-img-troops" class="modal-img">TROOPS</div></div>
  <div class="modal-tabs"><div class="tab active" data-t="lore" onclick="switchTab('lore')">LORE</div><div class="tab" data-t="benef" onclick="switchTab('benef')">BENEFICIO / PRODUCCIÓN</div><div class="tab" data-t="troops" onclick="switchTab('troops')">TROPAS / CIVILES / FAUNA</div></div>
  <div id="tab-lore" class="tab-content"></div><div id="tab-benef" class="tab-content" style="display:none"></div><div id="tab-troops" class="tab-content" style="display:none"></div>
  <button class="close-btn" onclick="closeModal()">CERRAR TRANSMISIÓN</button>
</div>
<script>
const planets = [
  {id:"coruscant", name:"CORUSCANT", x:1000, y:680, color:"#4da6ff", faction:"rep", size:54, lore:"Capital de la República. Ciudad-planeta.", benef:"REP: +15% créditos misiones políticas.", troops:"Guardia Coruscanti, Shock Troopers. Fauna: Convors.", img:""},
  {id:"alderaan", name:"ALDERAAN", x:890, y:560, color:"#8ecfff", faction:"rep", size:38, lore:"Mundo pacifista.", benef:"REP: +10% diplomacia.", troops:"Alderaan Security. Fauna: Thranta.", img:""},
  {id:"anaxes", name:"ANAXES", x:460, y:520, color:"#ffcc66", faction:"rep", size:36, lore:"Fortaleza naval.", benef:"REP: Desbloquea Venator +20% daño.", troops:"Anaxes Officers, ARC.", img:""},
  {id:"kashyyyk", name:"KASHYYYK", x:620, y:1120, color:"#5aff8a", faction:"rep", size:40, lore:"Mundo Wookiee.", benef:"REP: Madera Wroshyr.", troops:"Wookiee Warriors. Fauna: Wyyyschokk.", img:""},
  {id:"naboo", name:"NABOO", x:1080, y:880, color:"#4da6ff", faction:"rep", size:40, lore:"Naboo y Gungans.", benef:"REP: Plasma +12% escudos.", troops:"Gungan Army. Fauna: Kaadu.", img:""},
  {id:"rishi", name:"RISHI MOON", x:1580, y:800, color:"#33e5ff", faction:"rep", size:32, lore:"Puesto escucha.", benef:"REP: +25% radar.", troops:"Shinies. Fauna: Rishi Eel.", img:""},
  {id:"kamino", name:"KAMINO", x:1820, y:1240, color:"#33e5ff", faction:"rep", size:36, lore:"Clonadores.", benef:"REP: -20% coste tropas.", troops:"Kaminoans, Clones. Fauna: Aiwhas.", img:""},
  {id:"pulsar", name:"PULSAR", x:180, y:980, color:"#33ffcc", faction:"rep", size:28, lore:"Estación relé. SOLO ruta directa a Coruscant.", benef:"REP: +30% transmisión. Ruta exclusiva.", troops:"Técnicos.", img:""},
  {id:"hoth", name:"HOTH", x:320, y:120, color:"#cceeff", faction:"neutral", size:30, lore:"Helado Borde Exterior.", benef:"NEUTRAL: Cristales hielo.", troops:"Contrabandistas. Fauna: Wampa.", img:""},
  {id:"felucia", name:"FELUCIA", x:620, y:860, color:"#66ff99", faction:"neutral", size:34, lore:"Selva bioluminiscente.", benef:"NEUTRAL: +8% curación.", troops:"Felucian. Fauna: Acklay.", img:""},
  {id:"lothal", name:"LOTHAL", x:680, y:700, color:"#ffdd77", faction:"neutral", size:34, lore:"Mundo agrícola.", benef:"NEUTRAL: Recursos grano.", troops:"Granjeros. Fauna: Loth-cat.", img:""},
  {id:"mandalore", name:"MANDALORE", x:980, y:380, color:"#a855f7", faction:"mandalore", size:38, lore:"Mandalorianos.", benef:"VIOLETA: Beskar limitado.", troops:"Mandalorianos. Fauna: Mythosaur.", img:""},
  {id:"tatooine", name:"TATOOINE", x:1210, y:980, color:"#ff7a00", faction:"hutt", size:38, lore:"Desierto Hutt.", benef:"NARANJA HUTT: Mercado negro.", troops:"Mercenarios Hutt. Fauna: Krayt.", img:""},
  {id:"kessel", name:"KESSEL", x:1380, y:300, color:"#ff5533", faction:"cis", size:32, lore:"Minas especia.", benef:"CIS: Spice +20% hiper.", troops:"Pyke. Fauna: Energy spiders.", img:""},
  {id:"christophsis", name:"CHRISTOPHSIS", x:1280, y:600, color:"#ff88aa", faction:"cis", size:38, lore:"Cristalino.", benef:"CIS: Cristales cañones.", troops:"B1/B2 Droides.", img:""},
  {id:"utapau", name:"UTAPAU", x:1400, y:760, color:"#ffaa66", faction:"cis", size:36, lore:"Sumideros.", benef:"CIS: Refugio oculto.", troops:"Utapau Security. Fauna: Varactyl.", img:""},
  {id:"mustafar", name:"MUSTAFAR", x:1500, y:1060, color:"#ff3300", faction:"cis", size:36, lore:"Volcánico CIS.", benef:"CIS: +18% droides.", troops:"Mustafarians. Fauna: Lava flea.", img:""},
  {id:"geonosis", name:"GEONOSIS", x:820, y:1030, color:"#ff5533", faction:"cis", size:40, lore:"Fábricas droides.", benef:"CIS: -25% coste droides.", troops:"Geonosians. Fauna: Orray.", img:""},
  {id:"cato", name:"CATO NEIMOIDIA", x:720, y:760, color:"#c8ff8a", faction:"cis", size:32, lore:"Federación Comercio.", benef:"CIS: +20% créditos.", troops:"Neimoidian Guards.", img:""},
];
let routes = [["pulsar","coruscant"],["coruscant","alderaan"],["coruscant","anaxes"],["coruscant","lothal"],["coruscant","naboo"],["alderaan","mandalore"],["mandalore","kessel"],["kessel","christophsis"],["christophsis","utapau"],["anaxes","lothal"],["lothal","felucia"],["felucia","kashyyyk"],["kashyyyk","geonosis"],["geonosis","cato"],["cato","lothal"],["naboo","felucia"],["naboo","cato"],["naboo","tatooine"],["tatooine","mustafar"],["mustafar","rishi"],["mustafar","kamino"],["utapau","rishi"],["christophsis","tatooine"],["tatooine","geonosis"],["utapau","tatooine"],["hoth","anaxes"],["hoth","mandalore"],["kashyyyk","naboo"],["alderaan","christophsis"],["anaxes","felucia"]];
let scale=1, tx=0, ty=0, isDragging=false, startX, startY;
const world=document.getElementById('world'), viewport=document.getElementById('viewport'), svg=document.getElementById('routes');
function getRouteType(a,b){ if(a==="pulsar"||b==="pulsar") return "rep"; if(a==="mandalore"||b==="mandalore") return "mandalore"; if(a==="tatooine"||b==="tatooine") return "hutt"; const A=planets.find(p=>p.id===a), B=planets.find(p=>p.id===b); if(A.faction==="rep"&&B.faction==="rep") return "rep"; if(A.faction==="cis"&&B.faction==="cis") return "cis"; return "neutral"; }
function render(){ svg.innerHTML=""; routes.forEach(([a,b])=>{ const pA=planets.find(p=>p.id===a), pB=planets.find(p=>p.id===b); if(!pA||!pB) return; const type=getRouteType(a,b); const line=document.createElementNS("http://www.w3.org/2000/svg","line"); line.setAttribute("x1",pA.x); line.setAttribute("y1",pA.y); line.setAttribute("x2",pB.x); line.setAttribute("y2",pB.y); line.setAttribute("class","route-"+type); svg.appendChild(line); }); world.querySelectorAll('.planet').forEach(e=>e.remove()); planets.forEach(p=>{ const el=document.createElement('div'); el.className='planet'; el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.width=p.size+'px'; el.style.height=p.size+'px'; el.style.color=p.color; el.innerHTML=`<div class='planet-aura' style='background:${p.color}'></div><div class='planet-core' style='background:${p.color}'></div><div class='planet-label' style='color:${p.color}'>${p.name}</div>`; el.onclick=(e)=>{ e.stopPropagation(); openPlanet(p); playSound(800,0.12); }; world.appendChild(el); }); }
function openPlanet(p){ document.getElementById('overlay').style.display='block'; document.getElementById('planet-modal').style.display='block'; document.getElementById('tab-lore').innerHTML=p.lore; document.getElementById('tab-benef').innerHTML=p.benef; document.getElementById('tab-troops').innerHTML=p.troops; }
function switchTab(t){ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.querySelector(`[data-t="${t}"]`).classList.add('active'); document.getElementById('tab-lore').style.display=t==='lore'?'block':'none'; document.getElementById('tab-benef').style.display=t==='benef'?'block':'none'; document.getElementById('tab-troops').style.display=t==='troops'?'block':'none'; }
function closeModal(){ document.getElementById('overlay').style.display='none'; document.getElementById('planet-modal').style.display='none'; }
function applyTransform(){ world.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`; }
function zoom(d){ scale=Math.min(2.5, Math.max(0.45, scale+d)); applyTransform(); }
function resetView(){ scale=1; tx=0; ty=0; applyTransform(); }
viewport.addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY>0?-0.08:0.08); }, {passive:false});
viewport.addEventListener('mousedown', e=>{ isDragging=true; startX=e.clientX-tx; startY=e.clientY-ty; });
window.addEventListener('mousemove', e=>{ if(!isDragging) return; tx=e.clientX-startX; ty=e.clientY-startY; applyTransform(); });
window.addEventListener('mouseup', ()=>isDragging=false);
let audioCtx; function playSound(f,v){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.25); o.start(); o.stop(audioCtx.currentTime+0.26);}catch(e){} }
render();
</script>
</body>
</html>
