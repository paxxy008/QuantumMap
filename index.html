  ["Christophsis","Mygeeto"], ["Mygeeto","Mandalore"], ["Umbara","Ryloth"], ["Umbara","Anaxes"],
  ["Mustafar","Geonosis"], ["Mustafar","Tatooine"], ["Mustafar","Rishi Moon"],
  ["Rishi Moon","Kamino"], ["Kamino","Pulsar"], ["Pulsar","Hoth"], ["Hoth","Anaxes"],
  ["Kashyyyk","Hoth"], ["Alderaan","Kashyyyk"]
];
</script>
<script>
// AYUDA: MOTOR SONIDO AAA ESTILIZADO
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function tone(f,t,d,v=0.15){
  try{
    initAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=t; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+d);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function sHover(){ tone(880,'sine',0.1,0.06); }
function sClick(){ tone(440,'triangle',0.15,0.18); setTimeout(()=>tone(880,'sine',0.22,0.1),60); }
function sOpen(){ tone(200,'sawtooth',0.3,0.12); setTimeout(()=>tone(660,'sine',0.45,0.14),110); }
function sClose(){ tone(660,'sine',0.18,0.1); setTimeout(()=>tone(180,'sawtooth',0.35,0.12),90); }
function sWar(){ tone(90,'square',0.5,0.2); }
let currentPlanet=null, currentTab='lore', devClicks=0, warBalance=0;
function getRouteType(a,b){
  if(a.status===b.status) return a.status.toLowerCase();
  if(a.status==="Hostil"||b.status==="Hostil") return "hostil";
  if(a.status==="Amigable"&&b.status==="Amigable") return "amigable";
  return "neutral";
}
  </script>
  <script>
// AYUDA: RENDER MAPA - ACA ESTA EL FIX DE RUTAS GRUESAS
function renderMap(){
  const map=document.getElementById('map');
  const svg=document.getElementById('svgRoutes');
  // limpia solo puntos y labels, no el svg base
  [...map.querySelectorAll('.planet-dot,.planet-label')].forEach(e=>e.remove());
  svg.innerHTML="";
  // DIBUJA RUTAS CON GROSOR 4px
  routes.forEach(r=>{
    let a=planets.find(p=>p.id===r[0]), b=planets.find(p=>p.id===r[1]);
    if(!a||!b) return;
    let t=getRouteType(a,b);
    let col = t==="amigable"?"#3fa9ff": t==="hostil"?"#ff3b3b":"#ffdd55";
    // ACA ESTA EL GROSOR QUE PEDISTE - 4px
    svg.innerHTML+=`<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="${col}" stroke-width="4" stroke-dasharray="10 7" opacity="0.85"/>`;
  });
  // DIBUJA PLANETAS
  planets.forEach(p=>{
    const dot=document.createElement('div');
    dot.className='planet-dot '+p.status.toLowerCase()+(p.glitch?' glitch':'');
    dot.style.left=p.x+'%'; dot.style.top=p.y+'%';
    dot.title=`${p.id} - ${p.status}`;
    dot.addEventListener('mouseenter', sHover);
    dot.addEventListener('click', ()=>{ sClick(); showPlanet(p.id); });
    const label=document.createElement('div');
    label.className='planet-label';
    label.style.left=p.x+'%'; label.style.top=`calc(${p.y}% + 16px)`;
    label.style.color = p.status==='Hostil'?'#ff5566': p.status==='Amigable'?'#55aaff':'#ffdd55';
    label.innerText=p.id.toUpperCase();
    map.appendChild(dot); map.appendChild(label);
  });
}
  </script>
  <script>
function showPlanet(id){
  const p=planets.find(x=>x.id===id); if(!p) return;
  currentPlanet=p;
  const img=document.getElementById('detailImg');
  const wrap=document.getElementById('detailImgWrap');
  img.src=p.unitImg; img.onerror=function(){ this.src='./SH_TROOPS_QP.png'; };
  wrap.className='detail-img'+(p.glitch?' glitch':'');
  document.getElementById('detailName').innerText=p.id.toUpperCase();
  document.getElementById('detailMeta').innerText=`${p.sector} // ${p.clima} // ${p.status.toUpperCase()}`;
  switchTab('lore');
  document.getElementById('detail').classList.add('open');
  sOpen();
}
function closeDetail(){ document.getElementById('detail').classList.remove('open'); sClose(); }
function switchTab(type){
  if(!currentPlanet) return;
  currentTab=type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const idx={lore:0,datos:1,fuerzas:2,unidades:3}[type];
  document.querySelectorAll('.tab')[idx].classList.add('active');
  const p=currentPlanet, c=document.getElementById('detailContent');
  const statusColor = p.status==='Hostil'?'#ff3344':p.status==='Amigable'?'#00aaff':'#ffd700';
  const badge=`<div class="status-badge" style="border-color:${statusColor};color:${statusColor}">RUTA: ${p.status.toUpperCase()} - ${p.faction}</div>`;

  if(type==='lore') c.innerHTML=`${badge}<div style="line-height:1.7"><span style="color:var(--neon);font-family:Orbitron;font-size:10px">LORE EXPANDIDO // 22 ABY:</span><br><br>${p.lore}<br><br><span style="color:var(--neon)">CLIMA:</span> ${p.clima}<br><span style="color:var(--neon)">FACCIÓN:</span> ${p.faction}</div>`;
  if(type==='datos') c.innerHTML=`${badge}<div><span style="color:var(--neon)">POBLACIÓN:</span><br>${p.population}<br><br><span style="color:var(--gold)">BENEFICIO:</span><br>${p.benefit}<br><br>${p.produccion.map(pr=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 0 5px 0;font-family:Orbitron;font-weight:900"><span>${pr.label}</span><span style="color:${pr.color}">${pr.value}</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden"><div style="width:${pr.pct}%;height:100%;background:${pr.color}"></div></div>`).join('')}</div>`;
  if(type==='fuerzas') c.innerHTML=`${badge}<div><span style="color:var(--neon)">FUERZAS:</span><br>${p.forces}<br><br><span style="color:var(--neon)">FAUNA:</span><br>${p.fauna}<br><br><span style="color:var(--neon)">CIVILES:</span><br>${p.civil}</div>`;
  if(type==='unidades') c.innerHTML=`${badge}<div style="width:100%;height:230px;border:1px solid ${statusColor};border-radius:12px;overflow:hidden"><img src="${p.unitImg}" onerror="this.src='./SH_TROOPS_QP.png'" style="width:100%;height:100%;object-fit:cover"></div><div style="margin-top:12px;padding:10px;border:1px dashed rgba(0,255,136,0.25);border-radius:8px;font-size:10px;color:var(--neon)">UNIDAD: ${p.faction}<br>TROPAS: ${p.troops}<br>RUTA: ${p.status}</div>`;
}
  </script>
  <script>
// AYUDA: SISTEMA GUERRA SOLO VOS - 5 CLICKS EN TITULO
function addRepublic(v){ warBalance=Math.min(100,warBalance+v); renderMap(); sWar(); }
function addSeparatist(v){ warBalance=Math.max(-100,warBalance-v); renderMap(); sWar(); }
function resetWar(){ warBalance=0; renderMap(); sClose(); }
document.getElementById('title').addEventListener('click', ()=>{
  devClicks++; tone(600+devClicks*80,'sine',0.1,0.08);
  if(devClicks>=5){ document.getElementById('devControls').classList.toggle('active'); devClicks=0; sOpen(); }
  setTimeout(()=>{ if(devClicks>0&&devClicks<5) devClicks=0; },3000);
});
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey&&e.shiftKey&&e.key==='D'){ document.getElementById('devControls').classList.toggle('active'); sClick(); }
  if(e.key==='Escape') closeDetail();
});
window.addEventListener('load', ()=>{
  renderMap(); initAudio();
  console.log('%c QUANTUM PULSE V10 ONLINE - RUTAS 4PX ','background:#00ff88;color:#000;font-family:Orbitron;padding:12px;font-weight:900');
});
document.getElementById('map').addEventListener('click', (e)=>{ if(e.target.id==='map'||e.target.id==='svgRoutes') closeDetail(); });
  </script>
  <script>
// AYUDA: PARCHE ANTI TEXTO GRIS SUELTO
document.addEventListener('DOMContentLoaded', ()=>{
  const walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n; while(n=walker.nextNode()){
    if(n.nodeValue.includes('TROPAS REF')||n.nodeValue.trim()==='undefined') n.nodeValue='';
  }
});
</script>
