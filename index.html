<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quantum Pulse - Holomapa Galáctico ALPHA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Rajdhani',sans-serif;color:#fff;overflow:auto;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding-top:70px}
#galaxy{
  width:1200px;height:750px;
  max-width:88vw;max-height:78vh;
  background:url('./Galaxy_Quantum_Main_Map.png') center/cover no-repeat;
  position:relative;border:2px solid rgba(0,255,136,0.25);border-radius:12px;
  box-shadow:0 0 30px rgba(0,255,136,0.2);overflow:hidden;flex-shrink:0;
  font-size:0; line-height:0;
}
#galaxy::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,0.05) 30%,rgba(0,0,0,0.65) 95%);z-index:1;pointer-events:none}
.planet{
  position:absolute;width:22px;height:22px;
  border-radius:50%;cursor:pointer;
  transform:translate(-50%,-50%);box-shadow:0 0 12px currentColor,inset -3px -3px 6px rgba(0,0,0,0.9);
  transition:.25s;z-index:3;border:1.5px solid rgba(255,255,255,0.9);
  background-size:cover;background-position:center;
}
.planet:hover{transform:translate(-50%,-50%) scale(1.35);filter:brightness(1.2)}
.planet.selected{transform:translate(-50%,-50%) scale(1.55);z-index:6;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.planet.main{width:30px;height:30px;box-shadow:0 0 20px #00ff88,0 0 40px #00ff88; border:2px solid #00ffcc}
.planet-label{
  position:absolute;top:135%;left:50%;transform:translateX(-50%);
  font-family:'Orbitron';font-size:10px;font-weight:800;letter-spacing:1px;
  white-space:nowrap;text-shadow:0 1px 4px #000,0 0 10px currentColor;pointer-events:none;
  line-height:1;
}
svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
svg#routes line{stroke-width:1.6;stroke-linecap:round;opacity:0.75}
line.friendly{stroke:#00ffcc} line.hostile{stroke:#ff2244;stroke-width:2} line.neutral{stroke:#ffcc00}
.title-bar{
  position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:90;
  font-family:'Orbitron';font-weight:900;font-size:18px;letter-spacing:3px;color:#00ff88;
  background:rgba(0,18,12,0.95);border:2px solid #00ff88;border-radius:8px;padding:7px 22px;
  box-shadow:0 0 15px rgba(0,255,136,0.45);text-shadow:0 0 8px #00ff88;white-space:nowrap;
}#info-panel{
  position:fixed;right:14px;top:70px;width:440px;max-width:38vw;max-height:86vh;overflow-y:auto;
  background:linear-gradient(160deg,rgba(0,22,14,0.98),rgba(0,10,8,0.99));
  border:2px solid #00ff88;box-shadow:0 0 30px rgba(0,255,136,0.35);border-radius:12px;display:none;z-index:100
}
.panel-img{width:100%;aspect-ratio:16/9;height:auto;background-size:cover;background-position:center;background-color:#001a0f;border-bottom:1.5px solid rgba(0,255,136,0.3);position:relative}
.panel-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,15,10,0.9) 15%,transparent 60%)}
.sector-tag{position:absolute;bottom:10px;left:12px;z-index:2;background:rgba(0,0,0,0.75);border:1px solid #ffd700;color:#ffd700;font-family:'Orbitron';font-size:10px;padding:4px 10px;border-radius:4px;font-weight:700}
.status-tag{position:absolute;top:12px;left:12px;z-index:2}
.panel-body{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
#info-panel h2{margin:0;color:#00ff88;letter-spacing:2px;font-size:22px;font-family:'Orbitron';font-weight:900}
.status{padding:6px 12px;border-radius:4px;font-size:11px;display:inline-block;font-weight:900;font-family:'Orbitron'}
.republic{background:#0a2a40;border:1px solid #3ad4ff;color:#3ad4ff} .separatist{background:#3a0a0a;border:1px solid #ff4444;color:#ff6666}
.contested{background:#3a300a;border:1px solid #ffcc33;color:#ffdd55} .alpha{background:#0a2a1a;border:1px solid #00ff88;color:#00ff88}
.tabs{display:flex;gap:12px;margin:12px 0;border-bottom:1.5px solid rgba(0,255,136,0.2);padding-bottom:8px}
.tab{cursor:pointer;font-family:'Orbitron';font-size:12px;color:rgba(255,255,255,0.5);padding-bottom:5px;border-bottom:2px solid transparent;font-weight:700}
.tab.active{color:#00ff88;border-bottom:2px solid #00ff88}
.tab-content{display:none}.tab-content.active{display:block}
#info-panel p{font-size:16px;line-height:1.5;color:#e0ffee;font-weight:700;max-height:180px;overflow-y:auto}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.stat{background:rgba(0,255,136,0.07);border:1px solid rgba(0,255,136,0.18);padding:10px;border-radius:6px}
.stat span{display:block;font-family:'Orbitron';font-size:10px;color:#ffd700;margin-bottom:3px;font-weight:800} 
.stat b{font-size:15px;color:#fff;font-weight:800}
.unit-head{display:flex;justify-content:space-between;margin-bottom:5px;font-family:'Orbitron';font-size:12px;font-weight:800}
.unit-img{width:100%;aspect-ratio:16/9;height:auto;border-radius:6px;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#000;margin-bottom:12px;border:1px solid rgba(255,255,100,0.5)}
.btn{margin-top:12px;background:linear-gradient(90deg,#003322,#006644);border:1.5px solid #00ff88;padding:11px;border-radius:6px;cursor:pointer;color:#00ff88;font-weight:900;width:100%;letter-spacing:2px;font-family:'Orbitron';font-size:12px}
#side-menu{position:fixed;left:0;top:0;height:100vh;z-index:60;display:flex;flex-direction:column}
#menu-toggle{width:48px;height:48px;margin:12px 0 0 12px;background:rgba(0,22,14,0.98);border:2px solid #00ff88;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#menu-toggle span{display:block;width:22px;height:2px;background:#00ff88;position:relative}
#menu-toggle span::before,#menu-toggle span::after{content:'';position:absolute;left:0;width:22px;height:2px;background:#00ff88;transition:.25s}
#menu-toggle span::before{top:-7px} #menu-toggle span::after{top:7px}
#menu-toggle.open span{background:transparent} #menu-toggle.open span::before{top:0;transform:rotate(45deg)} #menu-toggle.open span::after{top:0;transform:rotate(-45deg)}
#menu-panel{width:0;overflow:hidden;background:rgba(0,18,12,0.99);border-right:2px solid #00ff88;transition:width .3s ease;margin-top:10px;display:flex;flex-direction:column}
#menu-panel.open{width:320px}
.menu-header{padding:18px 20px 14px;font-family:'Orbitron';font-size:13px;letter-spacing:2.5px;color:#00ff88;border-bottom:1px solid rgba(0,255,136,0.25);font-weight:800}
.menu-body{flex:1;overflow-y:auto} .menu-section{border-bottom:1px solid rgba(0,255,136,0.12)}
.menu-section-title{display:flex;justify-content:space-between;padding:14px 20px;cursor:pointer;font-family:'Orbitron';font-size:12px;color:#e8ffee;font-weight:700}
.menu-section-content{max-height:0;overflow:hidden;transition:max-height .3s ease;background:rgba(0,0,0,0.3)}
.menu-section.open .menu-section-content{max-height:500px}
.menu-placeholder{padding:16px 20px;font-size:14px;color:rgba(200,255,224,0.6)}
::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#00ff88;border-radius:4px}
.bar{height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%} .bar-fill.green{background:#00ff88} .bar-fill.yellow{background:#ffcc00} .bar-fill.red{background:#ff2244}
  @media(max-width:768px){
  body{padding-top:60px;align-items:center}
  #galaxy{width:900px;min-width:900px;height:600px;min-height:600px;max-width:none;max-height:none;margin:0;border-radius:0;border:none}
  .planet{width:26px !important;height:26px !important}
  .planet.main{width:34px !important;height:34px !important}
  .planet-label{font-size:11px !important}
  .title-bar{font-size:11px !important;letter-spacing:1.5px !important;padding:5px 12px !important;top:8px !important}
  #menu-panel.open{width:270px !important}
  #info-panel{
    right:0 !important;left:0 !important;top:auto !important;bottom:0 !important;
    width:100% !important;max-width:100% !important;max-height:78vh !important;
    border-radius:14px 14px 0 0 !important;
  }
  #info-panel h2{font-size:20px !important}
  #info-panel p{font-size:16px !important;max-height:120px !important}
  .tab{font-size:12px !important}
  .stat b{font-size:15px !important}
}
</style>
</head>
<body>
<div id="galaxy">
  <div class="title-bar">QUANTUM PULSE // MAPA GALACTICO</div>
  <svg id="routes"></svg>
</div>
<div id="info-panel">
  <div class="panel-img" id="info-img">
    <div id="info-status" class="status status-tag"></div>
    <div class="sector-tag">SECTOR: <span id="info-sector"></span></div>
  </div>
  <div class="panel-body">
    <h2 id="info-name"></h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">● LORE</div>
      <div class="tab" onclick="switchTab(1)">● DATOS</div>
      <div class="tab" onclick="switchTab(2)">● FUERZAS</div>
      <div class="tab" onclick="switchTab(3)">● UNIDADES</div>
    </div>
    <div id="tab-0" class="tab-content active"><p id="info-desc"></p></div>
    <div id="tab-1" class="tab-content"><div class="stat-grid" id="info-stats"></div></div>
    <div id="tab-2" class="tab-content">
      <div class="stat-grid" id="info-forces"></div>
      <div style="margin-top:12px">
        <span style="font-family:Orbitron;font-size:10px;color:#ffd700;">NIVEL DE AMENAZA</span>
        <div class="bar"><div id="threat-bar" class="bar-fill green" style="width:60%"></div></div>
      </div>
    </div>
    <div id="tab-3" class="tab-content">
      <div class="unit-img" id="unit-img"></div>
      <div id="info-units"></div>
    </div>
    <button class="btn" onclick="closePanel()">CERRAR TRANSMISIÓN</button>
  </div>
</div>
<div id="side-menu">
  <div id="menu-toggle" onclick="toggleMenu()"><span></span></div>
  <div id="menu-panel">
    <div class="menu-header">PANEL DE OPERACIONES QP</div>
    <div class="menu-body">
      <div class="menu-section" id="sec-legiones">
        <div class="menu-section-title" onclick="toggleSection('sec-legiones')"><span>LEGIONES</span><span>▶</span></div>
        <div class="menu-section-content"><div class="menu-placeholder">Datos de legiones pendientes.</div></div>
      </div>
      <div class="menu-section" id="sec-flota">
        <div class="menu-section-title" onclick="toggleSection('sec-flota')"><span>FLOTA REPUBLICANA</span><span>▶</span></div>
        <div class="menu-section-content"><div class="menu-placeholder">Inventario de flota pendiente.</div></div>
      </div>
      <div class="menu-section" id="sec-suministros">
        <div class="menu-section-title" onclick="toggleSection('sec-suministros')"><span>SUMINISTROS</span><span>▶</span></div>
        <div class="menu-section-content"><div class="menu-placeholder">Logística pendiente.</div></div>
      </div>
    </div>
  </div>
</div><script>
let AC=null;function iA(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}
function cyberBip(f1,f2,d,v,t='sine'){try{iA();let o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f1;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(v,AC.currentTime+0.04);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function sP(){cyberBip(600,1200,0.5,0.12);cyberBip(1400,2400,0.35,0.06,'triangle')}
function sT(){cyberBip(900,1350,0.22,0.09)} function sC(){cyberBip(700,180,0.55,0.14,'triangle')} function sH(){cyberBip(2200,2600,0.12,0.025)}
document.addEventListener('click',iA,{once:true});document.addEventListener('touchstart',iA,{once:true});

const planets=[
{id:"coruscant",name:"CORUSCANT",x:50,y:50,color:"#4da6ff",img:"./Coruscant_QP.png",imgDetail:"./CORUSCANT_CITY_QP.png",unitImg:"./SH_TROOPS_QP.png",status:"republic",statusText:"CAPITAL REPUBLICA",sector:"Núcleo Interior",desc:"Ecumenópolis de 5,127 niveles. Templo Jedi con 10,000 Jedi activos.",stats:{poblacion:"1 Trillón",clima:"Urbano Total",recursos:"Político / Jedi",afiliacion:"República"},forces:{guarnicion:"Jedi + 8,200 Shock",flota:"Flota Núcleo",amenaza:15},units:[{name:"Alto Consejo",count:"12 Maestros",pct:100,color:"blue"}]},
{id:"pulsar",name:"PULSAR",x:93,y:50,color:"#00ffcc",img:"./Pulsar_QP.png",imgDetail:"./Pulsar_QP.png",unitImg:"./Pulsar_QP.png",status:"alpha",statusText:"BASTIÓN ALPHA [CLASIFICADO]",sector:"Borde Exterior - Black Level",desc:"Luna fortificada, cuartel secreto QP. Solo ALPHA.",stats:{poblacion:"45k ALPHA",clima:"Templado",recursos:"Tech QP",afiliacion:"Quantum Pulse"},forces:{guarnicion:"3,200 Operadores",flota:"Flota Sombra",amenaza:95},units:[{name:"Operadores Sombra",count:"3,200",pct:98,color:"green"}],main:true},
{id:"kamino",name:"KAMINO",x:18,y:14,color:"#8ecfff",img:"./Kamino_QP.png",imgDetail:"./IKamino_QP_main.png",unitImg:"./Kamino_troops.png",status:"republic",statusText:"CENTRO DE CLONACION",sector:"Extragaláctico",desc:"Mundo oceánico, Tipoca City produce 10k clones/día.",stats:{poblacion:"1M Kaminoanos",clima:"Oceánico",recursos:"Clonación",afiliacion:"República"},forces:{guarnicion:"Clonadores + Seguridad",flota:"Defensa Kamino",amenaza:30},units:[{name:"Defensa Tipoca",count:"5k Clones",pct:90,color:"blue"}]},
{id:"umbara",name:"UMBARA",x:22,y:38,color:"#aa44ff",img:"./Umbara_QP.png",imgDetail:"./Umbara_QP.png",unitImg:"./Umbara_QP.png",status:"contested",statusText:"EN DISPUTA",sector:"Borde Medio",desc:"Mundo oscuro, batalla del 501st.",stats:{poblacion:"500k",clima:"Sombrío",recursos:"Doonium",afiliacion:"Disputa"},forces:{guarnicion:"501st + Umbaranos",flota:"Bloqueo",amenaza:75},units:[{name:"501st",count:"10k",pct:92,color:"blue"}]},
{id:"anaxes",name:"ANAXES",x:22,y:62,color:"#ffcc00",img:"./Anaxes_QP.png",imgDetail:"./Anaxes_QP.png",unitImg:"./Anaxes_QP.png",status:"republic",statusText:"ASTILLERO REPUBLICA",sector:"Borde Interior",desc:"Astillero y fortaleza.",stats:{poblacion:"800k",clima:"Templado",recursos:"Naves",afiliacion:"República"},forces:{guarnicion:"Flota Anaxes",flota:"Venators",amenaza:40},units:[{name:"Flota Anaxes",count:"12 Venator",pct:88,color:"blue"}]},
{id:"hoth",name:"HOTH",x:78,y:28,color:"#aaffff",img:"./Hoth_QP.png",imgDetail:"./Hoth_QP.png",unitImg:"./Hoth_QP.png",status:"civil",statusText:"BALIZA CLON",sector:"Anoat",desc:"-60°C, Wampa y Tauntaun.",stats:{poblacion:"20 Clones",clima:"Tundra",recursos:"Hielo",afiliacion:"Deshabitado"},forces:{guarnicion:"20 Técnicos",flota:"N/A",amenaza:70},units:[{name:"Fauna Wampa",count:"Depredadores",pct:90,color:"green"}]},
{id:"geonosis",name:"GEONOSIS",x:68,y:62,color:"#ff8844",img:"./Geonosis_QP.png",imgDetail:"./Geonosis_QP.png",unitImg:"./Geonosis_QP.png",status:"separatist",statusText:"FABRICA DROIDE",sector:"Arkanis",desc:"Fábricas Separatistas.",stats:{poblacion:"100M Geonosianos",clima:"Desértico",recursos:"Droides",afiliacion:"Separatista"},forces:{guarnicion:"500k Droides",flota:"Lucrehulk",amenaza:85},units:[{name:"Droides",count:"500k",pct:90,color:"red"}]},
{id:"mustafar",name:"MUSTAFAR",x:88,y:82,color:"#ff2244",img:"./Mustafar_QP.png",imgDetail:"./Mustafar_QP.png",unitImg:"./Mustafar_QP.png",status:"separatist",statusText:"FORJA SEPARATISTA",sector:"Atravis",desc:"Lava y forjas.",stats:{poblacion:"20k",clima:"Volcánico",recursos:"Minerales",afiliacion:"Separatista"},forces:{guarnicion:"Droides Guardia",flota:"N/A",amenaza:80},units:[{name:"Guardia Mustafar",count:"10k Droides",pct:85,color:"red"}]},
{id:"ryloth",name:"RYLOTH",x:62,y:68,color:"#cc88ff",img:"./Ryloth_QP.png",imgDetail:"./Ryloth_QP.png",unitImg:"./Ryloth_QP.png",status:"contested",statusText:"EN DISPUTA 212th",sector:"Gaulus",desc:"Twi'lek, 212th y Resistencia Cham.",stats:{poblacion:"1.5M Twi'lek",clima:"Árido",recursos:"Doonium",afiliacion:"212th"},forces:{guarnicion:"10k 212th + 100k Droides",flota:"Venator",amenaza:85},units:[{name:"212th",count:"10k Ghost",pct:92,color:"gold"}]},
{id:"christophsis",name:"CHRISTOPHSIS",x:46,y:46,color:"#55aaff",img:"./Christophsis_QP.png",imgDetail:"./Christophsis_QP.png",unitImg:"./Christophsis_QP.png",status:"contested",statusText:"501st / 212th",sector:"Savareen",desc:"Cristales, primera batalla con Ahsoka.",stats:{poblacion:"300k",clima:"Cristalino",recursos:"Kyber",afiliacion:"212th+501st"},forces:{guarnicion:"15k Clones + 200k Droides",flota:"12 Venator",amenaza:80},units:[{name:"501st",count:"7,500 Torrent",pct:94,color:"blue"}]}
];

const galaxy=document.getElementById('galaxy'); const routes=document.getElementById('routes');
function drawRoutes(){
  routes.innerHTML='';
  const con=[["coruscant","christophsis"],["christophsis","anaxes"],["anaxes","umbara"],["umbara","coruscant"],["coruscant","pulsar"],["pulsar","geonosis"],["geonosis","mustafar"],["geonosis","ryloth"],["ryloth","anaxes"],["hoth","geonosis"],["kamino","umbara"]];
  con.forEach(([a,b])=>{
    let pa=planets.find(p=>p.id===a),pb=planets.find(p=>p.id===b); if(!pa||!pb)return;
    let l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",pa.x+"%");l.setAttribute("y1",pa.y+"%");l.setAttribute("x2",pb.x+"%");l.setAttribute("y2",pb.y+"%");
    l.setAttribute("class","neutral"); routes.appendChild(l);
  });
}
function renderPlanets(){
  planets.forEach(p=>{
    let d=document.createElement('div');d.className='planet'+(p.main?' main':'');d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.backgroundColor=p.color;if(p.img)d.style.backgroundImage=`url(${p.img})`;d.style.color=p.color;
    let lab=document.createElement('div');lab.className='planet-label';lab.textContent=p.name;lab.style.color=p.color; d.appendChild(lab);
    d.addEventListener('mouseenter',sH); d.addEventListener('click',()=>openPlanet(p.id));
    galaxy.appendChild(d);
  });
}
let cur=null;
function openPlanet(id){
  sP(); let p=planets.find(x=>x.id===id); if(!p)return;
  cur=p; document.querySelectorAll('.planet').forEach((el,i)=>{el.classList.toggle('selected',planets[i].id===id)});
  document.getElementById('info-panel').style.display='block';
  document.getElementById('info-name').textContent=p.name;
  document.getElementById('info-sector').textContent=p.sector;
  document.getElementById('info-desc').textContent=p.desc;
  document.getElementById('info-img').style.backgroundImage=`url(${p.imgDetail||p.img})`;
  document.getElementById('unit-img').style.backgroundImage=`url(${p.unitImg||p.img})`;
  let st=document.getElementById('info-status'); st.textContent=p.statusText; st.className='status status-tag '+p.status;
  document.getElementById('info-stats').innerHTML=`<div class="stat"><span>POBLACION</span><b>${p.stats.poblacion}</b></div><div class="stat"><span>CLIMA</span><b>${p.stats.clima}</b></div><div class="stat"><span>RECURSOS</span><b>${p.stats.recursos}</b></div><div class="stat"><span>AFILIACION</span><b>${p.stats.afiliacion}</b></div>`;
  document.getElementById('info-forces').innerHTML=`<div class="stat"><span>GUARNICION</span><b>${p.forces.guarnicion}</b></div><div class="stat"><span>FLOTA</span><b>${p.forces.flota}</b></div>`;
  let bar=document.getElementById('threat-bar'); bar.style.width=p.forces.amenaza+'%'; bar.className='bar-fill '+(p.forces.amenaza>70?'red':p.forces.amenaza>40?'yellow':'green');
  document.getElementById('info-units').innerHTML=p.units.map(u=>`<div class="unit-row"><div class="unit-head"><span>${u.name}</span><span>${u.count}</span></div><div class="bar"><div class="bar-fill ${u.color==='blue'?'green':u.color==='red'?'red':'yellow'}" style="width:${u.pct}%"></div></div></div>`).join('');
  switchTab(0);
}
function closePanel(){sC();document.getElementById('info-panel').style.display='none';document.querySelectorAll('.planet').forEach(e=>e.classList.remove('selected'))}
function switchTab(i){sT();document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.tab-content').forEach((c,idx)=>c.classList.toggle('active',idx===i))}
function toggleMenu(){document.getElementById('menu-toggle').classList.toggle('open');document.getElementById('menu-panel').classList.toggle('open')}
function toggleSection(id){document.getElementById(id).classList.toggle('open')}
drawRoutes();renderPlanets();
</script>
</body>
</html>
