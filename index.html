<style>
:root{--green:#00ff88;--green-dim:rgba(0,255,136,0.18);--blue:#00d4ff;--red:#ff2a4a;--yellow:#ffcc00;--violet:#a855f7;--orange:#ff7a00}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff;overscroll-behavior:none;user-select:none}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;background:#000;cursor:grab;touch-action:none}
#viewport.grabbing{cursor:grabbing}
#world{width:3000px;height:2000px;background:url('./fondo.jpg') center/cover no-repeat, radial-gradient(ellipse at center,#0a1a14 0%,#000 80%);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(0,0) scale(1);transform-origin:center center;will-change:transform}
svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg#routes line{stroke-width:2.6px;stroke-linecap:round;opacity:0.85;filter:none}
.route-rep{stroke:var(--blue)}.route-cis{stroke:var(--red)}.route-neutral{stroke:var(--yellow)}.route-mandalore{stroke:var(--violet)}.route-hutt{stroke:var(--orange)}
.planet{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:5;transition:transform.18s ease, filter.18s ease}
.planet-core{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#111;position:relative;border:1.6px solid var(--green);box-shadow:0 0 14px rgba(0,255,136,0.6), 0 0 0 1px rgba(0,255,136,0.3)}
.planet-core img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.planet-aura{position:absolute;inset:-5px;border-radius:50%;opacity:.5;filter:blur(8px);z-index:-1}
.planet:hover{transform:translate(-50%,-50%) scale(1.38);filter:brightness(1.25)}
.planet-label{position:absolute;top:124%;left:50%;transform:translateX(-50%);font-family:'Orbitron';font-size:9.5px;font-weight:800;color:var(--green)!important;text-shadow:0 0 8px var(--green);letter-spacing:1.2px;white-space:nowrap;background:rgba(0,0,0,0.85);border:1px solid var(--green-dim);padding:2px 8px;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#title-box{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;border:1px solid var(--green);background:rgba(0,20,10,0.96);padding:10px 28px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 22px rgba(0,255,136,0.4)}
#title-box h1{font-family:'Orbitron';font-size:18px;letter-spacing:4px;color:var(--green);text-shadow:0 0 12px var(--green)}
#controls{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;gap:7px;flex-wrap:wrap;max-width:300px}
.ctrl-btn{height:42px;min-width:42px;padding:0 14px;background:rgba(0,20,12,0.92);border:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-weight:800;font-size:11px;cursor:pointer}
.ctrl-btn:hover{background:var(--green);color:#000}
#overlay{position:fixed;inset:0;background:rgba(0,12,6,0.84);z-index:30;display:none}
#planet-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:94vw;max-width:640px;max-height:92vh;background:#0a1c12;border:1px solid var(--green);box-shadow:0 0 45px rgba(0,255,136,0.4);display:none;overflow:hidden;overflow-y:auto}
#planet-modal::-webkit-scrollbar{width:6px}#planet-modal::-webkit-scrollbar-thumb{background:var(--green)}
.modal-banner{height:195px;position:relative;background-size:cover;background-position:center;border-bottom:1px solid var(--green)}
.modal-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg, rgba(10,28,18,1) 14%, transparent 72%)}
.banner-info{position:absolute;left:16px;bottom:12px;z-index:2}
.banner-info h2{font-family:'Orbitron';font-size:24px;letter-spacing:3px;color:var(--green);text-shadow:0 0 12px var(--green)}
.banner-meta{font-size:11px;color:var(--green);font-family:'Orbitron'}
.modal-tabs{display:flex;border-bottom:1px solid var(--green-dim);background:rgba(0,0,0,0.5)}
.tab{flex:1;padding:13px 6px;text-align:center;font-family:'Orbitron';font-size:10px;cursor:pointer;background:rgba(0,255,136,.06);color:var(--green);border-right:1px solid var(--green-dim)}
.tab.active{background:var(--green);color:#000;font-weight:800}
.tab-content{display:none}.tab-content.active{display:block}
.content-img{width:100%;height:195px;background-size:cover;background-position:center;border-bottom:1px solid var(--green-dim);position:relative;overflow:hidden;background-color:#000}
.content-img::after{content:'';position:absolute;inset:0;pointer-events:none}
.content-img.glitch-red::after{background:rgba(180,0,20,0.38);mix-blend-mode:multiply;box-shadow:inset 0 0 40px rgba(255,0,0,0.5)}
.content-img.glitch-red::before{content:'';position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(0deg, transparent 0px, rgba(255,20,20,0.18) 1px, transparent 2px, transparent 5px);animation:glitchScan.12s steps(2) infinite;pointer-events:none}
.content-img.glitch-snow::after{background:linear-gradient(180deg, rgba(180,230,255,0.18), rgba(255,255,255,0.12));mix-blend-mode:screen}
.content-img.glitch-snow::before{content:'';position:absolute;inset:-20%;z-index:1;background-image:radial-gradient(white 1.2px, transparent 1.2px), radial-gradient(#aeeaff 1px, transparent 1px);background-size:18px 18px, 26px 26px;background-position:0 0, 10px 15px;opacity:.35;animation:snowDrift 0.9s linear infinite;pointer-events:none}
@keyframes glitchScan{0%{transform:translateY(0)}100%{transform:translateY(6px)}}
@keyframes snowDrift{0%{transform:translateY(-20px) translateX(0)}100%{transform:translateY(20px) translateX(8px)}}
.content-body{padding:16px;font-size:14px;line-height:1.6;color:#c8ffd8;min-height:80px;white-space:pre-wrap}
.close-btn{width:100%;padding:13px;background:rgba(0,255,136,.12);border:0;border-top:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-size:12px;letter-spacing:4px;font-weight:900;cursor:pointer}
.close-btn:hover{background:var(--green);color:#000}
.badge{display:inline-block;padding:3px 8px;border:1px solid var(--green);color:var(--green);background:rgba(0,255,136,0.15);font-family:'Orbitron';font-size:9px;margin-bottom:10px}
</style>
</head>

let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)() }
function playSFX(type){
  try{
    initAudio();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    const f=audioCtx.createBiquadFilter();
    o.connect(f); f.connect(g); g.connect(audioCtx.destination);
    f.type='bandpass'; f.frequency.value=1800;
    const now=audioCtx.currentTime;
    if(type==='click'){ // botones + / - / RESET / flechas
      o.frequency.setValueAtTime(800,now);
      o.frequency.exponentialRampToValueAtTime(1600,now+0.08);
      g.gain.setValueAtTime(0.18,now);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      o.start(now); o.stop(now+0.12);
    } else if(type==='open'){ // abrir planeta
      o.frequency.setValueAtTime(200,now);
      o.frequency.linearRampToValueAtTime(1200,now+0.18);
      o.frequency.linearRampToValueAtTime(600,now+0.28);
      g.gain.setValueAtTime(0.22,now);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
      o.start(now); o.stop(now+0.3);
    } else if(type==='tab'){ // cambiar pestaña
      o.frequency.setValueAtTime(1200,now);
      o.frequency.exponentialRampToValueAtTime(2200,now+0.06);
      g.gain.setValueAtTime(0.12,now);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.08);
      o.start(now); o.stop(now+0.08);
    } else if(type==='close'){ // cerrar
      o.frequency.setValueAtTime(1000,now);
      o.frequency.exponentialRampToValueAtTime(200,now+0.15);
      g.gain.setValueAtTime(0.18,now);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.16);
      o.start(now); o.stop(now+0.16);
    }
  }catch(e){}
}

let routes=[["pulsar","coruscant"],["coruscant","alderaan"],["coruscant","anaxes"],["coruscant","naboo"],["coruscant","moncala"],["coruscant","christophsis"],["alderaan","mandalore"],["mandalore","mygeeto"],["mygeeto","muunilinst"],["muunilinst","christophsis"],["christophsis","utapau"],["anaxes","hoth"],["hoth","mandalore"],["kashyyyk","felucia"],["felucia","dathomir"],["dathomir","geonosis"],["geonosis","naboo"],["naboo","kashyyyk"],["naboo","tatooine"],["tatooine","mustafar"],["mustafar","rishi"],["mustafar","kamino"],["utapau","rishi"],["utapau","tatooine"],["tatooine","geonosis"],["moncala","kashyyyk"],["moncala","naboo"]];
let scale=1,tx=0,ty=0,isDragging=false,startX=0,startY=0,lastX=0,lastY=0,velX=0,velY=0,lastDist=0;
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),svg=document.getElementById('routes');
function getRouteType(a,b){if(a==="pulsar"||b==="pulsar")return "rep";if(a==="mandalore"||b==="mandalore")return "mandalore";if(a==="tatooine"||b==="tatooine")return "hutt";const A=planets.find(p=>p.id===a),B=planets.find(p=>p.id===b);if(!A||!B)return "neutral";if(A.faction==="rep"&&B.faction==="rep")return "rep";if(A.faction==="cis"&&B.faction==="cis")return "cis";return "neutral"}
function render(){svg.innerHTML="";routes.forEach(r=>{const pA=planets.find(p=>p.id===r[0]),pB=planets.find(p=>p.id===r[1]);if(!pA||!pB)return;const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",pA.x);line.setAttribute("y1",pA.y);line.setAttribute("x2",pB.x);line.setAttribute("y2",pB.y);line.setAttribute("class","route-"+getRouteType(r[0],r[1]));svg.appendChild(line)});world.querySelectorAll('.planet').forEach(e=>e.remove());planets.forEach(p=>{const el=document.createElement('div');el.className='planet';el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.width=p.size+'px';el.style.height=p.size+'px';el.style.color=p.color;el.innerHTML=`<div class='planet-aura' style='background:${p.color}'></div><div class='planet-core'><img src="${p.imgPlanet}" loading="lazy" onerror="this.style.display='none'"></div><div class='planet-label'>${p.name}</div>`;el.onclick=e=>{e.stopPropagation();playSFX('open');openPlanet(p)};world.appendChild(el)})}
function openPlanet(p){document.getElementById('overlay').style.display='block';document.getElementById('planet-modal').style.display='block';const b=document.getElementById('banner');b.style.backgroundImage=`url(${p.imgPlanet})`;document.getElementById('b-name').innerText=p.name;document.getElementById('b-meta').innerText=`X:${p.x} Y:${p.y} // ${p.faction.toUpperCase()}`;setTabImg('img-lore',p.imgPlanet,'');setTabImg('img-benef',p.imgMain,p.id);setTabImg('img-troops',p.imgTroops,'');document.getElementById('text-lore').innerHTML=`<span class='badge'>LORE</span><br>${p.lore}`;document.getElementById('text-benef').innerHTML=`<span class='badge'>BENEFICIO</span><br>${p.benef}`;document.getElementById('text-troops').innerHTML=`<span class='badge'>TROPAS</span><br>${p.troops}`;switchTab('lore',true)}
function setTabImg(id,url,planetId){const el=document.getElementById(id);el.style.backgroundImage=`url(${url})`;el.className='content-img';if(planetId==='geonosis'||planetId==='mustafar')el.classList.add('glitch-red');else if(planetId==='hoth'&&id==='img-benef')el.classList.add('glitch-snow')}
function switchTab(t, silent){ if(!silent) playSFX('tab'); document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector(`[data-t="${t}"]`).classList.add('active');document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active')}
function closeModal(){ playSFX('close'); document.getElementById('overlay').style.display='none';document.getElementById('planet-modal').style.display='none'}
function applyTransform(){world.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`}
function zoom(d){ playSFX('click'); scale=Math.min(3.8,Math.max(0.28,scale+d));applyTransform()}
function resetView(){ playSFX('click'); scale=1;tx=0;ty=0;applyTransform()}
function moveMap(dx,dy){ playSFX('click'); tx+=dx;ty+=dy;applyTransform()}
viewport.addEventListener('mousedown',e=>{initAudio();isDragging=true;viewport.classList.add('grabbing');startX=e.clientX-tx;startY=e.clientY-ty;lastX=e.clientX;lastY=e.clientY;velX=0;velY=0});
window.addEventListener('mousemove',e=>{if(!isDragging)return;tx=e.clientX-startX;ty=e.clientY-startY;velX=e.clientX-lastX;velY=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform()});
window.addEventListener('mouseup',()=>{if(!isDragging)return;isDragging=false;viewport.classList.remove('grabbing');let f=0.92;function inertia(){if(Math.abs(velX)<0.12&&Math.abs(velY)<0.12)return;tx+=velX;ty+=velY;velX*=f;velY*=f;applyTransform();requestAnimationFrame(inertia)}inertia()});
viewport.addEventListener('touchstart',e=>{initAudio();if(e.touches.length===1){const t=e.touches[0];isDragging=true;startX=t.clientX-tx;startY=t.clientY-ty;lastX=t.clientX;lastY=t.clientY}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;lastDist=Math.hypot(dx,dy)}},{passive:false});
viewport.addEventListener('touchmove',e=>{if(e.touches.length===1&&isDragging){e.preventDefault();const t=e.touches[0];tx=t.clientX-startX;ty=t.clientY-startY;velX=t.clientX-lastX;velY=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;applyTransform()}else if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.hypot(dx,dy);if(lastDist>0){const delta=(dist-lastDist)*0.008;scale=Math.min(3.8,Math.max(0.28,scale+delta));applyTransform()}lastDist=dist}},{passive:false});
viewport.addEventListener('touchend',()=>{isDragging=false;lastDist=0});
viewport.addEventListener('wheel',e=>{e.preventDefault();initAudio();zoom(e.deltaY>0?-0.12:0.12)},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')moveMap(120,0);if(e.key==='ArrowRight'||e.key==='d')moveMap(-120,0);if(e.key==='ArrowUp'||e.key==='w')moveMap(0,120);if(e.key==='ArrowDown'||e.key==='s')moveMap(0,-120);if(e.key==='+'||e.key==='=')zoom(0.14);if(e.key==='-')zoom(-0.14);if(e.key==='Escape')closeModal()});
render();applyTransform();
</script>
