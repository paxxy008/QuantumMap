<script>
let audioCtx, masterGain;
function initAudio(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); masterGain = audioCtx.createGain(); masterGain.gain.value = 0.22; masterGain.connect(audioCtx.destination); } }
function sciTone(freq,type,dur,vol,opts={}){ try{initAudio(); const now=audioCtx.currentTime; const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter(); filter.type=opts.filterType||'lowpass'; filter.frequency.value=opts.filterFreq||3500; osc.type=type; osc.frequency.value=freq; gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(vol,now+0.01); gain.gain.exponentialRampToValueAtTime(0.001,now+dur); osc.connect(filter); filter.connect(gain); gain.connect(masterGain); osc.start(now); osc.stop(now+dur+0.2); if(opts.secondFreq){ const osc2=audioCtx.createOscillator(),gain2=audioCtx.createGain(); osc2.type=opts.secondType||'sine'; osc2.frequency.value=opts.secondFreq; gain2.gain.setValueAtTime(0,now); gain2.gain.linearRampToValueAtTime(vol*0.6,now+0.02); gain2.gain.exponentialRampToValueAtTime(0.001,now+dur*1.2); osc2.connect(gain2); gain2.connect(masterGain); osc2.start(now+0.04); osc2.stop(now+dur*1.2+0.2); } }catch(e){} }
function sHover(){ sciTone(1200,'sine',0.18,0.12,{filterFreq:4500}); }
function sClick(){ sciTone(90,'sawtooth',0.35,0.28,{filterFreq:800,secondFreq:880,secondType:'sine'}); setTimeout(()=>sciTone(1800,'triangle',0.22,0.09,{filterFreq:6000}),80); }
function sOpen(){ sciTone(60,'sine',0.6,0.32,{filterFreq:300,secondFreq:440,secondType:'triangle'}); setTimeout(()=>sciTone(700,'sine',0.5,0.16,{filterFreq:4000}),140); }
function sClose(){ sciTone(700,'sine',0.25,0.14,{filterFreq:2500}); setTimeout(()=>sciTone(55,'triangle',0.65,0.26,{filterFreq:400}),120); }
function sWar(){ sciTone(45,'square',0.8,0.35,{filterFreq:250,secondFreq:120,secondType:'sawtooth'}); }
function sGlitch(){ sciTone(2100,'square',0.09,0.16,{filterFreq:8000}); setTimeout(()=>sciTone(38,'sawtooth',0.4,0.3,{filterFreq:180}),40); }

function drawRoutes(){
  const svg=document.getElementById('routes'); if(!svg) return;
  svg.innerHTML=''; svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('preserveAspectRatio','none');
  const groups={Amigable:[],Hostil:[],Neutral:[]};
  planets.forEach(p=>{ groups[p.status]?.push(p); });
  Object.keys(groups).forEach(status=>{
    const list=groups[status]; if(list.length<2) return;
    const sorted=[...list].sort((a,b)=>a.x-b.x);
    for(let i=0;i<sorted.length-1;i++){
      const a=sorted[i], b=sorted[i+1]; const dist=Math.hypot(a.x-b.x,a.y-b.y); if(dist>38) continue;
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',a.x); line.setAttribute('y1',a.y); line.setAttribute('x2',b.x); line.setAttribute('y2',b.y);
      line.setAttribute('class','route-line '+status.toLowerCase()); svg.appendChild(line);
    }
  });
}
let currentPlanet=null,currentTab='lore',devClicks=0,warBalance=0;
</script>
<script>
// AYUDA: AHORA USA IMAGEN REAL DEL PLANETA EN VEZ DE CIRCULO
function renderMap(){
  const map=document.getElementById('map');
  [...map.children].forEach(el=>{ if(el.id!=='routes') el.remove(); });
  drawRoutes();
  planets.forEach(p=>{
    const icon=document.createElement('div');
    icon.className='planet-icon '+p.status.toLowerCase()+(p.glitch?' glitch':'');
    icon.style.left=p.x+'%'; icon.style.top=p.y+'%';
    icon.title=p.id+' - '+p.status;

    const aura=document.createElement('div');
    aura.className='aura';
    icon.appendChild(aura);

    const img=document.createElement('img');
    img.src = p.imgPlanet;
    img.alt = p.id;
    img.onerror = function(){
      // si no tiene planeta, usa detail, si no troops
      if(this.src!==p.imgDetail && this.src!==p.imgTroops){
        this.src = p.imgDetail;
        this.onerror = function(){ this.src = p.imgTroops || "./SH_TROOPS_QP.png"; this.onerror=null; };
      }
    };
    icon.appendChild(img);

    icon.addEventListener('mouseenter', ()=>{ p.glitch? sGlitch() : sHover(); });
    icon.addEventListener('click', (e)=>{ e.stopPropagation(); sClick(); if(p.glitch) sGlitch(); showPlanet(p.id); });

    const label=document.createElement('div');
    label.className='planet-label';
    label.style.left=p.x+'%'; label.style.top='calc('+p.y+'% + 32px)';
    label.style.color = p.status==='Hostil'? '#ff6b7a' : p.status==='Amigable'? '#00ff88' : '#ffb84d';
    label.innerText=p.id.toUpperCase();

    map.appendChild(icon);
    map.appendChild(label);
  });
}
</script>
<script>
function showPlanet(id){
  const p=planets.find(x=>x.id===id); if(!p) return;
  currentPlanet=p;
  const img=document.getElementById('detailImg');
  const wrap=document.getElementById('detailImgWrap');
  img.src = p.imgPlanet;
  img.onerror = function(){
    if(this.src!==p.imgDetail && this.src!==p.imgTroops){
      this.src = p.imgDetail;
      this.onerror = function(){ this.src = p.imgTroops || "./SH_TROOPS_QP.png"; this.onerror=null; };
    }
  };
  wrap.className='detail-img' + (p.glitch?' glitch':'');
  document.getElementById('detailName').innerText=p.id.toUpperCase();
  document.getElementById('detailMeta').innerText=p.sector+' // '+p.clima+' // '+p.status.toUpperCase();
  switchTab('lore');
  const detail=document.getElementById('detail'); detail.classList.add('open'); detail.style.pointerEvents='all';
  sOpen(); if(p.glitch) setTimeout(sGlitch,200);
}
function closeDetail(){
  const detail=document.getElementById('detail'); detail.classList.remove('open'); sClose();
  setTimeout(()=>{ if(!detail.classList.contains('open')) detail.style.pointerEvents='none'; },550);
}
function switchTab(type){
  if(!currentPlanet) return;
  currentTab=type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${type}"]`)?.classList.add('active');
  const p=currentPlanet, c=document.getElementById('detailContent');
  const col = p.status==='Hostil'?'#ff3344':p.status==='Amigable'?'#00ff88':'#ff9900';
  const badge='<div class="status-badge '+p.status.toLowerCase()+'" style="border-color:'+col+';color:'+col+'">RUTA: '+p.status.toUpperCase()+' - '+p.faction+'</div>';
  if(type==='lore') c.innerHTML = badge+
    '<div style="width:100%;height:185px;border-radius:10px;overflow:hidden;margin-bottom:12px;border:1px solid '+col+'66"><img src="'+p.imgDetail+'" onerror="this.src=\''+p.imgPlanet+'\'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '<div style="font-weight:700;line-height:1.75"><span style="color:var(--neon);font-family:Orbitron;font-size:10px;letter-spacing:2px">LORE EXPANDIDO // 22 ABY:</span><br><br>'+p.lore+'<br><br><span style="color:var(--neon)">CLIMA:</span> '+p.clima+'<br><span style="color:var(--neon)">FACCIÓN:</span> '+p.faction+'</div>';
  if(type==='datos') c.innerHTML = badge+
    '<div style="width:100%;height:185px;border-radius:10px;overflow:hidden;margin-bottom:12px;border:1px solid '+col+'66"><img src="'+p.imgDetail+'" onerror="this.src=\''+p.imgPlanet+'\'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '<div><span style="color:var(--neon);font-family:Orbitron">POBLACIÓN:</span><br>'+p.population+'<br><br><span style="color:var(--gold);font-family:Orbitron">BENEFICIO:</span><br>'+p.benefit+'<br><br><span style="color:var(--neon)">SECTOR:</span> '+p.sector+'<br><br>'+
    p.produccion.map(pr=>'<div style="display:flex;justify-content:space-between;font-size:11px;margin:12px 0 5px 0;font-family:Orbitron;font-weight:900"><span>'+pr.label+'</span><span style="color:'+pr.color+'">'+pr.value+'</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden"><div style="width:'+pr.pct+'%;height:100%;background:'+pr.color+'"></div></div>').join('')+'</div>';
  if(type==='fuerzas') c.innerHTML = badge+
    '<div style="width:100%;height:185px;border-radius:10px;overflow:hidden;margin-bottom:12px;border:1px solid '+col+'66"><img src="'+p.imgDetail+'" onerror="this.src=\''+p.imgPlanet+'\'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '<div><span style="color:var(--neon);font-family:Orbitron">FUERZAS:</span><br>'+p.forces+'<br><br><span style="color:var(--neon)">FAUNA:</span><br>'+p.fauna+'<br><br><span style="color:var(--neon)">CIVILES:</span><br>'+p.civil+'<br><br><span style="color:'+col+';font-family:Orbitron">ESTADO:</span> '+p.status+'</div>';
  if(type==='unidades') c.innerHTML = badge+
    '<div style="width:100%;height:185px;border-radius:10px;overflow:hidden;margin-bottom:12px;border:1px solid '+col+'66"><img src="'+p.imgDetail+'" onerror="this.src=\''+p.imgPlanet+'\'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '<div style="width:100%;height:240px;border:1px solid '+col+';border-radius:12px;overflow:hidden;box-shadow:0 0 18px '+col+'66"><img src="'+p.imgTroops+'" onerror="this.src=\'./SH_TROOPS_QP.png\'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '<div style="margin-top:14px">'+
    p.produccion.map(pr=>'<div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 0 5px 0;font-family:Orbitron;font-weight:900"><span>'+pr.label+'</span><span style="color:'+pr.color+'">'+pr.value+'</span></div><div style="width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden"><div style="width:'+pr.pct+'%;height:100%;background:'+pr.color+'"></div></div>').join('')+
    '<div style="margin-top:14px;padding:12px;border:1px dashed rgba(0,255,136,0.25);border-radius:10px;font-family:Share Tech Mono;font-size:10px;color:var(--neon)">UNIDAD: '+p.faction+'<br>TROPAS: '+p.troops+'<br>RUTA: '+p.status+'</div></div>';
  sHover();
}
</script>
<script>

function addSeparatist(v){ warBalance=Math.max(-100,warBalance-v); renderMap(); sWar(); }
function resetWar(){ warBalance=0; renderMap(); sClose(); }
document.getElementById('title').addEventListener('click', ()=>{
  devClicks++; sciTone(600+devClicks*70,'sine',0.12,0.08,{filterFreq:4000});
  if(devClicks>=5){ document.getElementById('devControls').classList.toggle('active'); devClicks=0; sOpen(); }

});
document.getElementById('closeBtn').addEventListener('click', (e)=>{ e.stopPropagation(); closeDetail(); });
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='d'){ document.getElementById('devControls').classList.toggle('active'); sClick(); }

});
document.getElementById('map').addEventListener('click', (e)=>{ if(e.target.id==='map' || e.target.id==='routes') closeDetail(); });
document.getElementById('detail').addEventListener('click', (e)=>{ e.stopPropagation(); });
