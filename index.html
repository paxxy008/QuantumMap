let audioCtx=null;
let audioEnabled=true;
let bgmOsc=null;
let bgmGain=null;

function initAudio(){
if(!audioCtx){
audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
}

function toggleAudio(){
initAudio();
audioEnabled=!audioEnabled;
document.getElementById('audio-controls').innerText=audioEnabled?'🔊 CYBER-AUDIO ON':'🔇 AUDIO OFF';
document.getElementById('title').innerText=audioEnabled?'QUANTUM PULSE // AUDIO CYBERPUNK [ON]':'QUANTUM PULSE // AUDIO OFF';
if(audioEnabled){
startBGM();
playBoot();
}else{
stopBGM();
}
}

function cyberTone(freq,type,vol,dur,glideTo=null,filterFreq=3000){
if(!audioEnabled||!audioCtx) return;
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();
const f=audioCtx.createBiquadFilter();
o.type=type;
o.frequency.value=freq;
f.type='lowpass';
f.frequency.value=filterFreq;
o.connect(f);
f.connect(g);
g.connect(audioCtx.destination);
const now=audioCtx.currentTime;
g.gain.setValueAtTime(0,now);
g.gain.linearRampToValueAtTime(vol,now+0.01);
if(glideTo){
o.frequency.linearRampToValueAtTime(glideTo,now+dur);
}
g.gain.exponentialRampToValueAtTime(0.001,now+dur);
o.start(now);
o.stop(now+dur);
}

// SONIDOS CYBERPUNK
function playHover(){
initAudio();
cyberTone(850,'sine',0.18,0.12,1350);

function playClick(){
initAudio();

}
function playClose(){
initAudio();
cyberTone(900,'sawtooth',0.18,0.22,80,800);
}
function playSubmenu(){
initAudio();
cyberTone(1250,'triangle',0.14,0.1,1850,4000);
}
function playHyperspace(){
initAudio();
cyberTone(110,'sawtooth',0.32,0.6,850,1000);
setTimeout(()=>cyberTone(1600,'sine',0.16,0.45),110);
}
function playBoot(){
initAudio();
[0,1,2,3].forEach(i=>{
setTimeout(()=>cyberTone(320+i*180,'sine',0.22,0.28),i*110);
});
}
function startBGM(){
if(!audioCtx||bgmOsc) return;
bgmOsc=audioCtx.createOscillator();
bgmGain=audioCtx.createGain();
const f=audioCtx.createBiquadFilter();
bgmOsc.type='sawtooth';
bgmOsc.frequency.value=54;
f.type='lowpass';
f.frequency.value=380;
f.Q.value=5;
bgmGain.gain.value=0.035;
bgmOsc.connect(f);
f.connect(bgmGain);
bgmGain.connect(audioCtx.destination);
bgmOsc.start();
}
function stopBGM(){
if(bgmOsc){
try{bgmOsc.stop();}catch(e){}
bgmOsc=null;
bgmGain=null;
}
}

div.addEventListener('mouseenter',()=>playHover());

});

});
}
function renderRoutes(){
const canvas=document.getElementById('routes');
const ctx=canvas.getContext('2d');
function resize(){
canvas.width=canvas.offsetWidth;
canvas.height=canvas.offsetHeight;
draw();
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
routes.forEach(r=>{
const a=planets.find(x=>x.id===r.from);
const b=planets.find(x=>x.id===r.to);
if(!a||!b) return;
const x1=a.x/100*canvas.width;
const y1=a.y/100*canvas.height;
const x2=b.x/100*canvas.width;
const y2=b.y/100*canvas.height;
ctx.beginPath();
ctx.strokeStyle=r.color||'#fff';
ctx.lineWidth=r.width||1.5;
ctx.globalAlpha=r.opacity||0.85;
ctx.shadowBlur=14;
ctx.shadowColor=r.color;
if(r.dash){
ctx.setLineDash([10,7]);
}else{
ctx.setLineDash([]);
}
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();
ctx.setLineDash([]);
ctx.globalAlpha=1;
ctx.shadowBlur=0;
});
}
window.addEventListener('resize',resize);
resize();
}

<div style="display:flex;gap:15px;flex-wrap:wrap;align-items:flex-start">
<img src="${p.imgDetail}" style="width:230px;height:135px;object-fit:cover;border:1px solid ${p.color};box-shadow:0 0 10px ${p.color}" onerror="this.style.display='none'">
<div style="flex:1;min-width:260px">
<h2 style="color:${p.color};margin:0 0 6px 0;font-size:16px;letter-spacing:1px">${p.name} // ${p.statusText}</h2>
<p style="font-size:12px;line-height:1.4;max-width:700px;margin:0 0 8px 0">${p.desc}</p>
<div style="margin:10px 0">
<button class="tabBtn" onclick="showTab('stats')">STATS</button>
<button class="tabBtn" onclick="showTab('forces')">FUERZAS</button>
<button class="tabBtn" onclick="showTab('units')">UNIDADES</button>
<button class="tabBtn" onclick="showTab('lore')">LORE</button>
</div>
<div id="tabContent" style="font-size:11px;line-height:1.5;background:rgba(0,255,136,0.05);border:1px solid rgba(0,255,136,0.2);padding:8px;min-height:60px"></div>
<div style="margin-top:12px;display:flex;gap:8px">
<button onclick="closeDetail()" style="background:#000;color:#ff4444;border:1px solid #ff4444;padding:6px 14px;cursor:pointer;font-size:11px">✕ CERRAR [ESC]</button>
</div>
</div>
<img src="${p.unitImg}" style="width:145px;height:145px;object-fit:cover;border:1px solid #333;box-shadow:0 0 10px rgba(0,255,136,0.3)" onerror="this.style.display='none'">
</div>`;
showTab('stats');
}
function showTab(tab){
playSubmenu();
const p=planets.find(x=>x.id===currentPlanetId);
if(!p) return;
const c=document.getElementById('tabContent');
if(tab==='stats'){
c.innerHTML=`<b style="color:#0f8">SECTOR:</b> ${p.sector}<br><b style="color:#0f8">POBLACIÓN:</b> ${p.stats.poblacion}<br><b style="color:#0f8">CLIMA:</b> ${p.stats.clima}<br><b style="color:#0f8">RECURSOS:</b> ${p.stats.recursos}<br><b style="color:#0f8">AFILIACIÓN:</b> ${p.stats.afiliacion}`;
}
if(tab==='forces'){
c.innerHTML=`<b style="color:#0f8">GUARNICIÓN:</b> ${p.forces.guarnicion}<br><b style="color:#0f8">FLOTA:</b> ${p.forces.flota}<br><b style="color:#0f8">AMENAZA:</b> <span style="color:${p.forces.amenaza>80?'#f44':'#0f8'}">${p.forces.amenaza}%</span>`;
}
if(tab==='units'){
c.innerHTML=p.units.map(u=>`<div style="margin:3px 0;color:${u.color}">● ${u.name} — ${u.count} [${u.pct}%]</div>`).join('');
}
if(tab==='lore'){
c.innerHTML=`<i style="color:#aaa">${p.desc}</i><br><br><b>Status:</b> ${p.statusText}`;
}
}
function closeDetail(){
playClose();
document.getElementById('detail').style.display='none';
currentPlanetId=null;
}
window.onload=()=>{
renderPlanets();
renderRoutes();
const unlock=()=>{
initAudio();
startBGM();
playBoot();
document.removeEventListener('click',unlock);
document.removeEventListener('touchstart',unlock);
document.getElementById('title').innerText='QUANTUM PULSE // AUDIO CYBERPUNK [ON]';
};
document.addEventListener('click',unlock);
document.addEventListener('touchstart',unlock);
setTimeout(()=>{
window.dispatchEvent(new Event('resize'));
},400);
};
document.addEventListener('keydown',(e)=>{
if(e.key==='Escape'){
closeDetail();
}
if(e.key==='m'||e.key==='M'){
toggleAudio();
}
});
</script>
</body>
</html>
