let audioCtx=null,master=null,audioEnabled=true;
function initAudio(){ if(audioCtx) return; audioCtx=new (window.AudioContext||window.webkitAudioContext)(); master=audioCtx.createGain(); master.gain.value=0.34; master.connect(audioCtx.destination); }
function heavy(f1,f2,t1,t2,v,d,g1,g2,flt){
if(!audioEnabled) return; if(!audioCtx) initAudio(); const n=audioCtx.currentTime;
const o1=audioCtx.createOscillator(),g1n=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
o1.type=t1; o1.frequency.value=f1; f.type='lowpass'; f.frequency.value=flt; f.Q.value=7;
o1.connect(f); f.connect(g1n); g1n.connect(master);
g1n.gain.setValueAtTime(0,n); g1n.gain.linearRampToValueAtTime(v,n+0.02); g1n.gain.exponentialRampToValueAtTime(0.001,n+d);
if(g1) o1.frequency.exponentialRampToValueAtTime(g1,n+d); o1.start(n); o1.stop(n+d);
const o2=audioCtx.createOscillator(),g2n=audioCtx.createGain();
o2.type=t2; o2.frequency.value=f2; o2.connect(g2n); g2n.connect(master);
g2n.gain.setValueAtTime(0,n); g2n.gain.linearRampToValueAtTime(v*0.55,n+0.015); g2n.gain.exponentialRampToValueAtTime(0.001,n+d*0.85);
if(g2) o2.frequency.linearRampToValueAtTime(g2,n+d); o2.start(n+0.02); o2.stop(n+d);
if(d>0.15){ const o3=audioCtx.createOscillator(),g3=audioCtx.createGain(); o3.type='square'; o3.frequency.value=f1*2.3; o3.connect(g3); g3.connect(master); g3.gain.setValueAtTime(v*0.38,n); g3.gain.exponentialRampToValueAtTime(0.001,n+0.09); o3.start(n); o3.stop(n+0.09); }
}

if(sepFill){ sepFill.style.width=separatistScore+'%'; }

function renderRoutes(){
const canvas=document.getElementById('routes'); const ctx=canvas.getContext('2d');
function resize(){ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; draw(); }

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.beginPath(); ctx.strokeStyle=r.color; ctx.lineWidth=r.width; ctx.globalAlpha=0.92; ctx.shadowBlur=18; ctx.shadowColor=r.color;
if(r.dash) ctx.setLineDash([12,8]); else ctx.setLineDash([]);
ctx.moveTo(a.x/100*canvas.width, a.y/100*canvas.height); ctx.lineTo(b.x/100*canvas.width, b.y/100*canvas.height);
ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur=0;
});
}
window.addEventListener('resize',resize); resize();
}
let cur=null;
function showDetail(p){
cur=p.id; playOpen();
const isCorrupt=(p.id==='geonosis'||p.id==='mustafar');
const d=document.getElementById('detail'); d.style.display='block';
d.innerHTML=`
<div class="detail-hero ${isCorrupt?'glitch-corrupt':''}">
<img src="${p.imgDetail}" onerror="this.src='${p.img}'">
<div class="hero-tag-top">${p.statusText}</div>
<div class="hero-tag-bottom">SECTOR: ${p.sector} | CLIMA: ${p.clima}</div>
${isCorrupt?'<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,40,40,0.94);color:#fff;padding:8px 16px;font-size:11px;font-weight:900;z-index:10;box-shadow:0 0 22px #f44;font-family:Orbitron">⚠ SEÑAL CORRUPTA<br>TRANSMISIÓN DAÑADA</div>':''}
</div>
<div class="detail-content">
<h2 class="detail-title" style="color:${p.color};text-shadow:0 0 20px ${p.color}">${p.name}</h2>
<div class="tabs">
<span class="tab active" onclick="showTab('lore',this)">• LORE</span>
<span class="tab" onclick="showTab('datos',this)">• DATOS</span>
<span class="tab" onclick="showTab('fuerzas',this)">• FUERZAS</span>
<span class="tab" onclick="showTab('unidades',this)">• UNIDADES</span>
</div>
<div id="tabContent"></div>
<button class="btn-close" onclick="closeDetail()">CERRAR TRANSMISIÓN</button>
</div>`;
showTab('lore',document.querySelector('.tab'));
}
function showTab(type,el){
if(el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
playSub();
const p=planets.find(x=>x.id===cur); const c=document.getElementById('tabContent'); if(!p) return;
if(type==='lore') c.innerHTML=`<div style="font-family:Rajdhani;font-weight:700;font-size:13px"><span style="color:#00ff88;font-family:Orbitron">LORE INICIO GUERRAS CLON:</span><br>${p.desc}<br><br><span style="color:#00ff88">CLIMA:</span> ${p.clima}<br><span style="color:#00ff88">FACCIÓN:</span> ${p.faction}</div>`;
if(type==='datos') c.innerHTML=`<div style="font-family:Rajdhani;font-weight:700"><span style="color:#00ff88;font-family:Orbitron">POBLACIÓN:</span> ${p.population}<br><br><span style="color:#ffd700;font-family:Orbitron">BENEFICIO:</span> ${p.benefit}<br><br><span style="color:#00ff88">SECTOR:</span> ${p.sector}<br><span style="color:#00ff88">CLIMA:</span> ${p.clima}<br><br><div style="background:rgba(255,255,255,0.06);padding:8px;border-radius:6px"><div style="display:flex;justify-content:space-between"><span>${p.productionType}</span><span style="color:${p.color}">${p.production}%</span></div><div style="width:100%;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;margin-top:4px"><div style="width:${p.production}%;height:100%;background:${p.color};box-shadow:0 0 10px ${p.color}"></div></div></div></div>`;
if(type==='fuerzas') c.innerHTML=`<div style="font-family:Rajdhani;font-weight:600"><span style="color:#00ff88;font-family:Orbitron">FUERZAS CLON:</span><br>${p.forces}<br><br><span style="color:#00ff88">FAUNA:</span> ${p.fauna}<br><span style="color:#00ff88">CIVILES:</span> ${p.civil}</div>`;
if(type==='unidades') c.innerHTML=`<img src="${p.imgDetail}" style="width:100%;height:130px;object-fit:cover;border:1px solid ${p.color};border-radius:8px;box-shadow:0 0 16px ${p.color}"><br><br><div style="font-family:Orbitron;font-size:10px;color:${p.color}">TROPAS REF: ${p.name} - ${p.productionType}</div><br><div style="font-family:Rajdhani;font-weight:600">${p.forces}</div>`;
}
function closeDetail(){ playClose(); document.getElementById('detail').style.display='none'; cur=null; }
 window.onload=()=>{
renderPlanets();
renderRoutes();
updateWarBars(); // Inicializa barras en 0% como pediste
// Desbloqueo audio al primer click
const unlock=()=>{ initAudio(); document.removeEventListener('click',unlock); document.removeEventListener('touchstart',unlock); };
document.addEventListener('click',unlock);
document.addEventListener('touchstart',unlock);
setTimeout(()=>window.dispatchEvent(new Event('resize')),500);
};
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeDetail(); });
