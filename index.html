<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM PULSE // HOLOMAPA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:'Rajdhani',sans-serif;color:#fff;overflow:hidden}
  #galaxy{width:100vw;height:100vh;background:url('./QUANTUM_MAP.png') center/cover no-repeat fixed;position:relative;overflow:hidden}
  #galaxy::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,0.1) 20%,rgba(0,0,0,0.78) 95%);z-index:1}
  .planet{position:absolute;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 0 22px currentColor,inset -7px -7px 14px rgba(0,0,0,0.95);transition:.35s;z-index:3;border:1.8px solid rgba(255,255,255,0.9);background-size:cover;background-position:center;background-color:#111}
  .planet:hover{transform:translate(-50%,-50%) scale(1.35);filter:brightness(1.3)}
  .planet.selected{transform:translate(-50%,-50%) scale(1.55);z-index:6;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
  .planet.main{box-shadow:0 0 35px #00ff88,0 0 70px #00ff88,0 0 110px rgba(0,255,136,0.6),inset -7px -7px 14px rgba(0,0,0,0.85);border:2.5px solid #00ffcc}
  .planet-label{position:absolute;top:135%;left:50%;transform:translateX(-50%);font-family:'Orbitron';font-size:10px;font-weight:800;letter-spacing:1.8px;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 12px currentColor;pointer-events:none}
  svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
  svg#routes line{stroke-width:2.5;stroke-dasharray:12 10;stroke-linecap:round;animation:dash 1s linear infinite;opacity:0.8}
  @keyframes dash{to{stroke-dashoffset:-44}}
  line.friendly{stroke:#00ffcc;filter:drop-shadow(0 0 7px #00ffcc)} line.hostile{stroke:#ff3355;filter:drop-shadow(0 0 7px #ff3355);stroke-dasharray:5 10} line.neutral{stroke:#ffd700;filter:drop-shadow(0 0 7px #ffd700)}
  #info-panel{position:absolute;right:22px;top:22px;width:420px;max-height:92vh;overflow-y:auto;background:linear-gradient(160deg,rgba(0,22,14,0.97),rgba(0,10,8,0.99));border:1.5px solid #00ff88;box-shadow:0 0 25px rgba(0,255,136,0.35),inset 0 0 35px rgba(0,60,30,0.5);backdrop-filter:blur(16px);border-radius:10px;display:none;z-index:10}
  .panel-img{width:100%;height:250px;background-size:cover;background-position:center;position:relative;border-bottom:1px solid rgba(0,255,136,0.3);background-color:#001a0f}
  .panel-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,15,10,1) 10%,transparent 70%)}
  .sector-tag{position:absolute;bottom:12px;left:14px;z-index:2;background:rgba(0,0,0,0.6);border:1px solid #ffd700;color:#ffd700;font-family:'Orbitron';font-size:9px;padding:4px 10px;border-radius:3px}
  .status-tag{position:absolute;top:14px;left:14px;z-index:2}
  .panel-body{padding:18px 20px 20px}
  #info-panel h2{margin:0 0 4px;color:#00ff88;letter-spacing:2.5px;font-size:22px;font-family:'Orbitron'}
  .status{padding:5px 12px;border-radius:3px;font-size:10px;display:inline-block;font-weight:bold;letter-spacing:1.2px;font-family:'Orbitron'}
  .republic{background:#0a2a40;border:1px solid #3ad4ff;color:#3ad4ff} .separatist{background:#3a0a0a;border:1px solid #ff4444;color:#ff6666} .contested{background:#3a300a;border:1px solid #ffcc33;color:#ffdd55} .alpha{background:#0a2a1a;border:1px solid #00ff88;color:#00ff88}
  .tabs{display:flex;gap:12px;margin:14px 0;border-bottom:1px solid rgba(0,255,136,0.15);padding-bottom:8px}
  .tab{cursor:pointer;font-family:'Orbitron';font-size:9px;letter-spacing:1.2px;color:rgba(255,255,255,0.4);padding-bottom:4px;border-bottom:2px solid transparent}
  .tab.active{color:#00ff88;border-bottom:2px solid #00ff88}
  #info-panel p{font-size:14.5px;line-height:1.65;opacity:.92;color:#c8ffe0}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .stat{background:rgba(0,255,136,0.06);border:1px solid rgba(0,255,136,0.15);padding:10px 12px;border-radius:6px}
  .stat span{display:block;font-family:'Orbitron';font-size:8px;color:#ffd700;margin-bottom:3px} .stat b{font-size:13px;color:#fff}
  .unit-img{width:100%;height:170px;border-radius:6px;background-size:cover;background-position:center top;margin-bottom:14px;border:1.5px solid rgba(255,255,100,0.6);background-color:#001a0f}
  .btn{margin-top:18px;background:linear-gradient(90deg,#003322,#006644);border:1.5px solid #00ff88;padding:11px 14px;border-radius:6px;cursor:pointer;color:#00ff88;font-weight:bold;width:100%;letter-spacing:2px;font-family:'Orbitron'}
  .title-bar{position:absolute;left:55%;top:20px;transform:translateX(-50%);z-index:4;font-family:'Orbitron';font-weight:800;letter-spacing:3px;font-size:13px;color:#00ff88;opacity:.9;white-space:nowrap;pointer-events:none}
  #side-menu{position:absolute;left:0;top:0;height:100vh;z-index:12;display:flex;flex-direction:column}
  #menu-toggle{width:48px;height:48px;margin:18px 0 0 18px;background:rgba(0,20,14,0.9);border:1.5px solid #00ff88;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:13}
  #menu-toggle span{display:block;width:20px;height:2px;background:#00ff88;position:relative;transition:.25s}
  #menu-toggle span::before,#menu-toggle span::after{content:'';position:absolute;left:0;width:20px;height:2px;background:#00ff88;transition:.25s}
  #menu-toggle span::before{top:-6px} #menu-toggle span::after{top:6px}
  #menu-toggle.open span{background:transparent}
  #menu-toggle.open span::before{top:0;transform:rotate(45deg)} #menu-toggle.open span::after{top:0;transform:rotate(-45deg)}
  #menu-panel{width:0;overflow:hidden;background:rgba(0,18,12,0.98);border-right:1.5px solid #00ff88;transition:width .32s ease;margin-top:12px;display:flex;flex-direction:column}
  #menu-panel.open{width:300px}
  .menu-header{padding:18px 20px 12px;font-family:'Orbitron';font-size:12px;color:#00ff88;border-bottom:1px solid rgba(0,255,136,0.2);white-space:nowrap}
  .menu-body{flex:1;overflow-y:auto;padding:8px 0}
  .menu-section{border-bottom:1px solid rgba(0,255,136,0.12)}
  .menu-section-title{display:flex;justify-content:space-between;padding:14px 20px;cursor:pointer;font-family:'Orbitron';font-size:11px;color:#c8ffe0}
  .menu-section-content{max-height:0;overflow:hidden;transition:max-height .3s ease;background:rgba(0,0,0,0.25)}
  .menu-section.open .menu-section-content{max-height:400px}
  .menu-placeholder{padding:16px 20px;font-size:13px;color:rgba(200,255,224,0.55);font-style:italic}
  .menu-footer{padding:12px 20px;border-top:1px solid rgba(0,255,136,0.15);font-family:'Orbitron';font-size:8px;color:rgba(0,255,136,0.5)}
  .glitch-img{filter:contrast(1.6) brightness(0.55) hue-rotate(-15deg) saturate(0.4) !important;border-color:#ff2222 !important;animation:flicker-glitch 0.18s infinite !important}
  @keyframes flicker-glitch{0%{opacity:0.9} 50%{opacity:0.55;transform:translateX(1px)} 100%{opacity:0.95}}
</style>
</head>
<body>
<div id="galaxy">
  <div class="title-bar">QUANTUM PULSE // HOLOMAPA GALÁCTICO — ALPHA v2.5</div>
  <svg id="routes"></svg>
  <div id="side-menu">
    <div id="menu-toggle" onclick="toggleMenu()"><span></span></div>
    <div id="menu-panel">
      <div class="menu-header">PANEL DE OPERACIONES QP</div>
      <div class="menu-body">
        <div class="menu-section open"><div class="menu-section-title" onclick="this.parentElement.classList.toggle('open')">LEGIONES ▶</div><div class="menu-section-content"><div class="menu-placeholder">Datos de legiones pendientes.</div></div></div>
        <div class="menu-section"><div class="menu-section-title" onclick="this.parentElement.classList.toggle('open')">FLOTA REPUBLICANA ▶</div><div class="menu-section-content"><div class="menu-placeholder">Inventario de flota pendiente.</div></div></div>
        <div class="menu-section"><div class="menu-section-title" onclick="this.parentElement.classList.toggle('open')">SUMINISTROS ▶</div><div class="menu-section-content"><div class="menu-placeholder">Logística pendiente.</div></div></div>
      </div>
      <div class="menu-footer">QP-ORACLE // ACCESO ALPHA</div>
    </div>
  </div>
  <div id="info-panel"></div>
</div>
<script>
// === AUDIO HOLOGRAFICO - WEB AUDIO API ===
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playTone(type,f1,f2,dur,vol){
  initAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,audioCtx.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,audioCtx.currentTime+dur);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}
function sP(){ playTone('sawtooth',120,850,0.4,0.3); setTimeout(()=>playTone('sine',1200,1800,0.15,0.2),120); } // planeta
function sT(){ playTone('square',800,1200,0.08,0.15); } // tabs LORE/DATOS
function sC(){ playTone('triangle',600,80,0.35,0.25); } // cerrar
function sH(){ playTone('sine',2000,2600,0.07,0.08); } // hover

document.addEventListener('click', initAudio, {once:true});

const planets = [
  {id:'coruscant', name:'CORUSCANT', x:50, y:50, size:30, color:'#00ff88', status:'alpha', sector:'NUCLEO', lore:'Centro de la República. Cuartel general de Quantum Pulse.', img:'./planets/coruscant.png'},
  {id:'mustafar', name:'MUSTAFAR', x:72, y:70, size:18, color:'#ff3355', status:'separatist', sector:'OUTER RIM', lore:'[SEÑAL CORRUPTA] Alta interferencia. Zona Separatista.', img:'./planets/mustafar.png'},
  {id:'geonosis', name:'GEONOSIS', x:65, y:62, size:16, color:'#ff3355', status:'separatist', sector:'OUTER RIM', lore:'[SEÑAL CORRUPTA] Fábricas droide.', img:'./planets/geonosis.png'},
  {id:'kamino', name:'KAMINO', x:78, y:85, size:14, color:'#3ad4ff', status:'republic', sector:'WILD SPACE', lore:'Instalaciones de clonación.', img:'./planets/kamino.png'},
  {id:'tatooine', name:'TATOOINE', x:30, y:75, size:16, color:'#ffd700', status:'contested', sector:'OUTER RIM', lore:'Territorio Hutt.', img:'./planets/tatooine.png'}
];
const routes = [
  {from:'coruscant', to:'kamino', type:'friendly'},
  {from:'coruscant', to:'geonosis', type:'hostile'},
  {from:'geonosis', to:'mustafar', type:'hostile'}
];
function toggleMenu(){
  sT();
  document.getElementById('menu-toggle').classList.toggle('open');
  document.getElementById('menu-panel').classList.toggle('open');
}
function renderPlanets(){
  const galaxy = document.getElementById('galaxy');
  planets.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'planet ' + (p.id==='coruscant'?'main':'');
    d.style.left = p.x+'%'; d.style.top = p.y+'%';
    d.style.width = p.size+'px'; d.style.height = p.size+'px';
    d.style.color = p.color;
    if(p.img) d.style.backgroundImage = `url('${p.img}')`;
    d.innerHTML = `<div class="planet-label" style="color:${p.color}">${p.name}</div>`;
    d.onmouseenter = ()=>sH();
    d.onclick = ()=>{ sP(); showInfo(p); };
    galaxy.appendChild(d);
  });
  const svg = document.getElementById('routes');
  routes.forEach(r=>{
    const a = planets.find(x=>x.id===r.from); const b = planets.find(x=>x.id===r.to);
    if(!a||!b) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', a.x+'%'); line.setAttribute('y1', a.y+'%');
    line.setAttribute('x2', b.x+'%'); line.setAttribute('y2', b.y+'%');
    line.setAttribute('class', r.type); svg.appendChild(line);
  });
}
function showInfo(p){
  const panel = document.getElementById('info-panel');
  panel.style.display = 'block';
  panel.innerHTML = `
    <div id="info-img" class="panel-img" style="background-image:url('${p.img}')"><div class="sector-tag">${p.sector}</div><div class="status-tag"><span class="status ${p.status}">${p.status.toUpperCase()}</span></div></div>
    <div class="panel-body">
      <h2>${p.name}</h2>
      <div class="tabs">
        <div class="tab active" onclick="sT()">LORE</div>
        <div class="tab" onclick="sT()">DATOS</div>
        <div class="tab" onclick="sT()">FUERZAS</div>
        <div class="tab" onclick="sT()">UNIDADES</div>
      </div>
      <p>${p.lore}</p>
      <div id="unit-img" class="unit-img" style="background-image:url('${p.img}')"></div>
      <button class="btn" onclick="sC();document.getElementById('info-panel').style.display='none'">CERRAR TRANSMISIÓN</button>
    </div>
  `;
  const isGlitch = p.id==="mustafar" || p.id==="geonosis";
  document.getElementById('info-img').classList.toggle('glitch-img', isGlitch);
  document.getElementById('unit-img').classList.toggle('glitch-img', isGlitch);
}
renderPlanets();
</script>
</body>
</html>
