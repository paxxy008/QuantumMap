<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QUANTUM PULSE - CWRP // V8 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#00ff88;--green-dim:rgba(0,255,136,0.18);--blue:#00d4ff;--red:#ff2a4a;--yellow:#ffcc00;--violet:#a855f7;--orange:#ff7a00}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff;overscroll-behavior:none;user-select:none}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;background:#000;cursor:grab;touch-action:none}
#viewport.grabbing{cursor:grabbing}
#world{width:3000px;height:2000px;background:url('./fondo.jpg') center/cover no-repeat, radial-gradient(ellipse at center,#0a1a14 0%,#000 80%);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(0,0) scale(1);transform-origin:center center;will-change:transform}
svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg#routes line{stroke-width:3.2px;stroke-linecap:round;opacity:1;filter:drop-shadow(0 0 8px currentColor);stroke-dasharray:14 14;animation:dashMove 1.5s linear infinite}
@keyframes dashMove{to{stroke-dashoffset:-28}}
.route-rep{stroke:var(--blue)}.route-cis{stroke:var(--red)}.route-neutral{stroke:var(--yellow)}.route-mandalore{stroke:var(--violet)}.route-hutt{stroke:var(--orange)}
/* PLANETA 3D */
.planet{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:5;transform-style:preserve-3d;transition:transform.16s cubic-bezier(.2,.8,.2,1)}
.planet-core{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000;position:relative;box-shadow:inset -10px -10px 20px rgba(0,0,0,0.95), inset 5px 5px 12px rgba(255,255,255,0.18), 0 0 0 1.3px var(--green), 0 0 14px rgba(0,255,136,0.55);border:1px solid var(--green)}
.planet-core::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 28% 22%, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.12) 18%, transparent 42%);pointer-events:none;z-index:2}
.planet-core::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 75%, rgba(0,0,0,0.85) 0%, transparent 60%);pointer-events:none;z-index:2}
.planet-core img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;filter:saturate(1.2) contrast(1.12) brightness(1.05)}
.planet-aura{position:absolute;inset:-5px;border-radius:50%;opacity:.58;filter:blur(7px);z-index:-1}
.planet:hover{transform:translate(-50%,-50%) scale(1.38) translateZ(20px);filter:brightness(1.2)}
.planet-label{position:absolute;top:124%;left:50%;transform:translateX(-50%);font-family:'Orbitron';font-size:9.5px;font-weight:800;color:var(--green)!important;text-shadow:0 0 8px var(--green);letter-spacing:1.2px;white-space:nowrap;background:rgba(0,0,0,0.8);border:1px solid var(--green-dim);padding:2px 8px;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#title-box{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;border:1px solid var(--green);background:rgba(0,20,10,0.96);padding:10px 28px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 22px rgba(0,255,136,0.4)}
#title-box h1{font-family:'Orbitron';font-size:18px;letter-spacing:4px;color:var(--green);text-shadow:0 0 12px var(--green)}
#controls{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;gap:7px;flex-wrap:wrap;max-width:260px}
.ctrl-btn{height:42px;min-width:42px;padding:0 14px;background:rgba(0,20,12,0.92);border:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-weight:800;font-size:11px;cursor:pointer}
.ctrl-btn:hover{background:var(--green);color:#000}
#overlay{position:fixed;inset:0;background:rgba(0,12,6,0.84);z-index:30;display:none}
#planet-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:94vw;max-width:640px;background:#0a1c12;border:1px solid var(--green);box-shadow:0 0 45px rgba(0,255,136,0.4);display:none;overflow:hidden}
.modal-banner{height:195px;position:relative;background-size:cover;background-position:center;border-bottom:1px solid var(--green)}
.modal-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg, rgba(10,28,18,1) 12%, transparent 70%)}
.banner-info{position:absolute;left:16px;bottom:12px;z-index:2}
.banner-info h2{font-family:'Orbitron';font-size:24px;letter-spacing:3px;color:var(--green);text-shadow:0 0 12px var(--green)}
.banner-meta{font-size:11px;color:var(--green);font-family:'Orbitron'}
.modal-tabs{display:flex;border-bottom:1px solid var(--green-dim);background:rgba(0,0,0,0.5)}
.tab{flex:1;padding:13px 6px;text-align:center;font-family:'Orbitron';font-size:10px;cursor:pointer;background:rgba(0,255,136,.06);color:var(--green);border-right:1px solid var(--green-dim)}
.tab.active{background:var(--green);color:#000;font-weight:800}
.tab-content{display:none}.tab-content.active{display:block}
.content-img{width:100%;height:160px;background-size:cover;background-position:center;border-bottom:1px solid var(--green-dim);position:relative}
.content-img-label{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.85);border:1px solid var(--green-dim);padding:2px 8px;font-family:'Orbitron';font-size:8px;color:var(--green)}
.content-body{padding:16px;font-size:14px;line-height:1.55;color:#c8ffd8;max-height:240px;overflow-y:auto}
.close-btn{width:100%;padding:13px;background:rgba(0,255,136,.12);border:0;border-top:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-size:12px;letter-spacing:4px;font-weight:900;cursor:pointer}
.close-btn:hover{background:var(--green);color:#000}
.badge{display:inline-block;padding:3px 8px;border:1px solid var(--green);color:var(--green);background:rgba(0,255,136,0.15);font-family:'Orbitron';font-size:9px;margin-bottom:10px}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="routes"></svg></div></div>
<div id="title-box"><h1>QUANTUM PULSE - CWRP</h1></div>
<div id="controls">
<button class="ctrl-btn" onclick="zoom(0.18);playSfx('zoomIn')">+</button>
<button class="ctrl-btn" onclick="zoom(-0.18);playSfx('zoomOut')">-</button>
<button class="ctrl-btn" onclick="resetView();playSfx('reset')">RESET</button>
<button class="ctrl-btn" onclick="moveMap(200,0);playSfx('pan')">◀</button>
<button class="ctrl-btn" onclick="moveMap(-200,0);playSfx('pan')">▶</button>
<button class="ctrl-btn" onclick="moveMap(0,160);playSfx('pan')">▲</button>
<button class="ctrl-btn" onclick="moveMap(0,-160);playSfx('pan')">▼</button>
</div>
<div id="overlay" onclick="closeModal()"></div>
<div id="planet-modal">
<div id="banner" class="modal-banner"><div class="banner-info"><h2 id="b-name"></h2><div id="b-meta" class="banner-meta"></div></div></div>
<div class="modal-tabs"><div class="tab active" data-t="lore" onclick="switchTab('lore')">LORE</div><div class="tab" data-t="benef" onclick="switchTab('benef')">BENEFICIO</div><div class="tab" data-t="troops" onclick="switchTab('troops')">TROPAS</div></div>
<div id="tab-lore" class="tab-content active"><div id="img-lore" class="content-img"><span class="content-img-label">IMG_PLANET</span></div><div class="content-body" id="text-lore"></div></div>
<div id="tab-benef" class="tab-content"><div id="img-benef" class="content-img"><span class="content-img-label">IMG_MAIN</span></div><div class="content-body" id="text-benef"></div></div>
<div id="tab-troops" class="tab-content"><div id="img-troops" class="content-img"><span class="content-img-label">IMG_TROOPS</span></div><div class="content-body" id="text-troops"></div></div>
<button class="close-btn" onclick="closeModal()">⟡ CERRAR TRANSMISIÓN ⟡</button>
</div>
<script>
const planets=[
{id:"hoth",name:"HOTH",x:320,y:200,color:"#00ff88",faction:"neutral",size:44,lore:`Helado Borde Exterior. Base Eco. Ventiscas nivel 4.`,benef:`NEUTRAL: +12% resistencia sobrecalentamiento.`,troops:`FAUNA: Wampa, Tauntaun.`,imgPlanet:"./img/Hoth_qp_planet.png",imgMain:"./img/HOTH_qp_main.png",imgTroops:"./img/HOTH_qp_troops.png"},
{id:"anaxes",name:"ANAXES",x:620,y:420,color:"#00ff88",faction:"rep",size:52,lore:`Fortaleza naval legendaria República. Centro estrategia.`,benef:`REP: Venator +22% daño flota.`,troops:`TROPAS: Anaxes High Command, ARC.`,imgPlanet:"./Anaxes_qp_planet.png",imgMain:"./ANAXES_qp_main.png",imgTroops:"./ANAXES_qp_troops.png"},
{id:"muunilinst",name:"MUUNILINST",x:780,y:240,color:"#00ff88",faction:"cis",size:44,lore:`Mundo bancario Clan Bancario.`,benef:`CIS: +28% créditos.`,troops:`TROPAS: Muun Guards.`,imgPlanet:"./img/Muunilinst_qp_planet.png",imgMain:"./img/MUUNILINST_qp_main.png",imgTroops:"./img/MUUNILINST_qp_troops.png"},
{id:"mygeeto",name:"MYGEETO",x:1020,y:200,color:"#00ff88",faction:"cis",size:42,lore:`Mundo cristalino gélido.`,benef:`CIS: Cristales cañones.`,troops:`TROPAS: Lurmen + Droides.`,imgPlanet:"./img/Mygeeto_qp_planet.png",imgMain:"./img/MYGEETO_qp_main.png",imgTroops:"./img/MYGEETO_qp_troops.png"},
{id:"mandalore",name:"MANDALORE",x:1200,y:380,color:"#a855f7",faction:"mandalore",size:50,lore:`Mundo Mandalorianos. Beskar.`,benef:`VIOLETA: Beskar limitado.`,troops:`TROPAS: Mandalorianos.`,imgPlanet:"./img/Mandalore_qp_planet.png",imgMain:"./img/MANDALORE_qp_main.png",imgTroops:"./img/MANDALORE_qp_troops.png"},
{id:"christophsis",name:"CHRISTOPHSIS",x:1560,y:420,color:"#00ff88",faction:"cis",size:44,lore:`Planeta cristalino.`,benef:`CIS: +14% turbolaser.`,troops:`TROPAS: B1/B2.`,imgPlanet:"./img/Christophsis_qp_planet.png",imgMain:"./img/CHRISTOPHSIS_qp_main.png",imgTroops:"./img/CHRISTOPHSIS_qp_troops.png"},
{id:"alderaan",name:"ALDERAAN",x:1080,y:640,color:"#00ff88",faction:"rep",size:46,lore:`Planeta pacifista.`,benef:`REP: +18% diplomacia.`,troops:`TROPAS: Alderaan Security.`,imgPlanet:"./img/Alderaan_qp_planet.png",imgMain:"./img/ALDERAAN_qp_main.png",imgTroops:"./img/ALDERAAN_qp_troops.png"},
{id:"coruscant",name:"CORUSCANT",x:1220,y:820,color:"#00ff88",faction:"rep",size:62,lore:`Capital galáctica 5127 niveles.`,benef:`REP: +18% créditos políticos.`,troops:`TROPAS: Shock Troopers.`,imgPlanet:"./img/Coruscant_qp_planet.png",imgMain:"./img/CORUSCANT_qp_main.png",imgTroops:"./img/CORUSCANT_qp_troops.png"},
{id:"moncala",name:"MON CALA",x:1420,y:600,color:"#00ff88",faction:"rep",size:46,lore:`Mundo oceánico Mon Cala.`,benef:`REP: +24% cruceros MC.`,troops:`TROPAS: Mon Cala Guard.`,imgPlanet:"./img/Moncala_qp_planet.png",imgMain:"./img/MONCALA_qp_main.png",imgTroops:"./img/MONCALA_qp_troops.png"},
{id:"kashyyyk",name:"KASHYYYK",x:720,y:1320,color:"#00ff88",faction:"rep",size:48,lore:`Mundo Wookiee Wroshyr.`,benef:`REP: +20% fuerza bruta.`,troops:`TROPAS: Wookiee Warriors.`,imgPlanet:"./img/Kashyyyk_qp_planet.png",imgMain:"./img/KASHYYYK_qp_main.png",imgTroops:"./img/KASHYYYK_qp_troops.png"},
{id:"felucia",name:"FELUCIA",x:760,y:1020,color:"#00ff88",faction:"neutral",size:42,lore:`Selva bioluminiscente.`,benef:`NEUTRAL: +10% curación.`,troops:`FAUNA: Acklay.`,imgPlanet:"./img/Felucia_qp_planet.png",imgMain:"./img/FELUCIA_qp_main.png",imgTroops:"./img/FELUCIA_qp_troops.png"},
{id:"dathomir",name:"DATHOMIR",x:940,y:780,color:"#ff2244",faction:"neutral",size:44,lore:`Mundo Hermanas de la Noche.`,benef:`NEUTRAL: Ichor +15%.`,troops:`TROPAS: Nightsisters.`,imgPlanet:"./img/Dathomir_qp_planet.png",imgMain:"./img/DATHOMIR_qp_main.png",imgTroops:"./img/DATHOMIR_qp_troops.png"},
{id:"naboo",name:"NABOO",x:1320,y:1060,color:"#00ff88",faction:"rep",size:46,lore:`Naboo y Gungans.`,benef:`REP: +14% escudos.`,troops:`TROPAS: Gungan Army.`,imgPlanet:"./img/Naboo_qp_planet.png",imgMain:"./img/NABOO_qp_main.png",imgTroops:"./img/NABOO_qp_troops.png"},
{id:"geonosis",name:"GEONOSIS",x:1040,y:1220,color:"#00ff88",faction:"cis",size:48,lore:`Colmenas rocosas fábrica droides.`,benef:`CIS: -28% coste droides.`,troops:`TROPAS: Geonosians.`,imgPlanet:"./img/Geonosis_qp_planet.png",imgMain:"./img/GEONOSIS_qp_main.png",imgTroops:"./img/GEONOSIS_qp_troops.png"},
{id:"utapau",name:"UTAPAU",x:1640,y:880,color:"#00ff88",faction:"cis",size:42,lore:`Mundo sumideros.`,benef:`CIS: +20% visión.`,troops:`FAUNA: Varactyl.`,imgPlanet:"./img/Utapau_qp_planet.png",imgMain:"./img/UTAPAU_qp_main.png",imgTroops:"./img/UTAPAU_qp_troops.png"},
{id:"tatooine",name:"TATOOINE",x:1480,y:1160,color:"#ff7a00",faction:"hutt",size:46,lore:`Desierto binario Hutt.`,benef:`HUTT: +22% créditos negros.`,troops:`FAUNA: Krayt.`,imgPlanet:"./img/Tatooine_qp_planet.png",imgMain:"./img/TATOOINE_qp_main.png",imgTroops:"./img/TATOOINE_qp_troops.png"},
{id:"mustafar",name:"MUSTAFAR",x:1800,y:1240,color:"#00ff88",faction:"cis",size:48,lore:`Mundo volcánico 800°C.`,benef:`CIS: +20% droides.`,troops:`TROPAS: Mustafarians.`,imgPlanet:"./img/Mustafar_qp_planet.png",imgMain:"./img/MUSTAFAR_qp_main.png",imgTroops:"./img/MUSTAFAR_qp_troops.png"},
{id:"rishi",name:"RISHI MOON",x:1880,y:960,color:"#00ff88",faction:"rep",size:40,lore:`Luna puesto escucha.`,benef:`REP: +28% radar.`,troops:`TROPAS: Shinies.`,imgPlanet:"./img/Rishi_qp_planet.png",imgMain:"./img/RISHI_qp_main.png",imgTroops:"./img/RISHI_qp_troops.png"},
{id:"kamino",name:"KAMINO",x:2180,y:1420,color:"#00ff88",faction:"rep",size:44,lore:`Planeta clonadores tormentas eternas.`,benef:`REP: -22% clones.`,troops:`TROPAS: Clones.`,imgPlanet:"./img/Kamino_qp_planet.png",imgMain:"./img/KAMINO_qp_main.png",imgTroops:"./img/KAMINO_qp_troops.png"},
{id:"pulsar",name:"PULSAR",x:200,y:1080,color:"#00ff88",faction:"rep",size:38,lore:`Estación relé SOLO a CORUSCANT.`,benef:`REP: +32% holonet.`,troops:`TROPAS: Técnicos.`,imgPlanet:"./img/Pulsar_qp_planet.png",imgMain:"./img/PULSAR_qp_main.png",imgTroops:"./img/PULSAR_qp_troops.png"}
];
let routes=[["pulsar","coruscant"],["coruscant","alderaan"],["coruscant","anaxes"],["coruscant","naboo"],["coruscant","moncala"],["coruscant","christophsis"],["alderaan","mandalore"],["mandalore","mygeeto"],["mygeeto","muunilinst"],["muunilinst","christophsis"],["christophsis","utapau"],["anaxes","hoth"],["hoth","mandalore"],["kashyyyk","felucia"],["felucia","dathomir"],["dathomir","geonosis"],["geonosis","naboo"],["naboo","kashyyyk"],["naboo","tatooine"],["tatooine","mustafar"],["mustafar","rishi"],["mustafar","kamino"],["utapau","rishi"],["utapau","tatooine"],["tatooine","geonosis"],["moncala","kashyyyk"],["moncala","naboo"]];
let scale=1,tx=0,ty=0,isDragging=false,startX,startY,lastX=0,lastY=0,velX=0,velY=0,lastDist=0;
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),svg=document.getElementById('routes');
function getRouteType(a,b){if(a==="pulsar"||b==="pulsar")return "rep";if(a==="mandalore"||b==="mandalore")return "mandalore";if(a==="tatooine"||b==="tatooine")return "hutt";const A=planets.find(p=>p.id===a),B=planets.find(p=>p.id===b);if(!A||!B)return "neutral";if(A.faction==="rep"&&B.faction==="rep")return "rep";if(A.faction==="cis"&&B.faction==="cis")return "cis";return "neutral"}
function render(){svg.innerHTML="";routes.forEach(r=>{const pA=planets.find(p=>p.id===r[0]),pB=planets.find(p=>p.id===r[1]);if(!pA||!pB)return;const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",pA.x);line.setAttribute("y1",pA.y);line.setAttribute("x2",pB.x);line.setAttribute("y2",pB.y);line.setAttribute("class","route-"+getRouteType(r[0],r[1]));svg.appendChild(line)});world.querySelectorAll('.planet').forEach(e=>e.remove());planets.forEach(p=>{const el=document.createElement('div');el.className='planet';el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.width=p.size+'px';el.style.height=p.size+'px';el.style.color=p.color;el.innerHTML=`<div class='planet-aura' style='background:${p.color}'></div><div class='planet-core'><img src="${p.imgPlanet}" loading="lazy" onerror="this.style.display='none'"></div><div class='planet-label'>${p.name}</div>`;el.onclick=e=>{e.stopPropagation();openPlanet(p);playSfx('open')};el.onmouseenter=()=>playSfx('hover');world.appendChild(el)})}
function openPlanet(p){document.getElementById('overlay').style.display='block';document.getElementById('planet-modal').style.display='block';const b=document.getElementById('banner');b.style.backgroundImage="url("+p.imgPlanet+")";document.getElementById('b-name').innerText=p.name;document.getElementById('b-meta').innerText=`X:${p.x} Y:${p.y} // ${p.faction.toUpperCase()}`;setTabImg('img-lore',p.imgPlanet);setTabImg('img-benef',p.imgMain);setTabImg('img-troops',p.imgTroops);document.getElementById('text-lore').innerHTML=`<span class='badge'>LORE</span><br>${p.lore}`;document.getElementById('text-benef').innerHTML=`<span class='badge'>BENEFICIO</span><br>${p.benef}`;document.getElementById('text-troops').innerHTML=`<span class='badge'>TROPAS</span><br>${p.troops}`;switchTab('lore')}
function setTabImg(id,url){document.getElementById(id).style.backgroundImage="url("+url+")"}
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector(`[data-t="${t}"]`).classList.add('active');document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');playSfx('tab')}
function closeModal(){document.getElementById('overlay').style.display='none';document.getElementById('planet-modal').style.display='none';playSfx('close')}
function applyTransform(){world.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`}
function zoom(d){scale=Math.min(3.5,Math.max(0.3,scale+d));applyTransform()}
function resetView(){scale=1;tx=0;ty=0;applyTransform()}
function moveMap(dx,dy){tx+=dx;ty+=dy;applyTransform()}
// DRAG + INERCIA + TOUCH + PINCH
viewport.addEventListener('mousedown',e=>{isDragging=true;viewport.classList.add('grabbing');startX=e.clientX-tx;startY=e.clientY-ty;lastX=e.clientX;lastY=e.clientY;velX=0;velY=0});
window.addEventListener('mousemove',e=>{if(!isDragging)return;tx=e.clientX-startX;ty=e.clientY-startY;velX=e.clientX-lastX;velY=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform()});
window.addEventListener('mouseup',()=>{if(!isDragging)return;isDragging=false;viewport.classList.remove('grabbing');let f=0.92;function inertia(){if(Math.abs(velX)<0.1&&Math.abs(velY)<0.1)return;tx+=velX;ty+=velY;velX*=f;velY*=f;applyTransform();requestAnimationFrame(inertia)}inertia()});
viewport.addEventListener('touchstart',e=>{if(e.touches.length===1){const t=e.touches[0];isDragging=true;startX=t.clientX-tx;startY=t.clientY-ty;lastX=t.clientX;lastY=t.clientY}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;lastDist=Math.sqrt(dx*dx+dy*dy)}},{passive:false});
viewport.addEventListener('touchmove',e=>{if(e.touches.length===1&&isDragging){e.preventDefault();const t=e.touches[0];tx=t.clientX-startX;ty=t.clientY-startY;velX=t.clientX-lastX;velY=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;applyTransform()}else if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.sqrt(dx*dx+dy*dy);if(lastDist>0){const delta=(dist-lastDist)*0.008;zoom(delta)}lastDist=dist}},{passive:false});
viewport.addEventListener('touchend',()=>{isDragging=false;lastDist=0});
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?-0.1:0.1);playSfx(e.deltaY>0?'zoomOut':'zoomIn')},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')moveMap(90,0);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')moveMap(-90,0);if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')moveMap(0,90);if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')moveMap(0,-90);if(e.key==='+'||e.key==='=')zoom(0.12);if(e.key==='-')zoom(-0.12)});
let audioCtx;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function playTone(f,type,v,d,dt=0,ff=4000){try{ensureAudio();const o=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain(),fl=audioCtx.createBiquadFilter();o.type=type;o.frequency.value=f;o.detune.value=dt;o2.type=type;o2.frequency.value=f*1.007;fl.type='lowpass';fl.frequency.value=ff;fl.Q.value=8;g.gain.setValueAtTime(0,audioCtx.currentTime);g.gain.linearRampToValueAtTime(v,audioCtx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(audioCtx.destination);o.start();o2.start();o.stop(audioCtx.currentTime+d);o2.stop(audioCtx.currentTime+d)}catch(e){}}
function playSfx(n){switch(n){case 'hover':playTone(1200,'sine',0.06,0.18,0,6000);break;case 'open':playTone(220,'sawtooth',0.18,0.45,0,2000);setTimeout(()=>playTone(880,'sine',0.12,0.5,0,5000),80);break;case 'close':playTone(800,'triangle',0.14,0.35,-200,1500);setTimeout(()=>playTone(180,'sawtooth',0.12,0.4,0,800),60);break;case 'tab':playTone(650,'triangle',0.1,0.22,0,3500);break;case 'zoomIn':playTone(900,'sine',0.07,0.15);break;case 'zoomOut':playTone(500,'sine',0.07,0.15);break;case 'pan':playTone(300,'sine',0.05,0.12);break;case 'reset':playTone(400,'square',0.1,0.3,0,1200);setTimeout(()=>playTone(800,'sine',0.1,0.4),120);break;}}
render();
</script>
</body>
