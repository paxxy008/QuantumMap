<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Pulse - Holomapa Galáctico</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden}
  #galaxy{
    width:100vw;height:100vh;
    background: url('./QUANTUM_MAP.png') center/cover no-repeat fixed;
    position:relative;
  }
  #galaxy::after{
    content:'';position:absolute;inset:0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.75) 95%);
    z-index:1;
  }
  #galaxy::before{
    content:'';position:absolute;inset:0;z-index:2;
    background: repeating-linear-gradient(0deg, rgba(0,255,136,0.03) 0px, transparent 2px, transparent 4px);
    pointer-events:none;
  }
  .planet{
    position:absolute; border-radius:50%; cursor:pointer;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 22px currentColor, inset -7px -7px 14px rgba(0,0,0,0.95);
    transition: all 0.35s ease; z-index:3; border:1.8px solid rgba(255,255,255,0.9);
    background-size: cover;
    background-position: center;
  }
  .planet:hover{ transform: translate(-50%,-50%) scale(1.35); box-shadow: 0 0 40px currentColor, 0 0 70px currentColor; }
  .planet.selected{
    transform: translate(-50%,-50%) scale(1.55);
    z-index:6;
    animation: pulse-aura 1.6s ease-in-out infinite;
  }
  .planet.main{
    box-shadow: 0 0 35px #00ff88, 0 0 70px #00ff88, 0 0 110px rgba(0,255,136,0.6), inset -7px -7px 14px rgba(0,0,0,0.85);
    border: 2.5px solid #00ffcc;
  }
  @keyframes pulse-aura {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 10px currentColor); }
    50% { filter: brightness(1.6) drop-shadow(0 0 20px currentColor); }
  }
  .planet-label{
    position:absolute; top:135%; left:50%; transform:translateX(-50%);
    font-family:'Orbitron', sans-serif;
    font-size:10px; font-weight:800; letter-spacing:1.8px; white-space:nowrap;
    text-shadow: 0 1px 4px black, 0 0 12px currentColor; pointer-events:none;
  }
  svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
  svg#routes line{
    stroke-width:3;
    stroke-dasharray:12 10;
    stroke-linecap:round;
    animation: dash-move 1s linear infinite;
  }
  @keyframes dash-move { to { stroke-dashoffset: -44; } }
  svg#routes line.friendly{ stroke: #00ffcc; filter: drop-shadow(0 0 7px #00ffcc) drop-shadow(0 0 14px #00ffcc); opacity:1; }
  svg#routes line.hostile{ stroke: #ff3355; filter: drop-shadow(0 0 7px #ff3355) drop-shadow(0 0 16px #ff3355); opacity:1; stroke-dasharray: 5 10; }
  svg#routes line.neutral{ stroke: #ffd700; filter: drop-shadow(0 0 7px #ffd700) drop-shadow(0 0 14px #ffd700); opacity:1; }

  #info-panel{
    position:absolute; right:22px; top:22px; width:380px;
    background: linear-gradient(160deg, rgba(0,22,14,0.96) 0%, rgba(0,10,8,0.98) 100%);
    border: 1.5px solid #00ff88;
    box-shadow: 0 0 22px rgba(0,255,136,0.35), inset 0 0 35px rgba(0,60,30,0.5);
    backdrop-filter: blur(16px);
    padding:26px 24px;
    border-radius:8px;
    display:none; z-index:10;
  }
  #info-panel::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, transparent, #ffd700, #00ff88, #ffd700, transparent);
    box-shadow: 0 0 10px #00ff88;
  }
  #info-panel h2{ margin:0 0 14px; color:#00ff88; letter-spacing:2.5px; font-size:21px; font-family:'Orbitron', sans-serif; text-shadow: 0 0 14px rgba(0,255,136,0.6); }
  .status{ padding:6px 14px; border-radius:3px; font-size:11px; display:inline-block; margin-bottom:16px; font-weight:bold; letter-spacing:1.2px; font-family:'Orbitron', sans-serif; }
  .republic{background:#0a2a40; border:1px solid #3ad4ff; color:#3ad4ff; box-shadow:0 0 10px #3ad4ff}
  .separatist{background:#3a0a0a; border:1px solid #ff4444; color:#ff6666; box-shadow:0 0 10px #ff4444}
  .contested{background:#3a300a; border:1px solid #ffcc33; color:#ffdd55; box-shadow:0 0 10px #ffcc33}
  .alpha{background:#0a2a1a; border:1px solid #00ff88; color:#00ff88; box-shadow:0 0 12px rgba(0,255,136,0.6)}
  .mandalore{background:#2a0a3a; border:1px solid #c9a0ff; color:#c9a0ff; box-shadow:0 0 12px rgba(201,160,255,0.5)}
  .neutral{background:#0a2a1a; border:1px solid #66ff99; color:#66ff99}
  #info-panel p{font-size:13.8px; line-height:1.6; opacity:0.95; color:#d0ffe8}
  #info-panel .coord-line{ margin-top:18px; font-size:11px; opacity:0.6; color:#ffd700; letter-spacing:0.8px; font-family:'Orbitron', sans-serif; }
  .btn{ margin-top:20px; background: linear-gradient(90deg, #003322, #006644); border:1.5px solid #00ff88; padding:11px 14px; border-radius:4px; cursor:pointer; color:#00ff88; font-weight:bold; width:100%; letter-spacing:2px; transition: all 0.25s; font-family:'Orbitron', sans-serif; }
  .btn:hover{ background: linear-gradient(90deg, #004433, #008855); box-shadow: 0 0 18px rgba(0,255,136,0.5); color:#fff; }
  .title-bar{ position:absolute; left:24px; top:20px; z-index:4; font-family:'Orbitron', sans-serif; font-weight:800; letter-spacing:3px; font-size:13px; color:#00ff88; opacity:0.9; text-shadow: 0 0 12px rgba(0,255,136,0.6); }
</style>
</head>
<body>
<div id="galaxy">
  <div class="title-bar">QUANTUM PULSE // HOLOMAPA GALÁCTICO — ALPHA</div>
  <svg id="routes"></svg>
  <div id="info-panel">
    <div id="info-status" class="status"></div>
    <h2 id="info-name"></h2>
    <p id="info-desc"></p>
    <p class="coord-line">COORD: <span id="info-coord"></span>  |  SECTOR: <span id="info-sector"></span></p>
    <button class="btn" onclick="closePanel()">CERRAR TRANSMISIÓN</button>
  </div>
</div>
<script>
const auraColors = {
  republic:   '#3ad4ff',
  separatist: '#ff4444',
  contested:  '#ffcc33',
  alpha:      '#00ff88',
  mandalore:  '#c9a0ff',
  neutral:    '#66ff99'
};

const planets = [
  { id: "coruscant", name: "CORUSCANT", x: 50, y: 47, size: 38, color: "#4da6ff", img: "./Coruscant_QP.png", status: "republic", statusText: "CAPITAL REPUBLICA", desc: "Núcleo galáctico y sede del Senado. Centro absoluto del poder político, militar y económico de la República.", sector: "Núcleo" },
  { id: "pulsar", name: "PULSAR", x: 54, y: 36, size: 34, color: "#00ffcc", status: "alpha", statusText: "BASTIÓN ALPHA — QP", desc: "Bastión escondido de la República Galáctica. Cuartel general secreto de Quantum Pulse.", sector: "Borde Exterior", main: true },
  { id: "kamino", name: "KAMINO", x: 28, y: 62, size: 30, color: "#8ecfff", img: "./Kamino_QP.png", status: "republic", statusText: "CONTROL REPUBLICA", desc: "Mundo oceánico extragaláctico. Principal centro de clonación de la República.", sector: "Extragaláctico" },
  { id: "anaxes", name: "ANAXES", x: 38, y: 58, size: 22, color: "#ffcc66", status: "republic", statusText: "BASE MILITAR", desc: "Fortaleza y academia de guerra de la República.", sector: "Núcleo" },
  { id: "geonosis", name: "GEONOSIS", x: 70, y: 60, size: 34, color: "#ff5533", img: "./Geonosis_QP.png", status: "separatist", statusText: "SEPARATISTA", desc: "Desierto rojizo bajo control separatista. Alberga las mayores fábricas de droides.", sector: "Borde Exterior" },
  { id: "umbara", name: "UMBARA", x: 66, y: 48, size: 19, color: "#9a66ff", status: "contested", statusText: "EN DISPUTA", desc: "El planeta de las sombras. Cubierto por una atmósfera perpetuamente oscura.", sector: "Borde Medio" },
  { id: "felucia", name: "FELUCIA", x: 42, y: 72, size: 30, color: "#66ff99", img: "./Felucia_QP.png", status: "contested", statusText: "EN DISPUTA", desc: "Selva bioluminiscente de proporciones colosales.", sector: "Borde Exterior" },
  { id: "mustafar", name: "MUSTAFAR", x: 78, y: 70, size: 17, color: "#ff3300", status: "separatist", statusText: "SEPARATISTA", desc: "Mundo volcánico de lava eterna.", sector: "Borde Exterior" },
  { id: "mandalore", name: "MANDALORE", x: 58, y: 42, size: 36, color: "#c9a0ff", img: "./Mandalore_QP.png", status: "mandalore", statusText: "MANDALORE", desc: "Mundo natal de los Mandalorianos. Neutralidad estratégica.", sector: "Borde Exterior" }
];

const routes = [
  { from: "coruscant", to: "anaxes",   type: "friendly" },
  { from: "coruscant", to: "pulsar",   type: "friendly" },
  { from: "pulsar",    to: "umbara",   type: "neutral"  },
  { from: "anaxes",    to: "kamino",   type: "friendly" },
  { from: "pulsar",    to: "geonosis", type: "hostile"  },
  { from: "umbara",    to: "felucia",  type: "neutral"  },
  { from: "pulsar",    to: "mandalore",type: "neutral"  },
  { from: "mandalore", to: "umbara",   type: "neutral"  },
  { from: "geonosis",  to: "mustafar", type: "friendly" },
  { from: "coruscant", to: "kamino",   type: "friendly" }
];

const galaxy = document.getElementById('galaxy');
const svg = document.getElementById('routes');
let selectedId = null;

function render(){
  galaxy.querySelectorAll('.planet').forEach(e => e.remove());
  svg.innerHTML = "";
  routes.forEach(r => {
    const pA = planets.find(p => p.id === r.from);
    const pB = planets.find(p => p.id === r.to);
    if (!pA || !pB) return;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", pA.x + "%");
    line.setAttribute("y1", pA.y + "%");
    line.setAttribute("x2", pB.x + "%");
    line.setAttribute("y2", pB.y + "%");
    line.classList.add(r.type);
    svg.appendChild(line);
  });
  planets.forEach(p => {
    const el = document.createElement('div');
    el.className = 'planet' + (selectedId === p.id ? ' selected' : '') + (p.main ? ' main' : '');
    el.dataset.id = p.id;
    el.style.left = p.x + '%';
    el.style.top = p.y + '%';
    el.style.width = p.size + 'px';
    el.style.height = p.size + 'px';
    el.style.color = p.color;
    if (p.img) {
      el.style.backgroundImage = `url('${p.img}')`;
      el.style.backgroundSize = "cover";
      el.style.backgroundPosition = "center";
      el.style.backgroundColor = "transparent";
    } else {
      el.style.backgroundColor = p.color;
    }
    if (selectedId === p.id) {
      const aura = auraColors[p.status] || p.color;
      el.style.boxShadow = `0 0 32px ${aura}, 0 0 65px ${aura}, 0 0 100px ${aura}, inset -6px -6px 14px rgba(0,0,0,0.9)`;
      el.style.borderColor = aura;
    }
    el.innerHTML = `<div class="planet-label">${p.name}</div>`;
    el.onclick = () => showInfo(p);
    galaxy.appendChild(el);
  });
}
function showInfo(p){
  selectedId = p.id;
  render();
  document.getElementById('info-panel').style.display = 'block';
  document.getElementById('info-name').innerText = p.name;
  document.getElementById('info-desc').innerText = p.desc;
  document.getElementById('info-coord').innerText = `X:${p.x} Y:${p.y}`;
  document.getElementById('info-sector').innerText = p.sector;
  const st = document.getElementById('info-status');
  st.innerText = p.statusText;
  st.className = 'status ' + p.status;
}
function closePanel(){
  document.getElementById('info-panel').style.display = 'none';
  selectedId = null;
  render();
}
render();
</script>
</body>
</html>
