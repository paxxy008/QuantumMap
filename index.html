<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTUM PULSE - CWRP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#00ff88;--green-dim:rgba(0,255,136,0.18);--blue:#00d4ff;--red:#ff2244;--yellow:#ffcc00;--violet:#a855f7;--orange:#ff7a00}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02080a;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff;user-select:none}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;background:#000;cursor:grab}
#world{width:2000px;height:1400px;background:url('./fondo.jpg') center/cover no-repeat, radial-gradient(ellipse at center,#0a1a14 0%,#02080a 70%,#000 100%);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center center}
svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg#routes line{stroke-width:1.4;stroke-linecap:round;opacity:0.9;filter:drop-shadow(0 0 4px currentColor)}
.route-rep{stroke:var(--blue)}.route-cis{stroke:var(--red)}.route-neutral{stroke:var(--yellow)}.route-mandalore{stroke:var(--violet)}.route-hutt{stroke:var(--orange)}
.planet{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:3;transition:transform.15s}
.planet-core{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;background-repeat:no-repeat;box-shadow:inset -6px -6px 12px rgba(0,0,0,0.85),0 0 0 1px var(--green);border:1px solid rgba(0,255,136,0.6)}
.planet-aura{position:absolute;inset:-12px;border-radius:50%;opacity:.6;filter:blur(10px);z-index:-1}
.planet:hover{transform:translate(-50%,-50%) scale(1.35)}
.planet-label{position:absolute;top:118%;left:50%;transform:translateX(-50%);font-family:'Orbitron';font-size:9.5px;font-weight:800;color:var(--green)!important;text-shadow:0 0 8px var(--green),0 0 18px var(--green);letter-spacing:1.2px;white-space:nowrap}
#title-box{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;border:1px solid var(--green);background:rgba(0,20,10,.9);padding:10px 32px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 20px var(--green)}
#title-box h1{font-family:'Orbitron';font-size:20px;letter-spacing:4px;color:var(--green);text-shadow:0 0 12px var(--green)}
#controls{position:fixed;left:16px;bottom:16px;z-index:20;display:flex;gap:8px}
.ctrl-btn{width:40px;height:40px;background:rgba(0,20,10,.9);border:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-weight:700;cursor:pointer}
.ctrl-btn:hover{background:var(--green);color:#000}
#overlay{position:fixed;inset:0;background:rgba(0,10,5,.65);z-index:30;display:none;backdrop-filter:blur(6px)}
#planet-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:94vw;max-width:620px;background:rgba(5,18,12,.98);border:1px solid var(--green);box-shadow:0 0 40px rgba(0,255,136,.35);display:none;overflow:hidden}
.modal-banner{height:180px;position:relative;background-size:cover;background-position:center;border-bottom:1px solid var(--green);overflow:hidden}
.modal-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg, rgba(5,18,12,1) 5%, rgba(5,18,12,.2) 60%, rgba(0,255,136,.15) 100%)}
.banner-info{position:absolute;left:16px;bottom:12px;z-index:2}
.banner-info h2{font-family:'Orbitron';font-size:24px;letter-spacing:3px;color:var(--green);text-shadow:0 0 12px var(--green)}
.banner-meta{font-size:11px;color:var(--green)}
.glitch-red{animation:glitchRed.35s infinite;filter:contrast(1.2) saturate(1.3)}
.glitch-red::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(255,0,0,.18) 0px, transparent 2px, transparent 4px);z-index:3;mix-blend-mode:screen}
@keyframes glitchRed{0%{transform:translate(0)}20%{transform:translate(-1px,1px)}60%{transform:translate(-1px,0);clip-path:inset(10% 0 20% 0)}}
.glitch-blue{animation:glitchBlue.6s infinite}
.glitch-blue::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(0,200,255,.15) 0px, transparent 3px);z-index:3}
@keyframes glitchBlue{0%,100%{transform:translate(0)}50%{transform:translate(0,.5px) scaleY(1.01)}}
.modal-tabs{display:flex;border-bottom:1px solid var(--green-dim)}
.tab{flex:1;padding:12px 6px;text-align:center;font-family:'Orbitron';font-size:10px;cursor:pointer;background:rgba(0,255,136,.04);color:var(--green);border-right:1px solid var(--green-dim)}
.tab.active{background:var(--green);color:#000;font-weight:700}
.tab-content{display:none}.tab-content.active{display:block}
.content-img{width:100%;height:150px;background-size:cover;background-position:center;border-bottom:1px solid var(--green-dim);position:relative}
.content-img-label{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.75);border:1px solid var(--green-dim);padding:2px 8px;font-family:'Orbitron';font-size:8px;color:var(--green);z-index:2}
.content-body{padding:16px;font-size:14px;line-height:1.55;color:#c8ffd8}
.close-btn{width:100%;padding:13px;background:rgba(0,255,136,.12);border:0;border-top:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-size:12px;letter-spacing:4px;font-weight:900;cursor:pointer;text-shadow:0 0 8px var(--green)}
.close-btn:hover{background:var(--green);color:#000;box-shadow:0 0 25px var(--green)}
.badge{display:inline-block;padding:3px 8px;border:1px solid var(--green);color:var(--green);background:rgba(0,255,136,0.15);font-family:'Orbitron';font-size:9px;margin-bottom:10px}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="routes"></svg></div></div>
<div id="title-box"><h1>QUANTUM PULSE - CWRP</h1></div>
<div id="controls"><button class="ctrl-btn" onclick="zoom(0.15);playSound(900,0.15)">+</button><button class="ctrl-btn" onclick="zoom(-0.15);playSound(700,0.15)">-</button><button class="ctrl-btn" onclick="resetView();playSound(500,0.15)" style="width:auto;padding:0 10px">RESET</button></div>
<div id="overlay" onclick="closeModal()"></div>
<div id="planet-modal">
<div id="banner" class="modal-banner"><div class="banner-info"><h2 id="b-name"></h2><div id="b-meta" class="banner-meta"></div></div></div>
<div class="modal-tabs"><div class="tab active" data-t="lore" onclick="switchTab('lore')">LORE</div><div class="tab" data-t="benef" onclick="switchTab('benef')">BENEFICIO</div><div class="tab" data-t="troops" onclick="switchTab('troops')">TROPAS / CIVILES / FAUNA</div></div>
<div id="tab-lore" class="tab-content active"><div id="img-lore" class="content-img"><span class="content-img-label">IMG_PLANET - VISTA ORBITAL</span></div><div class="content-body" id="text-lore"></div></div>
<div id="tab-benef" class="tab-content"><div id="img-benef" class="content-img"><span class="content-img-label">IMG_MAIN - INSTALACION</span></div><div class="content-body" id="text-benef"></div></div>
<div id="tab-troops" class="tab-content"><div id="img-troops" class="content-img"><span class="content-img-label">IMG_TROOPS - DESPLIEGUE</span></div><div class="content-body" id="text-troops"></div></div>
<button class="close-btn" onclick="closeModal()">CERRAR TRANSMISIÓN</button>
</div>
<script>
  const planets=[
{id:"hoth",name:"HOTH",x:220,y:140,color:"#00ff88",faction:"neutral",size:38,glitch:"blue",lore:"Planeta helado del Borde Exterior. Base Eco abandonada. Ventiscas nivel 4.",benef:"NEUTRAL: Cristales hielo +10% resistencia.",troops:"CIVILES: Contrabandistas. FAUNA: Wampa, Tauntaun.",imgPlanet:"./img/HOTH_qp_planet.png",imgMain:"./img/HOTH_qp_main.png",imgTroops:"./img/HOTH_qp_troops.png"},
{id:"anaxes",name:"ANAXES",x:480,y:320,color:"#00ff88",faction:"rep",size:40,lore:"Fortaleza naval legendaria República.",benef:"REP: Venator +20% daño flota.",troops:"Anaxes High Command, ARC.",imgPlanet:"./Anaxes_qp_planet.png",imgMain:"./img/ANAXES_qp_main.png",imgTroops:"./img/ANAXES_qp_troops.png"},
{id:"muunilinst",name:"MUUNILINST",x:620,y:180,color:"#00ff88",faction:"cis",size:36,lore:"Mundo bancario Clan Bancario.",benef:"CIS: +25% créditos.",troops:"Muun Guards, IG Droids.",imgPlanet:"./img/MUUNILINST_qp_planet.png",imgMain:"./img/MUUNILINST_qp_main.png",imgTroops:"./img/MUUNILINST_qp_troops.png"},
{id:"mygeeto",name:"MYGEETO",x:820,y:160,color:"#00ff88",faction:"cis",size:36,glitch:"blue",lore:"Mundo cristalino gélido.",benef:"CIS: Cristales para cañones.",troops:"Lurmen + Droides.",imgPlanet:"./img/MYGEETO_qp_planet.png",imgMain:"./img/MYGEETO_qp_main.png",imgTroops:"./img/MYGEETO_qp_troops.png"},
{id:"mandalore",name:"MANDALORE",x:980,y:300,color:"#a855f7",faction:"mandalore",size:42,lore:"Mundo Mandalorianos.",benef:"VIOLETA: Beskar limitado.",troops:"Mandalorianos, Death Watch.",imgPlanet:"./img/MANDALORE_qp_planet.png",imgMain:"./img/MANDALORE_qp_main.png",imgTroops:"./img/MANDALORE_qp_troops.png"},
{id:"christophsis",name:"CHRISTOPHSIS",x:1280,y:360,color:"#00ff88",faction:"cis",size:38,lore:"Planeta cristalino.",benef:"CIS: +12% daño cañones.",troops:"B1/B2, Sniper Droids.",imgPlanet:"./img/CHRISTOPHSIS_qp_planet.png",imgMain:"./img/CHRISTOPHSIS_qp_main.png",imgTroops:"./img/CHRISTOPHSIS_qp_troops.png"},
{id:"alderaan",name:"ALDERAAN",x:880,y:520,color:"#00ff88",faction:"rep",size:38,lore:"Planeta pacifista.",benef:"REP: +15% diplomacia.",troops:"Alderaan Security.",imgPlanet:"./img/ALDERAAN_qp_planet.png",imgMain:"./img/ALDERAAN_qp_main.png",imgTroops:"./img/ALDERAAN_qp_troops.png"},
{id:"coruscant",name:"CORUSCANT",x:1000,y:680,color:"#00ff88",faction:"rep",size:56,lore:"Capital galáctica. 5127 niveles.",benef:"REP: +15% créditos políticos.",troops:"Shock Troopers, Senate Commandos.",imgPlanet:"./img/CORUSCANT_qp_planet.png",imgMain:"./img/CORUSCANT_qp_main.png",imgTroops:"./img/CORUSCANT_qp_troops.png"},
{id:"moncala",name:"MON CALA",x:1180,y:480,color:"#00ff88",faction:"rep",size:40,lore:"Mundo oceánico Mon Calamari.",benef:"REP: Astilleros +20% cruceros.",troops:"Mon Calamari Guard.",imgPlanet:"./img/MONCALA_qp_planet.png",imgMain:"./img/MONCALA_qp_main.png",imgTroops:"./img/MONCALA_qp_troops.png"},
{id:"kashyyyk",name:"KASHYYYK",x:580,y:1080,color:"#00ff88",faction:"rep",size:42,lore:"Mundo Wookiee.",benef:"REP: Madera Wroshyr.",troops:"Wookiee Warriors.",imgPlanet:"./img/KASHYYYK_qp_planet.png",imgMain:"./img/KASHYYYK_qp_main.png",imgTroops:"./img/KASHYYYK_qp_troops.png"},
{id:"felucia",name:"FELUCIA",x:620,y:820,color:"#00ff88",faction:"neutral",size:36,lore:"Selva bioluminiscente.",benef:"NEUTRAL: +8% curación.",troops:"Acklay, Felucian.",imgPlanet:"./img/FELUCIA_qp_planet.png",imgMain:"./img/FELUCIA_qp_main.png",imgTroops:"./img/FELUCIA_qp_troops.png"},
{id:"dathomir",name:"DATHOMIR",x:760,y:620,color:"#00ff88",faction:"neutral",size:38,lore:"Mundo Hermanas de la Noche.",benef:"NEUTRAL: Ichor oscuro.",troops:"Nightsisters, Rancor.",imgPlanet:"./img/DATHOMIR_qp_planet.png",imgMain:"./img/DATHOMIR_qp_main.png",imgTroops:"./img/DATHOMIR_qp_troops.png"},
{id:"naboo",name:"NABOO",x:1080,y:860,color:"#00ff88",faction:"rep",size:40,lore:"Naboo y Gungans.",benef:"REP: Plasma +12% escudos.",troops:"Gungan Army.",imgPlanet:"./img/NABOO_qp_planet.png",imgMain:"./img/NABOO_qp_main.png",imgTroops:"./img/NABOO_qp_troops.png"},
{id:"geonosis",name:"GEONOSIS",x:840,y:1000,color:"#00ff88",faction:"cis",size:42,glitch:"red",lore:"Fábrica droides CIS. [ARENA ROJA]",benef:"CIS: -25% coste droides.",troops:"Geonosians, B1/B2.",imgPlanet:"./img/GEONOSIS_qp_planet.png",imgMain:"./img/GEONOSIS_qp_main.png",imgTroops:"./img/GEONOSIS_qp_troops.png"},
{id:"utapau",name:"UTAPAU",x:1360,y:720,color:"#00ff88",faction:"cis",size:36,lore:"Mundo sumideros.",benef:"CIS: Refugio oculto.",troops:"Utapau Security.",imgPlanet:"./img/UTAPAU_qp_planet.png",imgMain:"./img/UTAPAU_qp_main.png",imgTroops:"./img/UTAPAU_qp_troops.png"},
{id:"tatooine",name:"TATOOINE",x:1220,y:960,color:"#ff7a00",faction:"hutt",size:40,lore:"Desierto binario Hutt.",benef:"HUTT NARANJA: Mercado negro.",troops:"Mercenarios Hutt.",imgPlanet:"./img/TATOOINE_qp_planet.png",imgMain:"./img/TATOOINE_qp_main.png",imgTroops:"./img/TATOOINE_qp_troops.png"},
{id:"mustafar",name:"MUSTAFAR",x:1500,y:1020,color:"#00ff88",faction:"cis",size:42,glitch:"red",lore:"Mundo volcánico. [CALOR EXTREMO]",benef:"CIS: +18% droides.",troops:"Mustafarians.",imgPlanet:"./img/MUSTAFAR_qp_planet.png",imgMain:"./img/MUSTAFAR_qp_main.png",imgTroops:"./img/MUSTAFAR_qp_troops.png"},
{id:"rishi",name:"RISHI MOON",x:1580,y:780,color:"#00ff88",faction:"rep",size:34,lore:"Puesto escucha.",benef:"REP: +25% radar.",troops:"Shinies.",imgPlanet:"./img/RISHI_qp_planet.png",imgMain:"./img/RISHI_qp_main.png",imgTroops:"./img/RISHI_qp_troops.png"},
{id:"kamino",name:"KAMINO",x:1820,y:1180,color:"#00ff88",faction:"rep",size:38,lore:"Planeta clonadores.",benef:"REP: -20% coste clones.",troops:"Kaminoans, Clones.",imgPlanet:"./img/KAMINO_qp_planet.png",imgMain:"./img/KAMINO_qp_main.png",imgTroops:"./img/KAMINO_qp_troops.png"},
{id:"pulsar",name:"PULSAR",x:160,y:900,color:"#00ff88",faction:"rep",size:32,lore:"Estación relé. SOLO ruta directa a CORUSCANT.",benef:"REP: +30% holonet.",troops:"Técnicos.",imgPlanet:"./img/PULSAR_qp_planet.png",imgMain:"./img/PULSAR_qp_main.png",imgTroops:"./img/PULSAR_qp_troops.png"}
];
let routes=[["pulsar","coruscant"],["coruscant","alderaan"],["coruscant","anaxes"],["coruscant","naboo"],["coruscant","moncala"],["coruscant","christophsis"],["alderaan","mandalore"],["mandalore","mygeeto"],["mygeeto","muunilinst"],["muunilinst","christophsis"],["christophsis","utapau"],["anaxes","hoth"],["hoth","mandalore"],["kashyyyk","felucia"],["felucia","dathomir"],["dathomir","geonosis"],["geonosis","naboo"],["naboo","kashyyyk"],["naboo","tatooine"],["tatooine","mustafar"],["mustafar","rishi"],["mustafar","kamino"],["utapau","rishi"],["utapau","tatooine"],["tatooine","geonosis"],["moncala","kashyyyk"],["moncala","naboo"]];
let scale=1,tx=0,ty=0,isDragging=false,startX,startY;
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),svg=document.getElementById('routes');
function getRouteType(a,b){if(a==="pulsar"||b==="pulsar")return "rep";if(a==="mandalore"||b==="mandalore")return "mandalore";if(a==="tatooine"||b==="tatooine")return "hutt";const A=planets.find(p=>p.id===a),B=planets.find(p=>p.id===b);if(!A||!B)return "neutral";if(A.faction==="rep"&&B.faction==="rep")return "rep";if(A.faction==="cis"&&B.faction==="cis")return "cis";return "neutral"}
function render(){svg.innerHTML="";routes.forEach(r=>{const pA=planets.find(p=>p.id===r[0]),pB=planets.find(p=>p.id===r[1]);if(!pA||!pB)return;const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",pA.x);line.setAttribute("y1",pA.y);line.setAttribute("x2",pB.x);line.setAttribute("y2",pB.y);line.setAttribute("class","route-"+getRouteType(r[0],r[1]));svg.appendChild(line)});world.querySelectorAll('.planet').forEach(e=>e.remove());planets.forEach(p=>{const el=document.createElement('div');el.className='planet';el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.width=p.size+'px';el.style.height=p.size+'px';el.style.color=p.color;el.innerHTML="<div class='planet-aura' style='background:"+p.color+"'></div><div class='planet-core' style='background-image:url("+p.imgPlanet+");'></div><div class='planet-label'>"+p.name+"</div>";el.onclick=e=>{e.stopPropagation();openPlanet(p);playSound(880,0.16,'square')};el.onmouseenter=()=>playSound(1200,0.05,'sine');world.appendChild(el)})}
function openPlanet(p){document.getElementById('overlay').style.display='block';document.getElementById('planet-modal').style.display='block';const b=document.getElementById('banner');b.style.backgroundImage="url("+p.imgPlanet+")";b.className='modal-banner'+(p.glitch==='red'?' glitch-red':'')+(p.glitch==='blue'?' glitch-blue':'');document.getElementById('b-name').innerText=p.name;document.getElementById('b-meta').innerText="X:"+p.x+" Y:"+p.y+" // "+p.faction.toUpperCase();setTabImg('img-lore',p.imgPlanet,p.glitch);setTabImg('img-benef',p.imgMain,p.glitch);setTabImg('img-troops',p.imgTroops,p.glitch);document.getElementById('text-lore').innerHTML="<span class='badge'>LORE - "+p.name+"</span><br>"+p.lore;document.getElementById('text-benef').innerHTML="<span class='badge'>BENEFICIO / PRODUCCION</span><br>"+p.benef;document.getElementById('text-troops').innerHTML="<span class='badge'>TROPAS / CIVILES / FAUNA</span><br>"+p.troops;switchTab('lore')}
function setTabImg(id,url,glitch){const el=document.getElementById(id);el.style.backgroundImage="url("+url+")";el.className='content-img'+(glitch==='red'?' glitch-red':'')+(glitch==='blue'?' glitch-blue':'')}
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector('[data-t="'+t+'"]').classList.add('active');document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');playSound(650,0.09,'triangle')}
function closeModal(){document.getElementById('overlay').style.display='none';document.getElementById('planet-modal').style.display='none';playSound(280,0.14,'sawtooth')}
function applyTransform(){world.style.transform="translate(-50%,-50%) translate("+tx+"px,"+ty+"px) scale("+scale+")"}
function zoom(d){scale=Math.min(2.5,Math.max(0.45,scale+d));applyTransform()}
function resetView(){scale=1;tx=0;ty=0;applyTransform();playSound(500,0.12,'sine')}
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?-0.08:0.08);playSound(e.deltaY>0?600:900,0.06,'sine')},{passive:false});
viewport.addEventListener('mousedown',e=>{isDragging=true;startX=e.clientX-tx;startY=e.clientY-ty});
window.addEventListener('mousemove',e=>{if(!isDragging)return;tx=e.clientX-startX;ty=e.clientY-startY;applyTransform()});
window.addEventListener('mouseup',()=>isDragging=false);
var audioCtx;function playSound(f,v,t){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sawtooth';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.28);o.start();o.stop(audioCtx.currentTime+0.3)}catch(e){}}
render();
</script>
</body>
</html>
