<script>
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function tone(f,t,d,v=0.15){ try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d);}catch(e){} }
function sHover(){ tone(880,'sine',0.1,0.06); }
function sClick(){ tone(440,'triangle',0.15,0.18); setTimeout(()=>tone(880,'sine',0.22,0.1),60); }
function sOpen(){ tone(200,'sawtooth',0.3,0.12); setTimeout(()=>tone(660,'sine',0.45,0.14),110); }
function sClose(){ tone(660,'sine',0.18,0.1); setTimeout(()=>tone(180,'sawtooth',0.35,0.12),90); }
let currentPlanet=null,devClicks=0,rep=0,cis=0,cr=0;
function getRouteType(a,b){ if(a.status===b.status) return a.status.toLowerCase(); if(a.status==="Hostil"||b.status==="Hostil") return "hostil"; if(a.status==="Amigable"&&b.status==="Amigable") return "amigable"; return "neutral"; }
function updateBars(){
  document.getElementById('repBar').style.width=rep+'%';
  document.getElementById('cisBar').style.width=cis+'%';

  document.getElementById('repTxt').innerText=rep+'%';
  document.getElementById('cisTxt').innerText=cis+'%';
  document.getElementById('crTxt').innerText=cr+'%';
}

  routes.forEach(r=>{
    let a=planets.find(p=>p.id===r[0]), b=planets.find(p=>p.id===r[1]);
    if(!a||!b) return;
    let t=getRouteType(a,b);
    let col=t==="amigable"?"#3fa9ff":t==="hostil"?"#ff3b3b":"#ffdd55";
    svg.innerHTML+=`<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="${col}" stroke-width="4" stroke-dasharray="10 7" opacity="0.9"/>`;
  });
  planets.forEach(p=>{
    const dot=document.createElement('div');
    dot.className='planet-dot '+p.status.toLowerCase()+(p.glitch?' glitch':'');
    dot.style.left=p.x+'%'; dot.style.top=p.y+'%';
    dot.style.backgroundImage="url('"+p.imgPlanet+"')";
    dot.addEventListener('mouseenter', sHover);
    dot.addEventListener('click', ()=>{ sClick(); showPlanet(p.id); });
    const label=document.createElement('div');
    label.className='planet-label';
    label.style.left=p.x+'%'; label.style.top='calc('+p.y+'% + 34px)';
    label.style.color=p.status==='Hostil'?'#ff5566':p.status==='Amigable'?'#55aaff':'#ffdd55';
    label.innerText=p.id.toUpperCase();
    inner.appendChild(dot); inner.appendChild(label);
  });
  inner.appendChild(quick);
}
   </script>
   <script>
function showPlanet(id){
  const p=planets.find(x=>x.id===id); if(!p) return;
  currentPlanet=p;
  const img=document.getElementById('detailImg');
  const wrap=document.getElementById('detailImgWrap');
  img.src=p.imgMain;
  img.onerror=function(){ this.src=p.imgPlanet; };
  wrap.className='detail-img'+(p.glitch?' glitch':'');
  document.getElementById('detailName').innerText=p.id.toUpperCase();
  document.getElementById('detailMeta').innerText=p.sector+" // "+p.clima+" // "+p.status.toUpperCase();
  document.getElementById('detail').classList.add('open');
  switchTab('lore');
  sOpen();
  if(p.status==="Amigable"){ rep=Math.min(100,rep+2); cr=Math.min(100,cr+1); } else if(p.status==="Hostil"){ cis=Math.min(100,cis+2); } else { cr=Math.min(100,cr+1); }
  updateBars();
  const q=document.getElementById('quickBox');
  q.innerHTML="<div style=\"font-family:Orbitron;font-size:11px;color:var(--neon);margin-bottom:6px\">"+p.id.toUpperCase()+"</div>"+p.produccion.map(pr=>"<div style=\"display:flex;justify-content:space-between;font-family:'Share Tech Mono';font-size:9px;margin:4px 0\"><span>"+pr.label+"</span><span style=\"color:"+pr.color+"\">"+pr.value+"</span></div>").join('')+"<div style=\"margin-top:8px;padding:6px;border:1px dashed rgba(0,255,136,0.3);border-radius:6px;font-size:9px\"><b>BENEFICIO:</b><br>"+p.benefit+"</div>";
  q.style.left="calc("+p.x+"% + 38px)"; q.style.top="calc("+p.y+"% - 30px)";
  q.classList.add('active');
  clearTimeout(window._qTimer);
  window._qTimer=setTimeout(()=>q.classList.remove('active'),5000);
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('quickBox').classList.remove('active');
  sClose();
}
function switchTab(type){
  if(!currentPlanet) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const mapTab={lore:0,datos:1,fuerzas:2,unidades:3};
  const idx=mapTab[type];
  if(idx!==undefined) document.querySelectorAll('.tab')[idx].classList.add('active');
  const p=currentPlanet;
  const c=document.getElementById('detailContent');
  const col=p.status==='Hostil'?'#ff3344':p.status==='Amigable'?'#00aaff':'#ffd700';
  const badge="<div class=\"status-badge\" style=\"border-color:"+col+";color:"+col+"\">RUTA: "+p.status.toUpperCase()+" - "+p.faction+"</div>";
  if(type==='lore'){ c.innerHTML=badge+"<div><span style=\"color:var(--neon);font-family:Orbitron;font-size:10px\">LORE // 22 ABY:</span><br><br>"+p.lore+"<br><br><span style=\"color:var(--neon)\">CLIMA:</span> "+p.clima+"</div>"; }
  if(type==='datos'){ c.innerHTML=badge+"<div><span style=\"color:var(--neon)\">POBLACIÓN:</span> "+p.population+"<br><br><span style=\"color:var(--gold)\">BENEFICIO:</span> "+p.benefit+"<br><br>"+p.produccion.map(pr=>"<div style=\"display:flex;justify-content:space-between;font-size:11px;margin:10px 0 5px 0;font-family:Orbitron\"><span>"+pr.label+"</span><span style=\"color:"+pr.color+"\">"+pr.value+"</span></div><div style=\"width:100%;height:8px;background:rgba(255,255,255,0.08);border-radius:5px\"><div style=\"width:"+pr.pct+"%;height:100%;background:"+pr.color+"\"></div></div>").join('')+"</div>"; }
  if(type==='fuerzas'){ c.innerHTML=badge+"<div><span style=\"color:var(--neon)\">FUERZAS:</span><br>"+p.forces+"<br><br><span style=\"color:var(--neon)\">FAUNA:</span> "+p.fauna+"<br><br><span style=\"color:var(--neon)\">CIVILES:</span> "+p.civil+"</div>"; }
  if(type==='unidades'){ c.innerHTML=badge+"<div style=\"width:100%;height:240px;border:1px solid "+col+";border-radius:12px;overflow:hidden;background:#000\"><img src=\""+p.unitImg+"\" onerror=\"this.src='"+p.imgPlanet+"'\" style=\"width:100%;height:100%;object-fit:cover\"></div><div style=\"margin-top:10px;padding:10px;border:1px dashed rgba(0,255,136,0.25);border-radius:8px;font-size:10px;color:var(--neon)\">UNIDAD: "+p.faction+"<br>TROPAS: "+p.troops+"</div>"; }
}
   </script>
   <script>
function addRepublic(v){ rep=Math.min(100,rep+v); updateBars(); renderMap(); sOpen(); }
function addSeparatist(v){ cis=Math.min(100,cis+v); updateBars(); renderMap(); sClose(); }
function addCR(v){ cr=Math.min(100,cr+v); updateBars(); sOpen(); }
function resetWar(){ rep=0; cis=0; cr=0; updateBars(); renderMap(); closeDetail(); }
document.getElementById('title').addEventListener('click', ()=>{
  devClicks++; tone(600+devClicks*80,'sine',0.1,0.08);
  if(devClicks>=5){ document.getElementById('devControls').classList.toggle('active'); devClicks=0; sOpen(); }
  setTimeout(()=>{ if(devClicks>0&&devClicks<5) devClicks=0; },3000);
});
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeDetail(); });
window.addEventListener('load', ()=>{
  renderMap();
  initAudio();
  updateBars();
  document.getElementById('detail').classList.remove('open');
  document.getElementById('detailImg').src="";
});
   </script>
   <script>
let scale=1, panX=0, panY=0, startX=0, startY=0, isDragging=false, lastDist=0;
const mapEl=document.getElementById('map');
const innerEl=document.getElementById('mapInner');
function applyTransform(){ innerEl.style.transform="translate("+panX+"px, "+panY+"px) scale("+scale+")"; }
mapEl.addEventListener('mousedown', e=>{ isDragging=true; startX=e.clientX-panX; startY=e.clientY-panY; });
mapEl.addEventListener('mousemove', e=>{ if(!isDragging) return; panX=e.clientX-startX; panY=e.clientY-startY; applyTransform(); });
window.addEventListener('mouseup', ()=>isDragging=false);
mapEl.addEventListener('wheel', e=>{ e.preventDefault(); let d=e.deltaY>0?-0.1:0.1; scale=Math.min(Math.max(0.6,scale+d),3.5); applyTransform(); },{passive:false});
mapEl.addEventListener('touchstart', e=>{ if(e.touches.length===1){ isDragging=true; startX=e.touches[0].clientX-panX; startY=e.touches[0].clientY-panY; } else if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); } },{passive:false});
mapEl.addEventListener('touchmove', e=>{ e.preventDefault(); if(e.touches.length===1&&isDragging){ panX=e.touches[0].clientX-startX; panY=e.touches[0].clientY-startY; applyTransform(); } else if(e.touches.length===2){ let dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); if(lastDist>0){ scale=Math.min(Math.max(0.6,scale+(dist-lastDist)*0.01),3.5); applyTransform(); } lastDist=dist; } },{passive:false});
mapEl.addEventListener('touchend', ()=>{ isDragging=false; lastDist=0; });
mapEl.addEventListener('click', e=>{ if(e.target.id==='map'||e.target.id==='mapInner'||e.target.id==='svgRoutes') closeDetail(); });
   </script>
   <script>
document.addEventListener('DOMContentLoaded', ()=>{
  const walker=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n; while(n=walker.nextNode()){ if(n.nodeValue.includes('TROPAS REF')||n.nodeValue.trim()==='undefined') n.nodeValue=''; }
});
</script>
