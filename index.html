<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QUANTUM PULSE - CWRP // V7 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#00ff88;--green-dim:rgba(0,255,136,0.18);--green-soft:rgba(0,255,136,0.08);--blue:#00d4ff;--red:#ff2a4a;--yellow:#ffcc00;--violet:#a855f7;--orange:#ff7a00;--bg:#02080a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff;user-select:none;overscroll-behavior:none}
#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;background:#000;cursor:grab;touch-action:none}
#viewport.grabbing{cursor:grabbing}
#world{width:2600px;height:1800px;background:url('./fondo.jpg') center/cover no-repeat, radial-gradient(ellipse at 45% 50%, #0b1f18 0%, #050d0a 45%, #000 85%);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(0px,0px) scale(1);transform-origin:center center;will-change:transform}
#world::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,255,136,0.03) 0px, transparent 1px, transparent 3px);pointer-events:none;z-index:2}
svg#routes{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
svg#routes line{stroke-width:1.5;stroke-linecap:round;opacity:0.85;filter:drop-shadow(0 0 6px currentColor);stroke-dasharray:12 18;animation:dashMove 2s linear infinite}
@keyframes dashMove{to{stroke-dashoffset:-30}}
.route-rep{stroke:var(--blue)} .route-cis{stroke:var(--red)} .route-neutral{stroke:var(--yellow)} .route-mandalore{stroke:var(--violet)} .route-hutt{stroke:var(--orange)}

/* PLANETA ICONO 2026 */
.planet{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:4;transition:transform .18s cubic-bezier(.2,.8,.2,1), filter .18s}
.planet-core{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000;position:relative;box-shadow:inset -8px -8px 16px rgba(0,0,0,0.9), 0 0 0 1px rgba(0,255,136,0.9), 0 0 18px rgba(0,255,136,0.5);border:1px solid var(--green)}
.planet-core::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 25%, rgba(255,255,255,0.35) 0%, transparent 45%);pointer-events:none}
.planet-core img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;filter:saturate(1.15) contrast(1.1)}
.planet-aura{position:absolute;inset:-18px;border-radius:50%;opacity:.7;filter:blur(16px);z-index:-1;animation:pulseAura 2.4s ease-in-out infinite}
@keyframes pulseAura{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.12);opacity:.9}}
.planet:hover{transform:translate(-50%,-50%) scale(1.42);filter:brightness(1.25)}
.planet:hover .planet-aura{filter:blur(20px);opacity:1}
.planet-label{position:absolute;top:120%;left:50%;transform:translateX(-50%);font-family:'Orbitron';font-size:10px;font-weight:800;color:var(--green)!important;text-shadow:0 0 8px var(--green),0 0 20px var(--green);letter-spacing:1.8px;white-space:nowrap;background:rgba(0,0,0,0.65);border:1px solid var(--green-dim);padding:3px 8px;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}

#title-box{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;border:1px solid var(--green);background:linear-gradient(90deg, rgba(0,20,10,0.9), rgba(0,40,20,0.85));padding:10px 28px;backdrop-filter:blur(12px);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 25px rgba(0,255,136,0.4), inset 0 0 12px rgba(0,255,136,0.15)}
#title-box h1{font-family:'Orbitron';font-size:19px;letter-spacing:4px;color:var(--green);text-shadow:0 0 14px var(--green)}
#subtitle{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:19;font-family:'Orbitron';font-size:8px;letter-spacing:3px;opacity:.5;color:var(--green)}
#controls{position:fixed;left:14px;bottom:14px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;max-width:220px}
.ctrl-btn{height:42px;min-width:42px;padding:0 14px;background:rgba(0,20,12,0.85);border:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-weight:700;font-size:11px;cursor:pointer;backdrop-filter:blur(10px);box-shadow:0 0 12px var(--green-dim);transition:.15s}
.ctrl-btn:hover{background:var(--green);color:#000;box-shadow:0 0 22px var(--green)}
#joystick-hint{position:fixed;right:14px;bottom:14px;z-index:20;font-family:'Orbitron';font-size:7px;letter-spacing:1px;color:var(--green);opacity:.45;text-align:right;line-height:1.4;background:rgba(0,0,0,0.5);border:1px solid var(--green-dim);padding:8px 10px}

#overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center, rgba(0,40,20,0.4) 0%, rgba(0,10,5,0.8) 80%);z-index:30;display:none;backdrop-filter:blur(10px)}
#planet-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;width:94vw;max-width:680px;background:linear-gradient(180deg, rgba(10,28,18,0.98) 0%, rgba(5,15,10,0.98) 100%);border:1px solid var(--green);box-shadow:0 0 50px rgba(0,255,136,0.35), 0 0 120px rgba(0,255,136,0.15), inset 0 0 30px rgba(0,255,136,0.07);display:none;overflow:hidden;backdrop-filter:blur(18px)}
.modal-banner{height:200px;position:relative;background-size:cover;background-position:center;border-bottom:1px solid var(--green);overflow:hidden}
.modal-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg, rgba(5,18,12,1) 8%, rgba(5,18,12,.15) 60%, rgba(0,255,136,.18) 100%)}
.modal-banner::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg, transparent 0px, rgba(0,255,136,0.04) 1px, transparent 2px);z-index:1}
.banner-info{position:absolute;left:18px;bottom:14px;z-index:2}
.banner-info h2{font-family:'Orbitron';font-size:26px;letter-spacing:3px;color:var(--green);text-shadow:0 0 14px var(--green), 0 0 30px var(--green)}
.banner-meta{font-size:11px;color:var(--green);letter-spacing:1px;opacity:.85;margin-top:4px;font-family:'Orbitron'}
.glitch-red{animation:glitchRed .32s infinite;filter:contrast(1.25) saturate(1.4)}
.glitch-red::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(255,0,60,.18) 0px, transparent 2px);mix-blend-mode:screen;z-index:3}
@keyframes glitchRed{0%{transform:translate(0)}25%{transform:translate(-1px,1px);clip-path:inset(5% 0 15% 0)}50%{transform:translate(1px,-1px)}}
.glitch-blue{animation:glitchBlue .7s infinite}
.glitch-blue::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(0,220,255,.14) 0px, transparent 3px);z-index:3}
@keyframes glitchBlue{0%,100%{transform:translate(0)}50%{transform:translate(0,1px) scaleY(1.02)}}
.modal-tabs{display:flex;border-bottom:1px solid rgba(0,255,136,0.2);background:rgba(0,0,0,0.3)}
.tab{flex:1;padding:14px 6px;text-align:center;font-family:'Orbitron';font-size:10px;letter-spacing:1px;cursor:pointer;background:rgba(0,255,136,.04);color:var(--green);border-right:1px solid rgba(0,255,136,0.15);position:relative;transition:.2s}
.tab::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:2px;background:var(--green);transform:scaleX(0);transition:.2s;box-shadow:0 0 8px var(--green)}
.tab.active{background:linear-gradient(180deg, rgba(0,255,136,0.18), rgba(0,255,136,0.08));color:#fff;font-weight:800;text-shadow:0 0 10px var(--green)}
.tab.active::after{transform:scaleX(1)}
.tab-content{display:none}.tab-content.active{display:block;animation:tabIn .25s ease}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.content-img{width:100%;height:165px;background-size:cover;background-position:center;border-bottom:1px solid rgba(0,255,136,0.15);position:relative}
.content-img-label{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.8);border:1px solid var(--green-dim);padding:3px 10px;font-family:'Orbitron';font-size:8px;color:var(--green);z-index:2;letter-spacing:1px}
.content-body{padding:18px;font-size:14px;line-height:1.6;color:#c8ffdd}
.close-btn{width:100%;padding:14px;background:linear-gradient(90deg, rgba(0,255,136,0.12), rgba(0,255,136,0.06));border:0;border-top:1px solid var(--green);color:var(--green);font-family:'Orbitron';font-size:12px;letter-spacing:4px;font-weight:900;cursor:pointer;text-shadow:0 0 10px var(--green);transition:.15s}
.close-btn:hover{background:var(--green);color:#000;box-shadow:0 0 30px var(--green)}
.badge{display:inline-block;padding:4px 10px;border:1px solid var(--green);color:var(--green);background:rgba(0,255,136,0.14);font-family:'Orbitron';font-size:9px;margin-bottom:10px;letter-spacing:1px;box-shadow:0 0 10px var(--green-dim)}
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="routes"></svg></div></div>
<div id="title-box"><h1>QUANTUM PULSE - CWRP</h1></div>
<div id="subtitle">DRAG PARA MOVER • SCROLL PARA ZOOM • <div>
<div id="controls">
  <button class="ctrl-btn" onclick="zoom(0.18);playSfx('zoomIn')">+</button>
  <button class="ctrl-btn" onclick="zoom(-0.18);playSfx('zoomOut')">-</button>
  <button class="ctrl-btn" onclick="resetView();playSfx('reset')" style="flex:1">RESET</button>
  <button class="ctrl-btn" onclick="moveMap(180,0);playSfx('pan')">◀</button>
  <button class="ctrl-btn" onclick="moveMap(-180,0);playSfx('pan')">▶</button>
  <button class="ctrl-btn" onclick="moveMap(0,140);playSfx('pan')">▲</button>
  <button class="ctrl-btn" onclick="moveMap(0,-140);playSfx('pan')">▼</button>
</div>
<div id="joystick-hint">CLICK + ARRASTRAR<br>PARA MOVER MAPA<br><br>W A S D • FLECHAS<br>SCROLL = ZOOM</div>
<div id="overlay" onclick="closeModal()"></div>
<div id="planet-modal">
<div id="banner" class="modal-banner"><div class="banner-info"><h2 id="b-name"></h2><div id="b-meta" class="banner-meta"></div></div></div>
<div class="modal-tabs"><div class="tab active" data-t="lore" onclick="switchTab('lore')">LORE</div><div class="tab" data-t="benef" onclick="switchTab('benef')">BENEFICIO</div><div class="tab" data-t="troops" onclick="switchTab('troops')">TROPAS / FAUNA</div></div>
<div id="tab-lore" class="tab-content active"><div id="img-lore" class="content-img"><span class="content-img-label">IMG_PLANET - ORBITAL SCAN</span></div><div class="content-body" id="text-lore"></div></div>
<div id="tab-benef" class="tab-content"><div id="img-benef" class="content-img"><span class="content-img-label">IMG_MAIN - INSTALACION</span></div><div class="content-body" id="text-benef"></div></div>
<div id="tab-troops" class="tab-content"><div id="img-troops" class="content-img"><span class="content-img-label">IMG_TROOPS - DESPLIEGUE</span></div><div class="content-body" id="text-troops"></div></div>
<button class="close-btn" onclick="closeModal()">⟡ CERRAR TRANSMISIÓN ⟡</button>
</div>
<script>
  const planets=[
{id:"hoth",name:"HOTH",x:320,y:200,color:"#00ff88",faction:"neutral",size:40,glitch:"blue",lore:`Helado Borde Exterior. Base Eco abandonada. Ventiscas nivel 4. Eco de señal rebelde. [DISTORSION CELESTE ACTIVA]`,benef:`NEUTRAL: Cristales de hielo para enfriamiento de cañones. +12% resistencia sobrecalentamiento. Recurso: Glacial Core.`,troops:`CIVILES: Contrabandistas, exploradores. FAUNA: Wampa (depredador ápice), Tauntaun (montura). TROPAS: Ninguna permanente.`,imgPlanet:"./img/Hoth_qp_planet.png",imgMain:"./img/HOTH_qp_main.png",imgTroops:"./img/HOTH_qp_troops.png"},
{id:"anaxes",name:"ANAXES",x:620,y:420,color:"#00ff88",faction:"rep",size:50,lore:`Fortaleza naval legendaria de la República. Centro de estrategia y doctrina de guerra. Academia de oficiales.`,benef:`REP: Desbloquea cruceros Venator +22% daño flota. Producción de oficiales +15%.`,troops:`TROPAS: Anaxes High Command, ARC Troopers, Naval Officers. CIVILES: Almirantes, estrategas.`,imgPlanet:"./img/Anaxes_qp_planet.png",imgMain:"./img/ANAXES_qp_main.png",imgTroops:"./img/ANAXES_qp_troops.png"},
{id:"muunilinst",name:"MUUNILINST",x:780,y:240,color:"#00ff88",faction:"cis",size:42,lore:`Mundo bancario del Clan Bancario Intergaláctico. Torres de crédito infinitas. Sede financiera CIS.`,benef:`CIS: +28% créditos, control bancario. Permite préstamos de guerra.`,troops:`TROPAS: Muun Guards, IG Droids. CIVILES: Banqueros Muun, ejecutivos.`,imgPlanet:"./img/Muunilinst_qp_planet.png",imgMain:"./img/MUUNILINST_qp_main.png",imgTroops:"./img/MUUNILINST_qp_troops.png"},
{id:"mygeeto",name:"MYGEETO",x:1020,y:200,color:"#00ff88",faction:"cis",size:40,glitch:"blue",lore:`Mundo cristalino gélido, bóvedas del Clan Bancario. Tormentas de cristales Kyber degradados.`,benef:`CIS: Cristales para cañones pesados. Bóvedas con 10k créditos.`,troops:`TROPAS: Lurmen + Droides. FAUNA: Crystal worm. CIVILES: Custodios de bóveda.`,imgPlanet:"./img/Mygeeto_qp_planet.png",imgMain:"./img/MYGEETO_qp_main.png",imgTroops:"./img/MYGEETO_qp_troops.png"},
{id:"mandalore",name:"MANDALORE",x:1200,y:380,color:"#a855f7",faction:"mandalore",size:48,lore:`Mundo de los Mandalorianos. Cultura guerrera del Beskar. Neutral pero letal. Códigos de honor.`,benef:`VIOLETA: Acceso Beskar limitado, mercenarios Death Watch +18% daño cuerpo a cuerpo.`,troops:`TROPAS: Mandalorianos, Death Watch, True Mandalorians. FAUNA: Mythosaur (leyenda).`,imgPlanet:"./img/Mandalore_qp_planet.png",imgMain:"./img/MANDALORE_qp_main.png",imgTroops:"./img/MANDALORE_qp_troops.png"},
{id:"christophsis",name:"CHRISTOPHSIS",x:1560,y:420,color:"#00ff88",faction:"cis",size:42,lore:`Planeta cristalino, rascacielos de cristal azul. Batalla urbana prolongada. Refracción láser.`,benef:`CIS: Cristales para turbolasers +14% daño. Cristal de enfoque.`,troops:`TROPAS: Droides B1/B2, Sniper Droids. CIVILES: Christophsian elders.`,imgPlanet:"./img/Christophsis_qp_planet.png",imgMain:"./img/CHRISTOPHSIS_qp_main.png",imgTroops:"./img/CHRISTOPHSIS_qp_troops.png"},
{id:"alderaan",name:"ALDERAAN",x:1080,y:640,color:"#00ff88",faction:"rep",size:44,lore:`Planeta pacifista, montañas y lagos. Cultura artística y diplomática. Sin armas.`,benef:`REP: +18% diplomacia, alimentos premium y medicinas. Bacta refinada.`,troops:`TROPAS: Alderaan Security (defensiva). CIVILES: Senador Bail Organa, artistas.`,imgPlanet:"./img/Alderaan_qp_planet.png",imgMain:"./img/ALDERAAN_qp_main.png",imgTroops:"./img/ALDERAAN_qp_troops.png"},
{id:"coruscant",name:"CORUSCANT",x:1220,y:820,color:"#00ff88",faction:"rep",size:60,lore:`Capital galáctica. Ciudad-planeta de 5,127 niveles. Sede del Senado y Templo Jedi. Trillones de habitantes.`,benef:`REP: +18% créditos políticos, acceso equipo Senado, archivos Jedi, rutas azules prioritarias.`,troops:`TROPAS: Coruscant Guard Shock Troopers, Senate Commandos. CIVILES: Canciller, Senadores, Jedi.`,imgPlanet:"./img/Coruscant_qp_planet.png",imgMain:"./img/CORUSCANT_qp_main.png",imgTroops:"./img/CORUSCANT_qp_troops.png"},
{id:"moncala",name:"MON CALA",x:1420,y:600,color:"#00ff88",faction:"rep",size:44,lore:`Mundo oceánico de los Mon Calamari y Quarren. Astilleros navales gigantes bajo el mar.`,benef:`REP: Astilleros Mon Cala +24% producción cruceros MC. Escudos de agua.`,troops:`TROPAS: Mon Calamari Guard. CIVILES: Mon Calamari, Quarren. FAUNA: Whaladon, Krakana.`,imgPlanet:"./img/Moncala_qp_planet.png",imgMain:"./img/MONCALA_qp_main.png",imgTroops:"./img/MONCALA_qp_troops.png"},
{id:"kashyyyk",name:"KASHYYYK",x:720,y:1320,color:"#00ff88",faction:"rep",size:46,lore:`Mundo bosque Wookiee. Árboles Wroshyr de km de altura. Plataformas en copa de árboles.`,benef:`REP: Madera Wroshyr para cascos. Guerreros Wookiee aliados +20% fuerza bruta.`,troops:`TROPAS: Wookiee Warriors, Chieftain Tarfful. FAUNA: Wyyyschokk, Katarn, Webweaver.`,imgPlanet:"./img/Kashyyyk_qp_planet.png",imgMain:"./img/KASHYYYK_qp_main.png",imgTroops:"./img/KASHYYYK_qp_troops.png"},
{id:"felucia",name:"FELUCIA",x:760,y:1020,color:"#00ff88",faction:"neutral",size:40,lore:`Selva bioluminiscente, plantas gigantes carnívoras. Esporas alucinógenas.`,benef:`NEUTRAL: Ingredientes medicinales +10% curación. Nysillin curativo.`,troops:`FAUNA: Acklay, Felucian nativos, Jungle Rancor. TROPAS: Shamans Felucian.`,imgPlanet:"./img/Felucia_qp_planet.png",imgMain:"./img/FELUCIA_qp_main.png",imgTroops:"./img/FELUCIA_qp_troops.png"},
{id:"dathomir",name:"DATHOMIR",x:940,y:780,color:"#ff2244",faction:"neutral",size:42,lore:`Mundo brumoso de las Hermanas de la Noche. Magia oscura y Rancors. Niebla de Ichor.`,benef:`NEUTRAL: Conocimiento oscuro, Nightsister Ichor +15% daño oscuro. Mercenarios peligrosos.`,troops:`TROPAS: Nightsisters, Nightbrothers, Mother Talzin. FAUNA: Rancor, Sleeper, Nydak.`,imgPlanet:"./img/Dathomir_qp_planet.png",imgMain:"./img/DATHOMIR_qp_main.png",imgTroops:"./img/DATHOMIR_qp_troops.png"},
{id:"naboo",name:"NABOO",x:1320,y:1060,color:"#00ff88",faction:"rep",size:44,lore:`Mundo elegante de Naboo. Humanos y Gungans en simbiosis. Cascadas y plasma.`,benef:`REP: Plasma de Naboo +14% escudos. Naves N-1 Starfighter.`,troops:`TROPAS: Gungan Grand Army, Naboo Security, Royal Guard. FAUNA: Kaadu, Fambaa, Opee.`,imgPlanet:"./img/Naboo_qp_planet.png",imgMain:"./img/NABOO_qp_main.png",imgTroops:"./img/NABOO_qp_troops.png"},
{id:"geonosis",name:"GEONOSIS",x:1040,y:1220,color:"#00ff88",faction:"cis",size:46,glitch:"red",lore:`Colmenas rocosas de Geonosis. Fábrica principal de droides de la CSI. [SEÑAL INESTABLE - ARENA ROJA - FILTRO ROJO]`,benef:`CIS: -28% coste producción droides. Fábrica de Droidekas y Super Battle Droids. Geonosian alloy.`,troops:`TROPAS: Geonosian Warriors, B1/B2, Droidekas, Super Battle Droid. CIVILES: Archiduque Poggle. FAUNA: Orray, Massiff, Acklay.`,imgPlanet:"./img/Geonosis_qp_planet.png",imgMain:"./img/GEONOSIS_qp_main.png",imgTroops:"./img/GEONOSIS_qp_troops.png"},
{id:"utapau",name:"UTAPAU",x:1640,y:880,color:"#00ff88",faction:"cis",size:40,lore:`Mundo de sumideros profundos. Ciudad en pozos gigantescos. Vientos fuertes.`,benef:`CIS: Refugio oculto, varactyls para reconocimiento +20% visión.`,troops:`TROPAS: Utapau Security. CIVILES: Pau'ans, Utai. FAUNA: Varactyl, Dactillion, Nos Monster.`,imgPlanet:"./img/Utapau_qp_planet.png",imgMain:"./img/UTAPAU_qp_main.png",imgTroops:"./img/UTAPAU_qp_troops.png"},
{id:"tatooine",name:"TATOOINE",x:1480,y:1160,color:"#ff7a00",faction:"hutt",size:44,lore:`Desierto binario controlado por el Cartel Hutt. Soles gemelos. Podracing y especias.`,benef:`HUTT NARANJA: Mercado negro, especia, apuestas +22% créditos ilícitos.`,troops:`TROPAS: Mercenarios Hutt, Bounty Hunters. CIVILES: Jawas, Tusken. FAUNA: Krayt Dragon, Sarlacc, Bantha.`,imgPlanet:"./img/Tatooine_qp_planet.png",imgMain:"./img/TATOOINE_qp_main.png",imgTroops:"./img/TATOOINE_qp_troops.png"},
{id:"mustafar",name:"MUSTAFAR",x:1800,y:1240,color:"#00ff88",faction:"cis",size:46,glitch:"red",lore:`Mundo volcánico de lava. Fundiciones separatistas a 800°C. Alta distorsión de señal por calor extremo. [TRANSMISION INESTABLE - CALOR EXTREMO - FILTRO ROJO]`,benef:`CIS: +20% producción de droides de combate. Minerales Mustafarian steel resistente al calor.`,troops:`TROPAS: Droides B2, Mustafarian lava guards. CIVILES: Técnicos Separatistas. FAUNA: Lava flea, Kaadu de lava.`,imgPlanet:"./img/Mustafar_qp_planet.png",imgMain:"./img/MUSTAFAR_qp_main.png",imgTroops:"./img/MUSTAFAR_qp_troops.png"},
{id:"rishi",name:"RISHI MOON",x:1880,y:960,color:"#00ff88",faction:"rep",size:38,lore:`Luna rocosa puesto de escucha avanzado de la República. Niebla y anguilas.`,benef:`REP: +28% rango radar, detección temprana CIS. Alerta de invasión.`,troops:`TROPAS: Domino Squad, Shinies. FAUNA: Rishi Eel, Rishi bird.`,imgPlanet:"./img/Rishi_qp_planet.png",imgMain:"./img/RISHI_qp_main.png",imgTroops:"./img/RISHI_qp_troops.png"},
{id:"kamino",name:"KAMINO",x:2180,y:1420,color:"#00ff88",faction:"rep",size:42,lore:`Planeta oceánico clonadores. Tormentas eternas. Ciudades en pilotes sobre el océano.`,benef:`REP: -22% coste tropas clon. Clonación avanzada +15% HP clones.`,troops:`TROPAS: Kaminoans, Clone Troopers, ARC Troopers. FAUNA: Aiwhas, Colo claw fish.`,imgPlanet:"./img/Kamino_qp_planet.png",imgMain:"./img/KAMINO_qp_main.png",imgTroops:"./img/KAMINO_qp_troops.png"},
{id:"pulsar",name:"PULSAR",x:200,y:1080,color:"#00ff88",faction:"rep",size:36,lore:`Estación relé Pulsar. Nodo hiperespacial clase-A. SOLO conectada directamente a CORUSCANT por protocolo de seguridad Delta. Canal encriptado cuántico.`,benef:`REP: +32% velocidad de transmisión holonet. Acceso exclusivo canal encriptado Coruscant. Prioridad Alpha.`,troops:`TROPAS: Técnicos de comunicaciones, Coruscant Guard. FAUNA: N/A - estación artificial. SISTEMA: Relay pulsado.`,imgPlanet:"./img/Pulsar_qp_planet.png",imgMain:"./img/PULSAR_qp_main.png",imgTroops:"./img/PULSAR_qp_troops.png"}
];
let routes=[["pulsar","coruscant"],["coruscant","alderaan"],["coruscant","anaxes"],["coruscant","naboo"],["coruscant","moncala"],["coruscant","christophsis"],["alderaan","mandalore"],["mandalore","mygeeto"],["mygeeto","muunilinst"],["muunilinst","christophsis"],["christophsis","utapau"],["anaxes","hoth"],["hoth","mandalore"],["kashyyyk","felucia"],["felucia","dathomir"],["dathomir","geonosis"],["geonosis","naboo"],["naboo","kashyyyk"],["naboo","tatooine"],["tatooine","mustafar"],["mustafar","rishi"],["mustafar","kamino"],["utapau","rishi"],["utapau","tatooine"],["tatooine","geonosis"],["moncala","kashyyyk"],["moncala","naboo"],["alderaan","christophsis"]];
  let scale=1,tx=0,ty=0,isDragging=false,startX,startY,lastX=0,lastY=0,velX=0,velY=0;
const world=document.getElementById('world'),viewport=document.getElementById('viewport'),svg=document.getElementById('routes');
function getRouteType(a,b){if(a==="pulsar"||b==="pulsar")return "rep";if(a==="mandalore"||b==="mandalore")return "mandalore";if(a==="tatooine"||b==="tatooine")return "hutt";const A=planets.find(p=>p.id===a),B=planets.find(p=>p.id===b);if(!A||!B)return "neutral";if(A.faction==="rep"&&B.faction==="rep")return "rep";if(A.faction==="cis"&&B.faction==="cis")return "cis";return "neutral"}
function render(){svg.innerHTML="";routes.forEach(r=>{const pA=planets.find(p=>p.id===r[0]),pB=planets.find(p=>p.id===r[1]);if(!pA||!pB)return;const line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",pA.x);line.setAttribute("y1",pA.y);line.setAttribute("x2",pB.x);line.setAttribute("y2",pB.y);line.setAttribute("class","route-"+getRouteType(r[0],r[1]));svg.appendChild(line)});world.querySelectorAll('.planet').forEach(e=>e.remove());planets.forEach(p=>{const el=document.createElement('div');el.className='planet';el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.width=p.size+'px';el.style.height=p.size+'px';el.style.color=p.color;el.innerHTML=`<div class='planet-aura' style='background:${p.color}'></div><div class='planet-core'><img src="${p.imgPlanet}" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.style.display='none';this.parentElement.style.background='${p.color}';console.error('FALLO IMG: '+this.src)"></div><div class='planet-label'>${p.name}</div>`;el.onclick=e=>{e.stopPropagation();openPlanet(p);playSfx('open')};el.onmouseenter=()=>playSfx('hover');world.appendChild(el)})}
function openPlanet(p){document.getElementById('overlay').style.display='block';document.getElementById('planet-modal').style.display='block';const b=document.getElementById('banner');b.style.backgroundImage="url("+p.imgPlanet+")";b.className='modal-banner'+(p.glitch==='red'?' glitch-red':'')+(p.glitch==='blue'?' glitch-blue':'');document.getElementById('b-name').innerText=p.name;document.getElementById('b-meta').innerText=`COORD X:${p.x} Y:${p.y} // ${p.faction.toUpperCase()} // QP-2026 SCAN`;setTabImg('img-lore',p.imgPlanet,p.glitch);setTabImg('img-benef',p.imgMain,p.glitch);setTabImg('img-troops',p.imgTroops,p.glitch);document.getElementById('text-lore').innerHTML=`<span class='badge'>LORE • ${p.name}</span><br>${p.lore}<br><br><span style="opacity:.5;font-size:11px;font-family:Orbitron">IMG_PLANET: ${p.imgPlanet}</span>`;document.getElementById('text-benef').innerHTML=`<span class='badge'>BENEFICIO / PRODUCCION • 2026</span><br>${p.benef}<br><br><span style="opacity:.5;font-size:11px;font-family:Orbitron">IMG_MAIN: ${p.imgMain}</span>`;document.getElementById('text-troops').innerHTML=`<span class='badge'>TROPAS / CIVILES / FAUNA</span><br>${p.troops}<br><br><span style="opacity:.5;font-size:11px;font-family:Orbitron">IMG_TROOPS: ${p.imgTroops}</span>`;switchTab('lore')}
function setTabImg(id,url,glitch){const el=document.getElementById(id);el.style.backgroundImage="url("+url+")";el.className='content-img'+(glitch==='red'?' glitch-red':'')+(glitch==='blue'?' glitch-blue':'')}
function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector(`[data-t="${t}"]`).classList.add('active');document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');playSfx('tab')}
function closeModal(){document.getElementById('overlay').style.display='none';document.getElementById('planet-modal').style.display='none';playSfx('close')}
function applyTransform(){world.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`}
function zoom(d){scale=Math.min(3.2,Math.max(0.35,scale+d));applyTransform()}
function resetView(){scale=1;tx=0;ty=0;applyTransform()}
function moveMap(dx,dy){tx+=dx;ty+=dy;applyTransform()}

// DRAG + TOUCH 2026
viewport.addEventListener('mousedown',e=>{isDragging=true;viewport.classList.add('grabbing');startX=e.clientX-tx;startY=e.clientY-ty;lastX=e.clientX;lastY=e.clientY;velX=0;velY=0});
window.addEventListener('mousemove',e=>{if(!isDragging)return;tx=e.clientX-startX;ty=e.clientY-startY;velX=e.clientX-lastX;velY=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform()});
window.addEventListener('mouseup',()=>{if(!isDragging)return;isDragging=false;viewport.classList.remove('grabbing');let f=0.92;function inertia(){if(Math.abs(velX)<0.1&&Math.abs(velY)<0.1)return;tx+=velX;ty+=velY;velX*=f;velY*=f;applyTransform();requestAnimationFrame(inertia)} inertia()});
viewport.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];isDragging=true;startX=t.clientX-tx;startY=t.clientY-ty;lastX=t.clientX;lastY=t.clientY},{passive:false});
viewport.addEventListener('touchmove',e=>{if(!isDragging||e.touches.length!==1)return;e.preventDefault();const t=e.touches[0];tx=t.clientX-startX;ty=t.clientY-startY;velX=t.clientX-lastX;velY=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;applyTransform()},{passive:false});
viewport.addEventListener('touchend',()=>{isDragging=false});
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?-0.09:0.09);playSfx(e.deltaY>0?'zoomOut':'zoomIn')},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')moveMap(80,0);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')moveMap(-80,0);if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')moveMap(0,80);if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')moveMap(0,-80);if(e.key==='+'||e.key==='=')zoom(0.12);if(e.key==='-'||e.key==='_')zoom(-0.12)});

// SONIDOS 2026 - SINTETIZADOS NO RETRO
let audioCtx;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function playTone(freq,type,vol,dur,detune=0,filterFreq=4000){try{ensureAudio();const o=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type=type;o.frequency.value=freq;o.detune.value=detune;o2.type=type;o2.frequency.value=freq*1.007;f.type='lowpass';f.frequency.value=filterFreq;f.Q.value=8;g.gain.setValueAtTime(0,audioCtx.currentTime);g.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);o.connect(f);o2.connect(f);f.connect(g);g.connect(audioCtx.destination);o.start();o2.start();o.stop(audioCtx.currentTime+dur);o2.stop(audioCtx.currentTime+dur)}catch(e){}}
function playSfx(name){switch(name){
  case 'hover': playTone(1200,'sine',0.06,0.18,0,6000); break;
  case 'open': playTone(220,'sawtooth',0.18,0.45,0,2000); setTimeout(()=>playTone(880,'sine',0.12,0.5,0,5000),80); break;
  case 'close': playTone(800,'triangle',0.14,0.35, -200, 1500); setTimeout(()=>playTone(180,'sawtooth',0.12,0.4,0,800),60); break;
  case 'tab': playTone(650,'triangle',0.10,0.22,0,3500); playTone(1300,'sine',0.05,0.25,0,6000); break;
  case 'zoomIn': playTone(900,'sine',0.07,0.15,0,4000); break;
  case 'zoomOut': playTone(500,'sine',0.07,0.15,0,3000); break;
  case 'pan': playTone(300,'sine',0.05,0.12,0,2000); break;
  case 'reset': playTone(400,'square',0.10,0.3,0,1200); setTimeout(()=>playTone(800,'sine',0.10,0.4),120); break;
  default: playTone(600,'sine',0.08,0.2); break;
}}
render();
</script>
</body>
</html>
